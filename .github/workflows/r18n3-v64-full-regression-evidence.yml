name: R18N.3 v6.4 Full Regression Evidence

on:
  pull_request:
    branches:
      - feature/r18n3-v6-4-swept-contact-temporal-eligibility

permissions:
  contents: read

jobs:
  capture-first-full-regression-failure:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/r18n3-v6-4-swept-contact-temporal-eligibility
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Apply exact R18N candidate chain
        run: |
          node tools/action-studio/r18n1-stable-active-intercept-migration.mjs
          node tools/action-studio/r18n3-active-intercept-last-writer-migration.mjs
          node tools/action-studio/r18n3-fixed-target-arm-closure-migration.mjs
          node tools/action-studio/r18n3-active-window-boundary-migration.mjs
          node tools/action-studio/r18n3-swept-contact-temporal-eligibility-migration.mjs
          node tools/action-studio/r18n3-swept-contact-temporal-eligibility-test-migration.mjs
          node tools/action-studio/r18n3-r18m-legacy-ownership-test-migration.mjs
          node tools/action-studio/r18n3-r18m-precontact-ownership-test-migration.mjs
      - name: Capture first failing full-regression assertion
        shell: bash
        run: |
          set +e
          npm test > r18n3-v64-full-regression.log 2>&1
          status=$?
          echo "R18N3_V64_NPM_TEST_EXIT=$status"
          echo "=== FIRST FAILURE CONTEXT BEGIN ==="
          first_line="$(grep -n -m1 -E 'not ok|AssertionError|ERR_ASSERTION|Assertion failed|expected:|actual:' r18n3-v64-full-regression.log | cut -d: -f1 || true)"
          if [ -n "$first_line" ]; then
            start=$(( first_line > 20 ? first_line - 20 : 1 ))
            end=$(( first_line + 80 ))
            sed -n "${start},${end}p" r18n3-v64-full-regression.log
          else
            echo "NO_STANDARD_ASSERTION_MARKER_FOUND"
            tail -n 160 r18n3-v64-full-regression.log
          fi
          echo "=== FIRST FAILURE CONTEXT END ==="
          exit "$status"
      - name: Upload raw full-regression log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r18n3-v64-full-regression-evidence
          path: r18n3-v64-full-regression.log
          retention-days: 3
