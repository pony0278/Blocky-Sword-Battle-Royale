name: R18N.3 RIGHT Active-Window Boundary

on:
  pull_request:
    branches:
      - feature/r18n3-active-intercept-last-writer-pose-authority

permissions:
  contents: read

jobs:
  diagnose-right-active-window-boundary:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/r18n3-active-intercept-last-writer-pose-authority
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Apply conservative candidate and diagnostic telemetry
        run: |
          node tools/action-studio/r18n1-stable-active-intercept-migration.mjs
          node tools/action-studio/r18n3-active-intercept-last-writer-migration.mjs
          node tools/action-studio/r18n3-fixed-target-arm-closure-migration.mjs
          node tools/action-studio/r18n3-active-window-boundary-migration.mjs
      - name: Lock authority, active window, and tuning
        run: |
          node --check tools/action-studio/r18n3-active-window-boundary-migration.mjs
          node --check tools/action-studio/r18n3-right-active-window-boundary-probe.mjs
          grep -q "const ACTIVE_LEAD_SECONDS = Object.freeze({ top: 0.055, right: 0.04, left: 0.045 })" src/combat/longsword-directional-attack-runtime.js
          grep -q "const ACTIVE_TRAIL_SECONDS = Object.freeze({ top: 0.065, right: 0.05, left: 0.055 })" src/combat/longsword-directional-attack-runtime.js
          grep -q "contactSeconds: 0.23" src/combat/longsword-directional-metadata.js
          grep -q "active: snapshot.phase === LONGSWORD_ATTACK_PHASES.ACTIVE" tools/action-studio/shield-parry-r281/contact-handoff-controller.js
          grep -q "probeDeltaSeconds:" tools/action-studio/shield-parry-r281/pre-contact-controller.js
          grep -q "jointBudgetScale: 0.35" tools/action-studio/shield-parry-r281/pre-contact-controller.js
          grep -q "iterations: 2" tools/action-studio/shield-parry-r281/pre-contact-controller.js
          grep -q "bounded-guidance-only-real-swept-contact-still-required" src/combat/active-parry-intercept-intent.js
      - name: Focused regression contracts
        run: |
          node --test \
            tests/longsword-directional-attack-runtime.test.js \
            tests/r18n3-active-intercept-last-writer.test.js \
            tests/guard-threat-tracking.test.js \
            tests/shield-parry-r281-contact-handoff-controller.test.js \
            tests/old-two-actor-b3-direct-diagnostic.test.js
      - name: Build Action Studio
        run: npm run build:action-studio
      - name: Verify standalone Action Studio files stay current
        run: git diff --exit-code -- tools/action-studio/action-studio.bundle.js tools/action-studio/index.html
      - name: Verify Guard Runtime browser surface
        run: bash tools/action-studio/verify-guard-runtime-surface.sh
      - name: Run RIGHT active-window boundary probe
        shell: bash
        run: |
          set -euo pipefail
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$BROWSER"
          python3 -m http.server 4175 > r18n3-v63-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" >/dev/null 2>&1 || true' EXIT
          sleep 2
          BROWSER="$BROWSER" \
            R18N3_V63_TTC='0.110' \
            R18N3_V63_MAX_TRIALS='20' \
            R18N3_V63_MIN_CONTACTS='4' \
            R18N3_V63_MIN_WHIFFS='2' \
            node tools/action-studio/r18n3-right-active-window-boundary-probe.mjs | tee r18n3-v63-probe.log
          grep -q '^R18N3_V63_PROBE_JSON=' r18n3-v63-probe.log
      - name: Validate active-window boundary evidence
        shell: bash
        run: |
          node <<'NODE' | tee r18n3-v63-summary.log
          const fs = require('fs');
          const line = fs.readFileSync('r18n3-v63-probe.log','utf8').split(/\r?\n/)
            .find(v => v.startsWith('R18N3_V63_PROBE_JSON='));
          if (!line) throw new Error('missing v6.3 JSON');
          const data = JSON.parse(line.slice('R18N3_V63_PROBE_JSON='.length));
          if (!Array.isArray(data.trials) || data.trials.length < 4) throw new Error('insufficient v6.3 trials');
          const contacts = data.trials.filter(r => r.confirmed);
          const whiffs = data.trials.filter(r => r.whiff);
          const outside = whiffs.filter(r => r.whiffCategory === 'CONTACT_OUTSIDE_ACTIVE_WINDOW');
          if (contacts.length < 1) throw new Error('v6.3 failed to reproduce any real swept contact');
          if (outside.length < 1) throw new Error('v6.3 failed to reproduce outside-active geometric contact');
          for (const row of outside) {
            if (!Number.isFinite(Number(row.deltaSeconds)) || !Number.isFinite(Number(row.sweepAlpha))) {
              throw new Error('outside-active sample is missing sub-frame sweep timing');
            }
            if (Number(row.planeGapMeters) !== 0 || Number(row.radialGapMeters) !== 0 || Number(row.combinedGapMeters) !== 0) {
              throw new Error('outside-active sample is not an exact geometric shield intersection');
            }
          }
          const fmt = (v) => Number(v).toFixed(3);
          for (const row of outside) {
            console.log(
              `R18N3_V63_OUTSIDE trial=${row.trial} phase=${row.framePhase} ` +
              `frameEndVsActiveEndMs=${fmt(row.frameEndFromActiveEndMs)} ` +
              `geometricVsActiveEndMs=${fmt(row.geometricFromActiveEndMs)} ` +
              `geometricVsContactMs=${fmt(row.geometricFromContactMs)} ` +
              `sweepAlpha=${Number(row.sweepAlpha).toFixed(4)} ` +
              `deltaMs=${(Number(row.deltaSeconds)*1000).toFixed(3)} ` +
              `geometricWindow=${row.geometricWindowPosition} ` +
              `eligibilityMismatch=${row.eligibilityMismatch}`,
            );
          }
          const mismatch = outside.filter(r => r.eligibilityMismatch);
          const late = outside.filter(r => Number(r.geometricFromActiveEndMs) > 0);
          const early = outside.filter(r => Number(r.geometricFromActiveStartMs) < 0);
          console.log(`R18N3_V63_TOTAL trials=${data.trials.length} contact=${contacts.length} whiff=${whiffs.length} outsideActive=${outside.length}`);
          console.log(`R18N3_V63_EXACT_GEOMETRY_INSIDE_BUT_FRAME_OUTSIDE=${mismatch.length}`);
          console.log(`R18N3_V63_GEOMETRY_AFTER_ACTIVE_END=${late.length}`);
          console.log(`R18N3_V63_GEOMETRY_BEFORE_ACTIVE_START=${early.length}`);
          console.log('R18N3_V63_DIAGNOSTIC=PASS');
          NODE
      - name: Diff hygiene
        run: git diff --check
      - name: Upload v6.3 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r18n3-right-active-window-boundary-v6-3
          path: |
            r18n3-v63-probe.log
            r18n3-v63-summary.log
            r18n3-v63-http.log
          retention-days: 3
