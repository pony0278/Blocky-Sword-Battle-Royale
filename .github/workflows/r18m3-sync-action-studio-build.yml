name: R18M.3 Sync Action Studio Build

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/r18m3-sync-action-studio-build.yml'

permissions:
  contents: write

jobs:
  sync-generated-artifacts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout refactor branch
        uses: actions/checkout@v4
        with:
          ref: refactor/shield-parry-r18m-maintainability
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Rebuild standalone Action Studio
        run: npm run build:action-studio

      - name: Commit generated standalone artifacts
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- tools/action-studio/action-studio.bundle.js tools/action-studio/index.html
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Standalone Action Studio artifacts already current.'
          else
            git commit -m 'R18M.3 sync standalone Action Studio artifacts'
            git push origin HEAD:refactor/shield-parry-r18m-maintainability
          fi
