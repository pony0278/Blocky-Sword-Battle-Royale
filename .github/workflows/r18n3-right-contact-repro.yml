name: R18N.3 RIGHT Contact Reproducibility

on:
  pull_request:
    branches:
      - feature/r18n3-active-intercept-last-writer-pose-authority

permissions:
  contents: read

jobs:
  diagnose-right-contact:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout R18N.3 base
        uses: actions/checkout@v4
        with:
          ref: feature/r18n3-active-intercept-last-writer-pose-authority
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Apply conservative R18N.3 candidate
        run: |
          node tools/action-studio/r18n1-stable-active-intercept-migration.mjs
          node tools/action-studio/r18n3-active-intercept-last-writer-migration.mjs
          node tools/action-studio/r18n3-fixed-target-arm-closure-migration.mjs

      - name: Lock production tuning and authority
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/action-studio/r18n3-right-contact-repro-probe.mjs
          grep -q "maxTrackingSpeedMps: 1.6" src/combat/guard-threat-tracking.js
          grep -q "upperArmMaxDegrees: 14" src/combat/guard-threat-tracking.js
          grep -q "lowerArmMaxDegrees: 18" src/combat/guard-threat-tracking.js
          grep -q "jointBudgetScale: 0.35" tools/action-studio/shield-parry-r281/pre-contact-controller.js
          grep -q "iterations: 2" tools/action-studio/shield-parry-r281/pre-contact-controller.js
          grep -q "maxBodyReachMeters: 0.035" src/combat/guard-residual-body-reach.js
          grep -q "chestMaxDegrees: 2.4" src/combat/guard-residual-body-reach.js
          grep -q "spineMaxDegrees: 1.6" src/combat/guard-residual-body-reach.js
          grep -q "bounded-guidance-only-real-swept-contact-still-required" src/combat/active-parry-intercept-intent.js
          grep -q "fineTrackingRuntime.reset();" tools/action-studio/shield-parry-r281/contact-handoff-controller.js

      - name: Focused runtime regression contracts
        run: |
          node --test \
            tests/r18n3-active-intercept-last-writer.test.js \
            tests/guard-threat-tracking.test.js \
            tests/active-parry-intercept-intent.test.js \
            tests/shield-parry-r281-active-intercept-runtime.test.js \
            tests/shield-parry-r281-pre-contact-controller.test.js \
            tests/shield-parry-r281-contact-handoff-controller.test.js \
            tests/old-two-actor-b3-direct-diagnostic.test.js

      - name: Build Action Studio
        run: npm run build:action-studio

      - name: Verify standalone Action Studio files stay current
        run: git diff --exit-code -- tools/action-studio/action-studio.bundle.js tools/action-studio/index.html

      - name: Verify Guard Runtime browser surface
        run: bash tools/action-studio/verify-guard-runtime-surface.sh

      - name: Run controlled RIGHT TTC matrix
        shell: bash
        run: |
          set -euo pipefail
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$BROWSER"
          python3 -m http.server 4175 > r18n3-v61-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" >/dev/null 2>&1 || true' EXIT
          sleep 2
          BROWSER="$BROWSER" \
            R18N3_V61_PAGE_URL='http://127.0.0.1:4175/tools/action-studio/shield-driven-contact-coupling-lab.html' \
            R18N3_V61_TTCS='0.150,0.130,0.110,0.090' \
            R18N3_V61_TRIALS='3' \
            node tools/action-studio/r18n3-right-contact-repro-probe.mjs | tee r18n3-v61-probe.log
          grep -q '^R18N3_V61_PROBE_JSON=' r18n3-v61-probe.log

      - name: Validate diagnostic evidence without weakening contact authority
        shell: bash
        run: |
          node <<'NODE' | tee r18n3-v61-summary.log
          const fs = require('fs');
          const line = fs.readFileSync('r18n3-v61-probe.log', 'utf8').split(/\r?\n/)
            .find((value) => value.startsWith('R18N3_V61_PROBE_JSON='));
          if (!line) throw new Error('missing R18N.3 v6.1 probe JSON');
          const data = JSON.parse(line.slice('R18N3_V61_PROBE_JSON='.length));
          if (data.trials?.length !== 12) throw new Error(`expected 12 RIGHT trials, got ${data.trials?.length}`);
          if (data.buckets?.length !== 4) throw new Error(`expected 4 TTC buckets, got ${data.buckets?.length}`);
          const finite = (value) => Number.isFinite(Number(value));
          for (const trial of data.trials) {
            if (trial.inputAccepted !== true) throw new Error(`F rejected at target TTC ${trial.targetTtc}`);
            if (!finite(trial.actualTtc) || Number(trial.actualTtc) <= 0 || Number(trial.actualTtc) > Number(trial.targetTtc) + 0.020) {
              throw new Error(`invalid actual TTC ${trial.actualTtc} for target ${trial.targetTtc}`);
            }
            if (Number(trial.metrics?.closureBudgetScale) !== 0.35 || Number(trial.metrics?.closureIterations) !== 2) {
              throw new Error(`trial at ${trial.targetTtc} changed conservative closure tuning`);
            }
            const drift = Number(trial.metrics?.targetDriftMeters);
            if (!finite(drift) || drift > 0.002) throw new Error(`fixed target drifted by ${drift}m`);
            const convergence = Number(trial.metrics?.finalSurfaceConvergenceMeters);
            if (!finite(convergence) || convergence <= 0.002) {
              throw new Error(`final-surface 2mm convergence evidence missing at target TTC ${trial.targetTtc}: ${convergence}`);
            }
            if (trial.confirmation === trial.whiff) {
              throw new Error(`trial at ${trial.targetTtc} must resolve to exactly one of confirmation/whiff`);
            }
          }
          for (const bucket of data.buckets) {
            console.log(
              `R18N3_V61_BUCKET target=${bucket.targetTtc.toFixed(3)} ` +
              `actual=${Number(bucket.minActualTtc).toFixed(4)}..${Number(bucket.maxActualTtc).toFixed(4)} ` +
              `contact=${bucket.confirmations}/${bucket.trials} whiff=${bucket.whiffs}/${bucket.trials}`,
            );
          }
          const confirmations = data.trials.filter((trial) => trial.confirmation).length;
          const whiffs = data.trials.filter((trial) => trial.whiff).length;
          console.log(`R18N3_V61_TOTAL contact=${confirmations}/12 whiff=${whiffs}/12`);
          console.log('R18N3_V61_DIAGNOSTIC=PASS');
          NODE

      - name: Diff hygiene
        run: git diff --check

      - name: Upload v6.1 diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r18n3-right-contact-repro-v6-1
          path: |
            r18n3-v61-probe.log
            r18n3-v61-http.log
            r18n3-v61-summary.log
          if-no-files-found: warn
          retention-days: 3
