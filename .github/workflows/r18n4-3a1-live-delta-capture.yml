name: R18N.4.3-A.1 Live Delta Capture

on:
  push:
    branches:
      - diagnostic/r18n4-3a1-live-delta-capture

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: diagnostic/r18n4-3a1-live-delta-capture
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Verify R18N.4.3-A baseline
        run: node --test tests/predictive-parry-arm-delta.test.js tests/predictive-intercept-parry.test.js tests/shield-parry-r281-active-intercept-runtime.test.js

      - name: Capture live RIGHT and TOP authored shield-arm delta
        shell: bash
        run: |
          set -euo pipefail
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          [[ -n "$BROWSER" ]]
          PORT=4183
          DEBUG_PORT=9223
          RESULT_JSON=/tmp/r18n4-3a1-live-delta.json
          python3 -m http.server "$PORT" >/tmp/r18n4-3a1-http.log 2>&1 & SERVER_PID=$!
          "$BROWSER" --headless=new --no-sandbox --disable-gpu --enable-unsafe-swiftshader \
            --remote-debugging-address=127.0.0.1 --remote-debugging-port="$DEBUG_PORT" \
            --user-data-dir=/tmp/r18n4-3a1-chrome-profile about:blank >/tmp/r18n4-3a1-chrome.log 2>&1 & CHROME_PID=$!
          trap 'kill "$CHROME_PID" >/dev/null 2>&1 || true; kill "$SERVER_PID" >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 120); do
            curl -fsS "http://127.0.0.1:${DEBUG_PORT}/json/version" >/dev/null && break || true
            sleep 0.25
          done
          curl -fsS "http://127.0.0.1:${DEBUG_PORT}/json/version" >/dev/null

          ACTION_STUDIO_PORT="$PORT" CHROME_DEBUG_PORT="$DEBUG_PORT" RESULT_JSON="$RESULT_JSON" node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const port = Number(process.env.ACTION_STUDIO_PORT);
          const debugPort = Number(process.env.CHROME_DEBUG_PORT);
          const resultPath = process.env.RESULT_JSON;
          const pageUrl = `http://127.0.0.1:${port}/tools/action-studio/shield-driven-contact-coupling-lab.html?debug=1&r18n43a1=1`;
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

          async function waitFor(label, predicate, timeoutMs = 60000, intervalMs = 40) {
            const start = Date.now();
            let lastError = null;
            while (Date.now() - start < timeoutMs) {
              try { if (await predicate()) return; } catch (error) { lastError = error; }
              await sleep(intervalMs);
            }
            throw new Error(`Timed out waiting for ${label}${lastError ? `: ${lastError.message}` : ''}`);
          }

          const targetResponse = await fetch(`http://127.0.0.1:${debugPort}/json/new?${encodeURIComponent(pageUrl)}`, { method: 'PUT' });
          if (!targetResponse.ok) throw new Error(`CDP target creation failed: ${targetResponse.status}`);
          const target = await targetResponse.json();
          const ws = new WebSocket(target.webSocketDebuggerUrl);
          await new Promise((resolve, reject) => {
            ws.addEventListener('open', resolve, { once: true });
            ws.addEventListener('error', reject, { once: true });
          });

          let id = 0;
          const pending = new Map();
          ws.addEventListener('message', (event) => {
            const msg = JSON.parse(event.data);
            const p = pending.get(msg.id);
            if (!p) return;
            pending.delete(msg.id);
            msg.error ? p.reject(new Error(msg.error.message)) : p.resolve(msg.result);
          });
          const send = (method, params = {}) => new Promise((resolve, reject) => {
            const requestId = ++id;
            pending.set(requestId, { resolve, reject });
            ws.send(JSON.stringify({ id: requestId, method, params }));
          });
          async function evaluate(expression) {
            const result = await send('Runtime.evaluate', { expression, returnByValue: true, awaitPromise: true });
            if (result.exceptionDetails) throw new Error(result.exceptionDetails.exception?.description || result.exceptionDetails.text || 'Runtime.evaluate failed');
            return result.result?.value;
          }

          await send('Runtime.enable');
          await waitFor('R281 lab boot', () => evaluate(`Boolean(window.__G43B5R281_LAB__?.attackRuntime?.snapshot?.action && window.__G43B5R281_RESULT__ && document.documentElement.dataset.g43b5r281 !== 'fail')`), 90000);

          async function frame() {
            return evaluate(`(() => {
              const api = window.__G43B5R281_LAB__;
              const report = api?.latestPredictiveReport;
              const delta = report?.shieldArmAuthoredDelta;
              const ownership = api?.latestVisualOwnershipBaseline;
              const angle = (bone) => Number.isFinite(delta?.deltas?.[bone]?.angleDegrees) ? delta.deltas[bone].angleDegrees : null;
              return {
                sequence: report?.sequence ?? api?.attackRuntime?.snapshot?.sequence ?? null,
                ttcMs: Number.isFinite(report?.timeToContactSeconds) ? report.timeToContactSeconds * 1000 : null,
                presentationElapsedMs: Number.isFinite(report?.presentationElapsedMs) ? report.presentationElapsedMs : null,
                sourceMs: Number.isFinite(report?.sourceTimeSeconds) ? report.sourceTimeSeconds * 1000 : null,
                entryBlendProgress: Number.isFinite(report?.entryBlendProgress) ? report.entryBlendProgress : null,
                shieldArmOwnership: report?.shieldArmOwnership ?? null,
                extractionAuthority: delta?.authority ?? null,
                anglesDegrees: delta ? {
                  upperarmL: angle('upperarm.l'),
                  lowerarmL: angle('lowerarm.l'),
                  wristL: angle('wrist.l'),
                  max: Number.isFinite(delta.maxAngleDegrees) ? delta.maxAngleDegrees : null,
                } : null,
                writerOrderValid: ownership?.orderValid ?? null,
                writerOrderViolations: ownership?.orderViolations ?? [],
                realContact: Boolean(api?.latestContact),
                parryConfirmed: Boolean(api?.latestParryConfirmation),
                whiff: Boolean(api?.latestParryWhiff),
              };
            })()`);
          }

          function checkpoints(samples) {
            return [150, 120, 90, 60, 30, 10].map((targetTtcMs) => ({
              targetTtcMs,
              sample: samples.reduce((best, sample) => !best || Math.abs(sample.ttcMs - targetTtcMs) < Math.abs(best.ttcMs - targetTtcMs) ? sample : best, null),
            }));
          }

          async function runDirection(direction) {
            const restarted = await evaluate(`window.__G43B5R281_LAB__.restartAttack(${JSON.stringify(direction)})`);
            if (!restarted) throw new Error(`${direction}: restartAttack rejected`);
            const sequence = await evaluate(`window.__G43B5R281_LAB__.attackRuntime.snapshot.sequence`);
            await waitFor(`${direction} legal Parry prompt`, () => evaluate(`window.__G43B5R281_LAB__.attackRuntime.snapshot.sequence === ${Number(sequence)} && window.__G43B5R281_LAB__.latestParryOpportunity?.accepted === true`), 45000, 25);
            const input = await evaluate(`window.__G43B5R281_LAB__.dispatchParryInput('r18n4-3a1-live-capture')`);
            if (!input?.accepted) throw new Error(`${direction}: input rejected ${input?.reason || 'unknown'}`);
            await waitFor(`${direction} first extracted delta`, async () => Boolean((await frame()).anglesDegrees), 15000, 20);

            const samples = [];
            const seen = new Set();
            const startedAt = Date.now();
            while (Date.now() - startedAt < 12000) {
              const sample = await frame();
              if (sample.anglesDegrees && Number.isFinite(sample.ttcMs)) {
                const key = `${sample.presentationElapsedMs}`;
                if (!seen.has(key)) { seen.add(key); samples.push(sample); }
              }
              if (sample.realContact || sample.whiff) break;
              await sleep(20);
            }
            const terminal = await frame();
            if (samples.length < 5) throw new Error(`${direction}: only ${samples.length} samples`);
            if (!terminal.realContact || !terminal.parryConfirmed || terminal.whiff) throw new Error(`${direction}: terminal real-contact confirmation failed`);
            if (!samples.some((s) => (s.anglesDegrees?.max ?? 0) > 1)) throw new Error(`${direction}: authored delta <= 1deg`);
            if (samples.some((s) => s.extractionAuthority !== 'observer-only-authored-arm-delta-no-rig-write-no-contact-authority')) throw new Error(`${direction}: extraction authority changed`);
            if (samples.some((s) => s.shieldArmOwnership !== 'external-active-intercept-tracking')) throw new Error(`${direction}: solver arm ownership changed`);
            if (samples.some((s) => s.writerOrderValid === false) || !samples.some((s) => s.writerOrderValid === true)) throw new Error(`${direction}: writer order evidence failed`);

            return {
              direction,
              sequence,
              inputTtcMs: Number.isFinite(input.timeToContactSeconds) ? input.timeToContactSeconds * 1000 : null,
              sampleCount: samples.length,
              checkpoints: checkpoints(samples),
              peak: samples.reduce((best, s) => !best || (s.anglesDegrees?.max ?? 0) > (best.anglesDegrees?.max ?? 0) ? s : best, null),
              terminal,
            };
          }

          const summary = {
            stage: 'R18N.4.3-A.1',
            authority: 'live-browser-observation-only-no-pose-injection-no-contact-authority-change',
            right: await runDirection('right'),
            top: await runDirection('top'),
          };
          fs.writeFileSync(resultPath, `${JSON.stringify(summary, null, 2)}\n`);
          console.log(`R18N43A1_RESULT=${JSON.stringify(summary)}`);
          ws.close();
          NODE
          cat "$RESULT_JSON"

      - uses: actions/upload-artifact@v4
        with:
          name: r18n4-3a1-live-delta-capture
          path: /tmp/r18n4-3a1-live-delta.json
          if-no-files-found: error
          retention-days: 14

      - name: Verify no production changes and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          BASE=73285144f372c6f2a7db435456ef9a8fc31401e0
          CHANGED="$(git diff --name-only "$BASE"...HEAD | sort)"
          echo "$CHANGED"
          [[ "$CHANGED" == '.github/workflows/r18n4-3a1-live-delta-capture.yml' ]]
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/r18n4-3a1-live-delta-capture.yml
          git commit -m "R18N.4.3-A.1 remove one-shot live capture"
          git push origin HEAD:diagnostic/r18n4-3a1-live-delta-capture
