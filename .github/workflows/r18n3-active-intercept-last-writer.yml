name: R18N.3 Active Intercept Last-Writer Pose Authority

on:
  pull_request:
    branches:
      - feature/r18n3-active-intercept-last-writer-pose-authority

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout R18N.3 base
        uses: actions/checkout@v4
        with:
          ref: feature/r18n3-active-intercept-last-writer-pose-authority
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Capture exact R18N.1 v10 full-suite baseline
        shell: bash
        run: |
          set -euo pipefail
          BASE=f6c0fb820d169cb371d507c6ef15cf2b764b53c7
          rm -rf /tmp/r18n3-v10-baseline
          git worktree add --detach /tmp/r18n3-v10-baseline "$BASE"
          set +e
          (
            cd /tmp/r18n3-v10-baseline
            npm install >/dev/null 2>&1
            node tools/action-studio/r18n1-stable-active-intercept-migration.mjs
            npm test > /tmp/r18n3-v10-baseline.log 2>&1
          )
          BASELINE_EXIT=$?
          set -e
          node <<'NODE'
          const fs = require('fs');
          const text = fs.readFileSync('/tmp/r18n3-v10-baseline.log', 'utf8');
          const titles = [...text.matchAll(/^\s*not ok \d+ - (.+)$/gm)].map((m) => m[1].trim()).sort();
          fs.writeFileSync('/tmp/r18n3-v10-baseline.failures', `${titles.join('\n')}${titles.length ? '\n' : ''}`);
          console.log(`R18N.1 v10 baseline failure titles: ${titles.length}`);
          for (const title of titles) console.log(`V10 BASELINE FAIL: ${title}`);
          NODE
          echo "R18N.1 v10 baseline npm test exit: ${BASELINE_EXIT}"
          test "$(wc -l < /tmp/r18n3-v10-baseline.failures)" -eq 14
          git worktree remove --force /tmp/r18n3-v10-baseline

      - name: Apply guarded R18N.1 v10 candidate
        run: node tools/action-studio/r18n1-stable-active-intercept-migration.mjs

      - name: Prove R18N.3 contracts are red before migration
        shell: bash
        run: |
          set +e
          node --test tests/r18n3-active-intercept-last-writer.test.js > r18n3-pre.log 2>&1
          PRE_EXIT=$?
          set -e
          cat r18n3-pre.log
          test "$PRE_EXIT" -ne 0

      - name: Apply R18N.3 last-writer migration
        run: node tools/action-studio/r18n3-active-intercept-last-writer-migration.mjs

      - name: Syntax and last-writer contracts
        run: |
          node --check tools/action-studio/shield-parry-r281/pre-contact-controller.js
          node --check tools/action-studio/r18n3-active-intercept-last-writer-migration.mjs
          node --check tools/action-studio/r18n3-active-intercept-browser-probe.mjs
          node --check tests/r18n3-active-intercept-last-writer.test.js
          node --test \
            tests/r18n3-active-intercept-last-writer.test.js \
            tests/guard-threat-tracking.test.js \
            tests/active-parry-intercept-intent.test.js \
            tests/shield-parry-r281-active-intercept-runtime.test.js \
            tests/shield-parry-r281-pre-contact-controller.test.js

      - name: R18M R18N focused regression contracts
        run: |
          node --test \
            tests/shield-driven-contact-coupling-r281-regression.test.js \
            tests/shield-parry-r281-diagnostics.test.js \
            tests/shield-parry-r281-exchange-state.test.js \
            tests/shield-parry-r281-pre-contact-controller.test.js \
            tests/shield-parry-r281-contact-handoff-controller.test.js \
            tests/shield-parry-r281-verification-report.test.js \
            tests/shield-parry-r281-active-parry-intercept-diagnosis.test.js \
            tests/active-parry-intercept-intent.test.js \
            tests/shield-parry-r281-active-intercept-runtime.test.js \
            tests/shield-parry-r281-thin-entry-audit.test.js \
            tests/old-two-actor-b3-direct-diagnostic.test.js

      - name: Preserve tuning solver and authority locks
        shell: bash
        run: |
          set -euo pipefail
          grep -q "maxTrackingSpeedMps: 1.6" src/combat/guard-threat-tracking.js
          grep -q "upperArmMaxDegrees: 14" src/combat/guard-threat-tracking.js
          grep -q "lowerArmMaxDegrees: 18" src/combat/guard-threat-tracking.js
          grep -q "bounded-guidance-only-real-swept-contact-still-required" src/combat/active-parry-intercept-intent.js
          grep -q "fineTrackingRuntime.reset();" tools/action-studio/shield-parry-r281/contact-handoff-controller.js
          LINES=$(wc -l < tools/action-studio/shield-driven-contact-coupling-lab-r281.js)
          echo "R281 lines: $LINES"
          test "$LINES" -le 725
          ! grep -Eq 'activeParryInterceptIntent|activeInterceptIntent' tools/action-studio/shield-parry-r281/exchange-state.js

      - name: Build Action Studio
        run: npm run build:action-studio

      - name: Verify standalone Action Studio files stay current
        run: git diff --exit-code -- tools/action-studio/action-studio.bundle.js tools/action-studio/index.html

      - name: Verify Guard Runtime browser surface
        run: bash tools/action-studio/verify-guard-runtime-surface.sh

      - name: Run TOP and RIGHT last-writer browser proof
        shell: bash
        run: |
          set -euo pipefail
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$BROWSER"
          python3 -m http.server 4175 > r18n3-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" >/dev/null 2>&1 || true' EXIT
          sleep 2
          BROWSER="$BROWSER" R18N3_PAGE_URL='http://127.0.0.1:4175/tools/action-studio/shield-driven-contact-coupling-lab.html' \
            node tools/action-studio/r18n3-active-intercept-browser-probe.mjs | tee r18n3-probe.log
          grep -q '^R18N3_PROBE_JSON=' r18n3-probe.log

      - name: Validate real contact and summarize convergence
        shell: bash
        run: |
          node <<'NODE' | tee r18n3-summary.log
          const fs = require('fs');
          const line = fs.readFileSync('r18n3-probe.log', 'utf8').split(/\r?\n/)
            .find((value) => value.startsWith('R18N3_PROBE_JSON='));
          if (!line) throw new Error('missing R18N.3 probe JSON');
          const data = JSON.parse(line.slice('R18N3_PROBE_JSON='.length));
          for (const direction of ['top', 'right']) {
            const row = data[direction];
            if (row?.inputAccepted !== true) throw new Error(`${direction} F input rejected`);
            if (row?.confirmation !== true || row?.whiff) {
              throw new Error(`${direction} lost authoritative real swept Sword×Shield confirmation`);
            }
            if (!row.samples?.length) throw new Error(`${direction} missing last-writer samples`);
          }
          console.log(`R18N3_SUMMARY_JSON=${JSON.stringify(data.summary)}`);
          console.log(JSON.stringify(data.summary, null, 2));
          NODE

      - name: Compare full-suite failure titles with exact v10 candidate
        shell: bash
        run: |
          set +e
          npm test > r18n3-candidate.log 2>&1
          CANDIDATE_EXIT=$?
          set -e
          node <<'NODE'
          const fs = require('fs');
          const text = fs.readFileSync('r18n3-candidate.log', 'utf8');
          const titles = [...text.matchAll(/^\s*not ok \d+ - (.+)$/gm)].map((m) => m[1].trim()).sort();
          fs.writeFileSync('r18n3-candidate.failures', `${titles.join('\n')}${titles.length ? '\n' : ''}`);
          console.log(`R18N.3 candidate failure titles: ${titles.length}`);
          NODE
          echo "R18N.3 npm test exit: ${CANDIDATE_EXIT}"
          diff -u /tmp/r18n3-v10-baseline.failures r18n3-candidate.failures

      - name: Diff hygiene
        run: git diff --check

      - name: Upload R18N.3 proof evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r18n3-active-intercept-last-writer-proof
          path: |
            r18n3-pre.log
            r18n3-probe.log
            r18n3-http.log
            r18n3-summary.log
            r18n3-candidate.log
            r18n3-candidate.failures
          if-no-files-found: warn
          retention-days: 3
