name: R18N.4.3-B.1.3 TOP Prep Readability Hold

on:
  push:
    branches:
      - feature/r18n4-3b1-3-top-prep-readability-hold

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/r18n4-3b1-3-top-prep-readability-hold
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install

      - name: Materialize R18N.4.3-B.1.3 integration
        run: node tools/action-studio/r18n4-3b1-3-top-prep-readability-hold-migration.mjs

      - name: Focused readability and authority regressions
        run: >-
          node --test
          tests/parry-top-prep-readability-hold.test.js
          tests/predictive-parry-arm-delta.test.js
          tests/predictive-parry-arm-additive.test.js
          tests/parry-top-direction-compatibility-probe.test.js
          tests/predictive-intercept-parry.test.js
          tests/shield-parry-r281-active-intercept-runtime.test.js
          tests/shield-parry-r281-visual-ownership-baseline.test.js

      - name: Full regression suite
        run: npm test

      - name: Action Studio build
        run: npm run build:action-studio

      - name: Live TOP early/late hold plus RIGHT regression
        shell: bash
        run: |
          set -euo pipefail
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          [[ -n "$BROWSER" ]]
          PORT=4187
          DEBUG_PORT=9227
          PROFILE="/tmp/r18n4-3b1-3-chrome-profile-$RANDOM"
          python3 -m http.server "$PORT" >/tmp/r18n4-3b1-3-http.log 2>&1 & SERVER_PID=$!
          "$BROWSER" --headless=new --no-sandbox --disable-gpu --enable-unsafe-swiftshader \
            --remote-debugging-address=127.0.0.1 --remote-debugging-port="$DEBUG_PORT" \
            --user-data-dir="$PROFILE" about:blank >/tmp/r18n4-3b1-3-chrome.log 2>&1 & CHROME_PID=$!
          trap 'kill "$CHROME_PID" >/dev/null 2>&1 || true; kill "$SERVER_PID" >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 120); do
            curl -fsS "http://127.0.0.1:${DEBUG_PORT}/json/version" >/dev/null && break || true
            sleep 0.25
          done
          curl -fsS "http://127.0.0.1:${DEBUG_PORT}/json/version" >/dev/null

          ACTION_STUDIO_PORT="$PORT" CHROME_DEBUG_PORT="$DEBUG_PORT" node --input-type=module <<'NODE'
          const port = Number(process.env.ACTION_STUDIO_PORT);
          const debugPort = Number(process.env.CHROME_DEBUG_PORT);
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

          async function waitFor(label, predicate, timeoutMs = 60000, intervalMs = 25) {
            const start = Date.now();
            let lastError = null;
            while (Date.now() - start < timeoutMs) {
              try { if (await predicate()) return; } catch (error) { lastError = error; }
              await sleep(intervalMs);
            }
            throw new Error(`Timed out waiting for ${label}${lastError ? `: ${lastError.message}` : ''}`);
          }

          async function openPage() {
            const pageUrl = `http://127.0.0.1:${port}/tools/action-studio/shield-driven-contact-coupling-lab.html?debug=1`;
            const response = await fetch(`http://127.0.0.1:${debugPort}/json/new?${encodeURIComponent(pageUrl)}`, { method: 'PUT' });
            if (!response.ok) throw new Error(`CDP target creation failed: ${response.status}`);
            const target = await response.json();
            const ws = new WebSocket(target.webSocketDebuggerUrl);
            await new Promise((resolve, reject) => {
              ws.addEventListener('open', resolve, { once: true });
              ws.addEventListener('error', reject, { once: true });
            });
            let id = 0;
            const pending = new Map();
            ws.addEventListener('message', (event) => {
              const message = JSON.parse(event.data);
              const waiter = pending.get(message.id);
              if (!waiter) return;
              pending.delete(message.id);
              message.error ? waiter.reject(new Error(message.error.message)) : waiter.resolve(message.result);
            });
            const send = (method, params = {}) => new Promise((resolve, reject) => {
              const requestId = ++id;
              pending.set(requestId, { resolve, reject });
              ws.send(JSON.stringify({ id: requestId, method, params }));
            });
            async function evaluate(expression) {
              const result = await send('Runtime.evaluate', { expression, returnByValue: true, awaitPromise: true });
              if (result.exceptionDetails) throw new Error(result.exceptionDetails.exception?.description || result.exceptionDetails.text || 'Runtime.evaluate failed');
              return result.result?.value;
            }
            await send('Runtime.enable');
            await waitFor('R281 lab boot', () => evaluate(`Boolean(window.__G43B5R281_LAB__?.attackRuntime?.snapshot?.action && window.__G43B5R281_RESULT__ && document.documentElement.dataset.g43b5r281 !== 'fail')`), 90000);
            return { ws, evaluate };
          }

          const installRecorder = `(() => {
            window.__R18N43B13_CAPTURE__ = [];
            window.__R18N43B13_STOP__ = false;
            let lastElapsed = null;
            const compact = () => {
              const api = window.__G43B5R281_LAB__;
              const drive = api?.latestInterceptDriveReport;
              const hold = drive?.topPrepReadabilityHold;
              const ownership = api?.latestVisualOwnershipBaseline;
              const target = drive?.activeInterceptIntent?.targetCenter || null;
              return {
                attackDirection: api?.attackRuntime?.snapshot?.direction ?? null,
                attackElapsedMs: Number.isFinite(api?.attackRuntime?.snapshot?.elapsedSeconds) ? api.attackRuntime.snapshot.elapsedSeconds * 1000 : null,
                ttcMs: Number.isFinite(drive?.timeToContactSeconds) ? drive.timeToContactSeconds * 1000 : null,
                presentationElapsedMs: api?.latestPredictiveReport?.presentationElapsedMs ?? null,
                targetCenter: target ? { x: target.x, y: target.y, z: target.z } : null,
                targetErrorAfterMeters: drive?.activeInterceptTargetErrorAfterMeters ?? null,
                shieldStepTranslationMeters: drive?.shieldStepTranslationMeters ?? null,
                hold: hold ? {
                  stage: hold.stage,
                  active: hold.active,
                  applied: hold.applied,
                  reason: hold.reason,
                  envelopeWeight: hold.envelopeWeight,
                  appliedBones: hold.appliedBones || [],
                  upperDegrees: hold.bones?.['upperarm.l']?.targetAngleDegrees ?? 0,
                  lowerDegrees: hold.bones?.['lowerarm.l']?.targetAngleDegrees ?? 0,
                  wristSolverOnly: hold.bones?.['wrist.l']?.solverOnly ?? true,
                  finalPoseOwner: hold.finalPoseOwner ?? null,
                  authority: hold.authority ?? null,
                } : null,
                writerOrderValid: ownership?.orderValid ?? null,
                writerOrderViolations: ownership?.orderViolations ?? [],
                realContact: api?.latestContact?.contact === true,
                parryConfirmed: api?.latestParryConfirmation?.accepted === true,
                whiff: Boolean(api?.latestParryWhiff),
              };
            };
            window.__R18N43B13_COMPACT__ = compact;
            const tick = () => {
              const sample = compact();
              if (sample.attackElapsedMs !== lastElapsed) {
                lastElapsed = sample.attackElapsedMs;
                window.__R18N43B13_CAPTURE__.push(sample);
              }
              if (!window.__R18N43B13_STOP__ && !sample.realContact && !sample.whiff) requestAnimationFrame(tick);
            };
            requestAnimationFrame(tick);
            return true;
          })()`;

          async function dispatchAtTtc(evaluate, direction, targetTtcSeconds, label) {
            return evaluate(`new Promise((resolve, reject) => {
              const api = window.__G43B5R281_LAB__;
              const targetTtc = ${Number(targetTtcSeconds)};
              const deadline = performance.now() + 15000;
              const tick = () => {
                const snapshot = api?.attackRuntime?.snapshot;
                const contactSeconds = Number(snapshot?.contactSeconds ?? snapshot?.action?.runtime?.contactSeconds);
                const elapsedSeconds = Number(snapshot?.elapsedSeconds);
                const ttc = Number.isFinite(contactSeconds) && Number.isFinite(elapsedSeconds)
                  ? contactSeconds - elapsedSeconds
                  : NaN;
                if (!snapshot?.action) return reject(new Error('attack-ended-before-${label}'));
                if (performance.now() > deadline) return reject(new Error('ttc-dispatch-timeout-${label}'));
                if (api?.latestParryOpportunity?.accepted === true && Number.isFinite(ttc) && ttc <= targetTtc && ttc > 0.02) {
                  return resolve(api.dispatchParryInput('r18n4-3b1-3-${label}'));
                }
                requestAnimationFrame(tick);
              };
              requestAnimationFrame(tick);
            })`);
          }

          function targetDrift(samples) {
            const targets = samples.map((sample) => sample.targetCenter).filter(Boolean);
            if (targets.length < 2) return 0;
            const first = targets[0];
            return Math.max(...targets.map((target) => Math.hypot(
              target.x - first.x,
              target.y - first.y,
              target.z - first.z,
            )));
          }

          async function runExchange(page, { direction, targetTtcSeconds, label, expectHold }) {
            const { evaluate } = page;
            const restarted = await evaluate(`window.__G43B5R281_LAB__.restartAttack('${direction}')`);
            if (!restarted) throw new Error(`${label}: restartAttack rejected`);
            const sequence = await evaluate(`window.__G43B5R281_LAB__.attackRuntime.snapshot.sequence`);
            await waitFor(`${label} legal Parry prompt`, () => evaluate(`window.__G43B5R281_LAB__.attackRuntime.snapshot.sequence === ${Number(sequence)} && window.__G43B5R281_LAB__.latestParryOpportunity?.accepted === true`), 45000, 20);
            await evaluate(installRecorder);
            const input = await dispatchAtTtc(evaluate, direction, targetTtcSeconds, label);
            if (!input?.accepted) throw new Error(`${label}: Parry input rejected ${input?.reason || 'unknown'}`);
            await waitFor(`${label} real contact or whiff`, () => evaluate(`Boolean(window.__G43B5R281_LAB__.latestContact?.contact === true || window.__G43B5R281_LAB__.latestParryWhiff || !window.__G43B5R281_LAB__.attackRuntime.snapshot.action)`), 30000, 25);
            await evaluate(`window.__R18N43B13_STOP__ = true`);
            const evidence = await evaluate(`({ samples: window.__R18N43B13_CAPTURE__ || [], terminal: window.__R18N43B13_COMPACT__?.() || null })`);
            const samples = evidence.samples || [];
            const terminal = evidence.terminal || null;
            if (!terminal?.realContact || !terminal?.parryConfirmed || terminal?.whiff) {
              throw new Error(`${label}: real-contact Parry terminal failed`);
            }
            if (samples.some((sample) => sample.writerOrderValid === false)) {
              throw new Error(`${label}: writer-order violation`);
            }
            const drift = targetDrift(samples);
            if (drift > 1e-9) throw new Error(`${label}: latched target drifted by ${drift}m`);

            const holdSamples = samples.filter((sample) => sample.hold?.stage === 'R18N.4.3-B.1.3');
            if (!holdSamples.length) throw new Error(`${label}: missing readability telemetry`);
            for (const sample of holdSamples) {
              if ((sample.hold?.envelopeWeight ?? 0) > 1.000001) throw new Error(`${label}: envelope escaped [0,1]`);
              if ((sample.hold?.upperDegrees ?? 0) > 6.000001) throw new Error(`${label}: upperarm retention cap exceeded`);
              if ((sample.hold?.lowerDegrees ?? 0) > 8.000001) throw new Error(`${label}: lowerarm retention cap exceeded`);
              if (sample.hold?.wristSolverOnly !== true) throw new Error(`${label}: wrist left solver-only policy`);
              if (sample.hold?.finalPoseOwner && sample.hold.finalPoseOwner !== 'active-intercept-final-arm-closure') throw new Error(`${label}: final pose owner changed`);
              if (sample.hold?.authority && sample.hold.authority !== 'presentation-readability-local-pose-before-final-closure-no-contact-authority') throw new Error(`${label}: hold authority changed`);
            }

            const activeHold = holdSamples.filter((sample) => sample.hold?.active === true);
            const appliedHold = activeHold.filter((sample) => sample.hold?.applied === true);
            const releasedBeforeContact = holdSamples.some((sample) => !sample.realContact
              && (sample.presentationElapsedMs ?? 0) >= 80
              && (sample.hold?.envelopeWeight ?? 1) <= 0.001);
            if (expectHold) {
              if (activeHold.length < 2) throw new Error(`${label}: readability hold was not visible for multiple frames`);
              if (!appliedHold.length) throw new Error(`${label}: readability hold never wrote upper/lower arm`);
              if (!releasedBeforeContact) throw new Error(`${label}: readability hold did not release before contact`);
            } else if (activeHold.length || appliedHold.length) {
              throw new Error(`${label}: non-TOP exchange activated TOP readability hold`);
            }

            const firstActive = activeHold[0] || null;
            const firstStep = firstActive?.shieldStepTranslationMeters ?? null;
            if (Number.isFinite(firstStep) && firstStep > 0.03) {
              throw new Error(`${label}: first readability frame moved shield ${firstStep}m (>3cm guardrail)`);
            }

            const summary = {
              label,
              direction,
              sequence,
              requestedTtcMs: targetTtcSeconds * 1000,
              acceptedTtcMs: Number.isFinite(input.timeToContactSeconds) ? input.timeToContactSeconds * 1000 : null,
              sampleCount: samples.length,
              holdSampleCount: holdSamples.length,
              activeHoldFrames: activeHold.length,
              appliedHoldFrames: appliedHold.length,
              maxEnvelope: holdSamples.length ? Math.max(...holdSamples.map((sample) => sample.hold?.envelopeWeight ?? 0)) : 0,
              maxUpperDegrees: holdSamples.length ? Math.max(...holdSamples.map((sample) => sample.hold?.upperDegrees ?? 0)) : 0,
              maxLowerDegrees: holdSamples.length ? Math.max(...holdSamples.map((sample) => sample.hold?.lowerDegrees ?? 0)) : 0,
              firstActiveShieldStepMeters: firstStep,
              maxTargetErrorAfterMeters: Math.max(0, ...samples.map((sample) => Number(sample.targetErrorAfterMeters) || 0)),
              latchedTargetDriftMeters: drift,
              releasedBeforeContact,
              terminal,
            };
            console.log(`R18N43B13_EXCHANGE=${JSON.stringify(summary)}`);
            return summary;
          }

          const page = await openPage();
          try {
            const result = {
              stage: 'R18N.4.3-B.1.3',
              topEarly: await runExchange(page, { direction: 'top', targetTtcSeconds: 0.158, label: 'top-early', expectHold: true }),
              topLate: await runExchange(page, { direction: 'top', targetTtcSeconds: 0.110, label: 'top-late', expectHold: true }),
              right: await runExchange(page, { direction: 'right', targetTtcSeconds: 0.110, label: 'right-regression', expectHold: false }),
            };
            console.log(`R18N43B13_RESULT=${JSON.stringify(result)}`);
          } finally {
            page.ws.close();
          }
          NODE

      - name: Commit validated hold and remove one-shot files
        shell: bash
        run: |
          set -euo pipefail
          BASE=7c9d508a76948b6b93220cfd1abbeecd15679e8d
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/r18n4-3b1-3-top-prep-readability-hold.yml
          git rm tools/action-studio/r18n4-3b1-3-top-prep-readability-hold-migration.mjs
          git add -- \
            package.json \
            tests/shield-parry-r281-visual-ownership-baseline.test.js \
            tools/action-studio/shield-parry-r281/pre-contact-controller.js \
            tools/action-studio/shield-parry-r281/visual-ownership-baseline.js \
            tools/action-studio/shield-parry-r281/visual-ownership-runtime-taps.js \
            tools/action-studio/action-studio.bundle.js \
            tools/action-studio/index.html
          git commit -m "R18N.4.3-B.1.3 integrate TOP prep readability hold"

          npm run build:action-studio
          git diff --exit-code -- tools/action-studio/action-studio.bundle.js tools/action-studio/index.html

          CHANGED="$(git diff --name-only "$BASE"...HEAD | sort)"
          echo "$CHANGED"
          for required in \
            package.json \
            src/combat/parry-top-prep-readability-hold.js \
            tests/parry-top-prep-readability-hold.test.js \
            tests/shield-parry-r281-visual-ownership-baseline.test.js \
            tools/action-studio/shield-parry-r281/pre-contact-controller.js \
            tools/action-studio/shield-parry-r281/visual-ownership-baseline.js \
            tools/action-studio/shield-parry-r281/visual-ownership-runtime-taps.js; do
            echo "$CHANGED" | grep -Fx "$required" >/dev/null
          done
          if echo "$CHANGED" | grep -Ev '^(package.json|src/combat/parry-top-prep-readability-hold.js|tests/parry-top-prep-readability-hold.test.js|tests/shield-parry-r281-visual-ownership-baseline.test.js|tools/action-studio/shield-parry-r281/pre-contact-controller.js|tools/action-studio/shield-parry-r281/visual-ownership-baseline.js|tools/action-studio/shield-parry-r281/visual-ownership-runtime-taps.js|tools/action-studio/action-studio.bundle.js|tools/action-studio/index.html)$' | grep .; then
            echo "Unexpected R18N.4.3-B.1.3 scope" >&2
            exit 1
          fi
          git push origin HEAD:feature/r18n4-3b1-3-top-prep-readability-hold
