name: TEMP Regenerate Action Studio T3.3 G3.5.2

on:
  push:
    branches:
      - agent/t3-3-g3-5-2-guard-visual-stability

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/t3-3-g3-5-2-guard-visual-stability
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build Action Studio standalone artifacts
        run: npm run build:action-studio
      - name: Commit regenerated artifacts when changed
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- tools/action-studio/action-studio.bundle.js tools/action-studio/index.html
          if git diff --cached --quiet; then
            echo 'Action Studio artifacts already current.'
            exit 0
          fi
          git commit -m 'Regenerate Action Studio for T3.3 and G3.5.2'
          git push origin HEAD:agent/t3-3-g3-5-2-guard-visual-stability
