name: R18N.4.3-B.1.1 TOP Direction Compatibility Probe

on:
  push:
    branches:
      - feature/r18n4-3b1-1-top-direction-compatibility-probe

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/r18n4-3b1-1-top-direction-compatibility-probe
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install

      - name: Materialize R18N.4.3-B.1.1 probe integration
        run: node tools/action-studio/r18n4-3b1-1-top-direction-probe-migration.mjs

      - name: Focused TOP compatibility regressions
        run: >-
          node --test
          tests/parry-top-direction-compatibility-probe.test.js
          tests/predictive-parry-arm-delta.test.js
          tests/predictive-parry-arm-additive.test.js
          tests/predictive-intercept-parry.test.js
          tests/shield-parry-r281-active-intercept-runtime.test.js
          tests/shield-parry-r281-visual-ownership-baseline.test.js

      - name: Full regression suite
        run: npm test

      - name: Action Studio build
        run: npm run build:action-studio

      - name: Generated bundle and index parity
        run: git diff --exit-code -- tools/action-studio/action-studio.bundle.js tools/action-studio/index.html

      - name: Live TOP A/B/C compatibility probe
        shell: bash
        run: |
          set -euo pipefail
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          [[ -n "$BROWSER" ]]
          PORT=4185
          DEBUG_PORT=9225
          python3 -m http.server "$PORT" >/tmp/r18n4-3b1-1-http.log 2>&1 & SERVER_PID=$!
          "$BROWSER" --headless=new --no-sandbox --disable-gpu --enable-unsafe-swiftshader \
            --remote-debugging-address=127.0.0.1 --remote-debugging-port="$DEBUG_PORT" \
            --user-data-dir=/tmp/r18n4-3b1-1-chrome-profile about:blank >/tmp/r18n4-3b1-1-chrome.log 2>&1 & CHROME_PID=$!
          trap 'kill "$CHROME_PID" >/dev/null 2>&1 || true; kill "$SERVER_PID" >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 120); do
            curl -fsS "http://127.0.0.1:${DEBUG_PORT}/json/version" >/dev/null && break || true
            sleep 0.25
          done
          curl -fsS "http://127.0.0.1:${DEBUG_PORT}/json/version" >/dev/null

          ACTION_STUDIO_PORT="$PORT" CHROME_DEBUG_PORT="$DEBUG_PORT" node --input-type=module <<'NODE'
          const port = Number(process.env.ACTION_STUDIO_PORT);
          const debugPort = Number(process.env.CHROME_DEBUG_PORT);
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

          async function waitFor(label, predicate, timeoutMs = 60000, intervalMs = 30) {
            const start = Date.now();
            let lastError = null;
            while (Date.now() - start < timeoutMs) {
              try { if (await predicate()) return; } catch (error) { lastError = error; }
              await sleep(intervalMs);
            }
            throw new Error(`Timed out waiting for ${label}${lastError ? `: ${lastError.message}` : ''}`);
          }

          async function openProbePage(variant) {
            const pageUrl = `http://127.0.0.1:${port}/tools/action-studio/shield-driven-contact-coupling-lab.html?debug=1&topProbe=${variant}`;
            const response = await fetch(`http://127.0.0.1:${debugPort}/json/new?${encodeURIComponent(pageUrl)}`, { method: 'PUT' });
            if (!response.ok) throw new Error(`CDP target creation failed: ${response.status}`);
            const target = await response.json();
            const ws = new WebSocket(target.webSocketDebuggerUrl);
            await new Promise((resolve, reject) => {
              ws.addEventListener('open', resolve, { once: true });
              ws.addEventListener('error', reject, { once: true });
            });
            let id = 0;
            const pending = new Map();
            ws.addEventListener('message', (event) => {
              const message = JSON.parse(event.data);
              const waiter = pending.get(message.id);
              if (!waiter) return;
              pending.delete(message.id);
              message.error ? waiter.reject(new Error(message.error.message)) : waiter.resolve(message.result);
            });
            const send = (method, params = {}) => new Promise((resolve, reject) => {
              const requestId = ++id;
              pending.set(requestId, { resolve, reject });
              ws.send(JSON.stringify({ id: requestId, method, params }));
            });
            async function evaluate(expression) {
              const result = await send('Runtime.evaluate', { expression, returnByValue: true, awaitPromise: true });
              if (result.exceptionDetails) throw new Error(result.exceptionDetails.exception?.description || result.exceptionDetails.text || 'Runtime.evaluate failed');
              return result.result?.value;
            }
            await send('Runtime.enable');
            await waitFor(`${variant} R281 lab boot`, () => evaluate(`Boolean(window.__G43B5R281_LAB__?.attackRuntime?.snapshot?.action && window.__G43B5R281_RESULT__ && document.documentElement.dataset.g43b5r281 !== 'fail')`), 90000);
            return { ws, evaluate };
          }

          const installRecorder = `(() => {
            window.__R18N43B11_CAPTURE__ = [];
            window.__R18N43B11_STOP__ = false;
            let lastAttackElapsedMs = null;
            const compact = () => {
              const api = window.__G43B5R281_LAB__;
              const drive = api?.latestInterceptDriveReport;
              const additive = drive?.shieldArmBoundedAdditive;
              const probe = drive?.topDirectionCompatibilityProbe;
              const ownership = api?.latestVisualOwnershipBaseline;
              return {
                attackElapsedMs: Number.isFinite(api?.attackRuntime?.snapshot?.elapsedSeconds) ? api.attackRuntime.snapshot.elapsedSeconds * 1000 : null,
                ttcMs: Number.isFinite(drive?.timeToContactSeconds) ? drive.timeToContactSeconds * 1000 : null,
                probe: probe ? {
                  stage: probe.stage,
                  variant: probe.variant,
                  additiveStepMeters: probe.additiveStepMeters ?? null,
                  upwardDot: probe.upwardDot ?? null,
                  targetDot: probe.targetDot ?? null,
                  compatible: probe.compatible ?? null,
                  reason: probe.reason ?? null,
                  retained: probe.retained ?? null,
                  appliedBehavior: probe.appliedBehavior ?? null,
                  authority: probe.authority ?? null,
                } : null,
                additive: additive ? {
                  active: additive.active,
                  applied: additive.applied,
                  upperTargetDegrees: additive.bones?.['upperarm.l']?.targetAngleDegrees ?? null,
                  lowerTargetDegrees: additive.bones?.['lowerarm.l']?.targetAngleDegrees ?? null,
                  wristTargetDegrees: additive.bones?.['wrist.l']?.targetAngleDegrees ?? null,
                  finalPoseOwner: additive.finalPoseOwner ?? null,
                  authority: additive.authority ?? null,
                } : null,
                targetErrorBeforeMeters: drive?.activeInterceptTargetErrorBeforeMeters ?? null,
                targetErrorAfterMeters: drive?.activeInterceptTargetErrorAfterMeters ?? null,
                writerOrderValid: ownership?.orderValid ?? null,
                writerOrderViolations: ownership?.orderViolations ?? [],
                realContact: api?.latestContact?.contact === true,
                parryConfirmed: api?.latestParryConfirmation?.accepted === true,
                whiff: Boolean(api?.latestParryWhiff),
              };
            };
            window.__R18N43B11_COMPACT__ = compact;
            const tick = () => {
              const sample = compact();
              if (sample.probe && sample.attackElapsedMs !== lastAttackElapsedMs) {
                lastAttackElapsedMs = sample.attackElapsedMs;
                window.__R18N43B11_CAPTURE__.push(sample);
              }
              if (!window.__R18N43B11_STOP__ && !sample.realContact && !sample.whiff) requestAnimationFrame(tick);
            };
            requestAnimationFrame(tick);
            return true;
          })()`;

          async function runTop(page, variant, repetition) {
            const { evaluate } = page;
            const restarted = await evaluate(`window.__G43B5R281_LAB__.restartAttack('top')`);
            if (!restarted) throw new Error(`${variant}/${repetition}: restartAttack rejected`);
            const sequence = await evaluate(`window.__G43B5R281_LAB__.attackRuntime.snapshot.sequence`);
            await waitFor(`${variant}/${repetition} legal Parry prompt`, () => evaluate(`window.__G43B5R281_LAB__.attackRuntime.snapshot.sequence === ${Number(sequence)} && window.__G43B5R281_LAB__.latestParryOpportunity?.accepted === true`), 45000, 25);
            await evaluate(installRecorder);
            const input = await evaluate(`window.__G43B5R281_LAB__.dispatchParryInput('r18n4-3b1-1-top-probe-${variant}-${repetition}')`);
            if (!input?.accepted) throw new Error(`${variant}/${repetition}: Parry input rejected ${input?.reason || 'unknown'}`);
            await waitFor(`${variant}/${repetition} real contact or whiff`, () => evaluate(`Boolean(window.__G43B5R281_LAB__.latestContact?.contact === true || window.__G43B5R281_LAB__.latestParryWhiff || !window.__G43B5R281_LAB__.attackRuntime.snapshot.action)`), 30000, 30);
            await evaluate(`window.__R18N43B11_STOP__ = true`);
            const evidence = await evaluate(`({ samples: window.__R18N43B11_CAPTURE__ || [], terminal: window.__R18N43B11_COMPACT__?.() || null })`);
            const samples = evidence.samples || [];
            const terminal = evidence.terminal || null;
            if (samples.length < 3) throw new Error(`${variant}/${repetition}: only ${samples.length} TOP probe samples`);
            for (const sample of samples) {
              if (sample.probe?.stage !== 'R18N.4.3-B.1.1') throw new Error(`${variant}/${repetition}: wrong probe stage`);
              if (sample.probe?.variant !== variant) throw new Error(`${variant}/${repetition}: wrong probe variant`);
              if (sample.probe?.authority !== 'lab-probe-only-no-contact-authority') throw new Error(`${variant}/${repetition}: probe authority changed`);
              if (sample.writerOrderValid === false) throw new Error(`${variant}/${repetition}: writer order violation`);
              if ((sample.additive?.upperTargetDegrees ?? 0) > 8.000001) throw new Error(`${variant}/${repetition}: upperarm cap exceeded`);
              if ((sample.additive?.lowerTargetDegrees ?? 0) > 10.000001) throw new Error(`${variant}/${repetition}: lowerarm cap exceeded`);
              if ((sample.additive?.wristTargetDegrees ?? 0) > 0.000001) throw new Error(`${variant}/${repetition}: wrist additive escaped solver-only policy`);
              if (sample.additive?.finalPoseOwner && sample.additive.finalPoseOwner !== 'active-intercept-final-arm-closure') throw new Error(`${variant}/${repetition}: final pose owner changed`);
              if (variant === 'A' && sample.additive?.applied === true) throw new Error(`${variant}/${repetition}: solver-only baseline still applied authored additive`);
              if (variant === 'C' && sample.probe?.compatible === false && sample.probe?.retained !== false) throw new Error(`${variant}/${repetition}: incompatible C additive was not rejected`);
            }
            if (!terminal?.realContact || !terminal?.parryConfirmed || terminal?.whiff) throw new Error(`${variant}/${repetition}: real-contact Parry terminal failed`);
            const measurable = samples.filter((sample) => Number.isFinite(sample.probe?.additiveStepMeters) && sample.probe.additiveStepMeters > 1e-6);
            const summary = {
              variant,
              repetition,
              sequence,
              inputTtcMs: Number.isFinite(input.timeToContactSeconds) ? input.timeToContactSeconds * 1000 : null,
              sampleCount: samples.length,
              measurableCount: measurable.length,
              compatibleCount: samples.filter((sample) => sample.probe?.compatible === true).length,
              incompatibleCount: samples.filter((sample) => sample.probe?.compatible === false).length,
              rejectedCount: samples.filter((sample) => sample.probe?.retained === false).length,
              minUpwardDot: measurable.length ? Math.min(...measurable.map((sample) => sample.probe.upwardDot ?? 1)) : null,
              maxUpwardDot: measurable.length ? Math.max(...measurable.map((sample) => sample.probe.upwardDot ?? -1)) : null,
              minTargetDot: measurable.filter((sample) => Number.isFinite(sample.probe?.targetDot)).length
                ? Math.min(...measurable.filter((sample) => Number.isFinite(sample.probe?.targetDot)).map((sample) => sample.probe.targetDot))
                : null,
              terminal,
            };
            console.log(`R18N43B11_TOP=${JSON.stringify(summary)}`);
            return summary;
          }

          const result = { stage: 'R18N.4.3-B.1.1', variants: {} };
          for (const variant of ['A', 'B', 'C']) {
            const page = await openProbePage(variant);
            try {
              result.variants[variant] = [];
              for (let repetition = 1; repetition <= 2; repetition += 1) {
                result.variants[variant].push(await runTop(page, variant, repetition));
              }
            } finally {
              page.ws.close();
            }
          }
          console.log(`R18N43B11_RESULT=${JSON.stringify(result)}`);
          NODE

      - name: Commit validated probe and remove one-shot files
        shell: bash
        run: |
          set -euo pipefail
          BASE=55d459a9d28210d451bfc90fdb31dc8e6b68d6f4
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/r18n4-3b1-1-top-direction-compatibility-probe.yml
          git rm tools/action-studio/r18n4-3b1-1-top-direction-probe-migration.mjs
          git add package.json tools/action-studio/shield-parry-r281/pre-contact-controller.js
          git commit -m "R18N.4.3-B.1.1 integrate TOP direction compatibility probe"
          EXPECTED="$(printf '%s\n' \
            package.json \
            src/combat/parry-top-direction-compatibility-probe.js \
            tests/parry-top-direction-compatibility-probe.test.js \
            tools/action-studio/shield-parry-r281/pre-contact-controller.js | sort)"
          CHANGED="$(git diff --name-only "$BASE"...HEAD | sort)"
          echo "$CHANGED"
          [[ "$CHANGED" == "$EXPECTED" ]]
          git push origin HEAD:feature/r18n4-3b1-1-top-direction-compatibility-probe
