name: G3.5.1P Parry Contact Deflect Probe

on:
  pull_request:
    paths:
      - 'assets/skyrim/guard/converted/**'
      - 'src/animation/skyrim-converted-animation-library.js'
      - 'src/combat/parry-contact-deflect-probe.js'
      - 'tools/action-studio/parry-contact-deflect-probe.*'
      - 'tests/parry-contact-deflect-probe.test.js'
      - '.github/workflows/parry-contact-deflect-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify frozen source assets
        shell: bash
        run: |
          test "$(sha256sum assets/skyrim/guard/converted/shd_blockhit.source.glb | cut -d' ' -f1)" = "270d68b5c62a7de68c39112ab9a813f27a758ac737a078fe55b21896cfce1f28"
          test "$(sha256sum assets/skyrim/guard/converted/shd_blockbash.source.glb | cut -d' ' -f1)" = "bae74b1cdf8724eb17073a7347192946fef8cc9cedcdb8c9728e6ea9004ea637"
          test "$(sha256sum assets/skyrim/guard/converted/shd_blockbashpower.source.glb | cut -d' ' -f1)" = "603cf8326501ca2dd3628e8f47c37c6cbad6bec491b224123af418e70c36fd47"

      - name: Run G3.5.1P unit test
        run: node --test tests/parry-contact-deflect-probe.test.js

      - name: Locate headless browser
        id: browser
        shell: bash
        run: |
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$BROWSER"
          echo "browser=$BROWSER" >> "$GITHUB_OUTPUT"
          "$BROWSER" --version

      - name: Verify contact then deflect visual runtime
        shell: bash
        env:
          BROWSER: ${{ steps.browser.outputs.browser }}
        run: |
          mkdir -p artifacts/g3-5-1p
          python3 -m http.server 4173 > /tmp/g351p-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          BASE='http://127.0.0.1:4173/tools/action-studio/parry-contact-deflect-probe.html'

          "$BROWSER" --headless --no-sandbox --disable-gpu --enable-unsafe-swiftshader --hide-scrollbars \
            --window-size=1500,1000 --virtual-time-budget=30000 --dump-dom \
            "${BASE}?variant=parry&elapsed=275&view=three" > artifacts/g3-5-1p/g351p-dom.html
          grep -q 'data-g351p="pass"' artifacts/g3-5-1p/g351p-dom.html
          grep -q 'data-g351p-normal="pass"' artifacts/g3-5-1p/g351p-dom.html
          grep -q 'data-g351p-perfect="pass"' artifacts/g3-5-1p/g351p-dom.html

          "$BROWSER" --headless --no-sandbox --disable-gpu --enable-unsafe-swiftshader --hide-scrollbars \
            --window-size=1500,1000 --virtual-time-budget=22000 \
            --screenshot="artifacts/g3-5-1p/normal-contact-160ms.png" \
            "${BASE}?variant=parry&elapsed=160&view=three"
          "$BROWSER" --headless --no-sandbox --disable-gpu --enable-unsafe-swiftshader --hide-scrollbars \
            --window-size=1500,1000 --virtual-time-budget=22000 \
            --screenshot="artifacts/g3-5-1p/normal-blend-275ms.png" \
            "${BASE}?variant=parry&elapsed=275&view=three"
          "$BROWSER" --headless --no-sandbox --disable-gpu --enable-unsafe-swiftshader --hide-scrollbars \
            --window-size=1500,1000 --virtual-time-budget=22000 \
            --screenshot="artifacts/g3-5-1p/normal-deflect-390ms.png" \
            "${BASE}?variant=parry&elapsed=390&view=three"
          "$BROWSER" --headless --no-sandbox --disable-gpu --enable-unsafe-swiftshader --hide-scrollbars \
            --window-size=1500,1000 --virtual-time-budget=22000 \
            --screenshot="artifacts/g3-5-1p/perfect-deflect-470ms.png" \
            "${BASE}?variant=perfect&elapsed=470&view=three"
          "$BROWSER" --headless --no-sandbox --disable-gpu --enable-unsafe-swiftshader --hide-scrollbars \
            --window-size=1500,1000 --virtual-time-budget=22000 \
            --screenshot="artifacts/g3-5-1p/perfect-deflect-side-470ms.png" \
            "${BASE}?variant=perfect&elapsed=470&view=side"

      - name: Upload G3.5.1P visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: g3-5-1p-parry-contact-deflect-probe
          path: artifacts/g3-5-1p
