name: R18M.5 Pre-contact Controller Migration

on:
  pull_request:
    branches:
      - refactor/shield-parry-r18m-maintainability
    paths:
      - .r18m5-trigger

concurrency:
  group: r18m5-precontact-migration
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  migrate-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout R18M branch
        uses: actions/checkout@v4
        with:
          ref: refactor/shield-parry-r18m-maintainability
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Capture exact R18M.4 full-suite failure baseline
        shell: bash
        run: |
          set +e
          npm test > r18m5-baseline.log 2>&1
          BASELINE_EXIT=$?
          set -e
          node <<'NODE'
          const fs = require('fs');
          const text = fs.readFileSync('r18m5-baseline.log', 'utf8');
          const titles = [...text.matchAll(/^\s*not ok \d+ - (.+)$/gm)]
            .map((match) => match[1].trim())
            .sort();
          fs.writeFileSync('r18m5-baseline.failures', `${titles.join('\n')}${titles.length ? '\n' : ''}`);
          console.log(`R18M.4 baseline failure titles: ${titles.length}`);
          for (const title of titles) console.log(`BASELINE FAIL: ${title}`);
          NODE
          echo "Baseline npm test exit: ${BASELINE_EXIT}"

      - name: Apply guarded R18M.5 extraction
        run: node tools/action-studio/r18m5-precontact-migration.mjs

      - name: Adapt existing contracts to the extracted ownership boundary
        run: node tools/action-studio/r18m5-contract-patch.mjs

      - name: Syntax checks
        run: |
          node --check tools/action-studio/shield-driven-contact-coupling-lab-r281.js
          node --check tools/action-studio/shield-parry-r281/pre-contact-controller.js
          node --check tests/shield-parry-r281-pre-contact-controller.test.js
          node --check tests/shield-driven-contact-coupling-r281-regression.test.js
          node --check tests/shield-parry-r281-exchange-state.test.js

      - name: R18M focused regression contracts
        run: |
          node --test \
            tests/shield-driven-contact-coupling-r281-regression.test.js \
            tests/shield-parry-r281-diagnostics.test.js \
            tests/shield-parry-r281-ui.test.js \
            tests/shield-parry-r281-exchange-state.test.js \
            tests/shield-parry-r281-pre-contact-controller.test.js

      - name: Build Action Studio
        run: npm run build:action-studio

      - name: Verify standalone Action Studio files stay current
        shell: bash
        run: |
          git diff --exit-code -- tools/action-studio/action-studio.bundle.js tools/action-studio/index.html

      - name: Verify Guard Runtime browser surface
        shell: bash
        run: bash tools/action-studio/verify-guard-runtime-surface.sh

      - name: Compare full-suite failure titles with exact R18M.4 baseline
        shell: bash
        run: |
          set +e
          npm test > r18m5-candidate.log 2>&1
          CANDIDATE_EXIT=$?
          set -e
          node <<'NODE'
          const fs = require('fs');
          const text = fs.readFileSync('r18m5-candidate.log', 'utf8');
          const titles = [...text.matchAll(/^\s*not ok \d+ - (.+)$/gm)]
            .map((match) => match[1].trim())
            .sort();
          fs.writeFileSync('r18m5-candidate.failures', `${titles.join('\n')}${titles.length ? '\n' : ''}`);
          console.log(`R18M.5 candidate failure titles: ${titles.length}`);
          for (const title of titles) console.log(`CANDIDATE FAIL: ${title}`);
          NODE
          echo "Candidate npm test exit: ${CANDIDATE_EXIT}"
          diff -u r18m5-baseline.failures r18m5-candidate.failures

      - name: Diff hygiene and allowed-path guard
        shell: bash
        run: |
          git diff --check
          rm -f r18m5-baseline.log r18m5-candidate.log r18m5-baseline.failures r18m5-candidate.failures
          rm -f tools/action-studio/r18m5-precontact-migration.mjs
          rm -f tools/action-studio/r18m5-contract-patch.mjs
          rm -f .github/workflows/r18m5-precontact-migration.yml
          ALLOWED='^( M|M |A | A|D | D|\?\?) (package\.json|tools/action-studio/shield-driven-contact-coupling-lab-r281\.js|tools/action-studio/shield-parry-r281/pre-contact-controller\.js|tests/shield-parry-r281-pre-contact-controller\.test\.js|tests/shield-driven-contact-coupling-r281-regression\.test\.js|tests/shield-parry-r281-exchange-state\.test\.js|tools/action-studio/r18m5-precontact-migration\.mjs|tools/action-studio/r18m5-contract-patch\.mjs|\.github/workflows/r18m5-precontact-migration\.yml)$'
          git status --short
          UNEXPECTED=$(git status --short | grep -Ev "$ALLOWED" || true)
          if [ -n "$UNEXPECTED" ]; then
            echo 'Unexpected working-tree changes detected:' >&2
            echo "$UNEXPECTED" >&2
            exit 1
          fi

      - name: Commit verified R18M.5 migration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            package.json \
            tools/action-studio/shield-driven-contact-coupling-lab-r281.js \
            tools/action-studio/shield-parry-r281/pre-contact-controller.js \
            tests/shield-parry-r281-pre-contact-controller.test.js \
            tests/shield-driven-contact-coupling-r281-regression.test.js \
            tests/shield-parry-r281-exchange-state.test.js \
            tools/action-studio/r18m5-precontact-migration.mjs \
            tools/action-studio/r18m5-contract-patch.mjs \
            .github/workflows/r18m5-precontact-migration.yml
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'R18M.5 extract pre-contact controller'
          git push origin HEAD:refactor/shield-parry-r18m-maintainability
