name: R18N.3 RIGHT Swept Contact Margin

on:
  pull_request:
    branches:
      - feature/r18n3-active-intercept-last-writer-pose-authority

permissions:
  contents: read

jobs:
  diagnose-right-margin:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/r18n3-active-intercept-last-writer-pose-authority
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Apply conservative candidate
        run: |
          node tools/action-studio/r18n1-stable-active-intercept-migration.mjs
          node tools/action-studio/r18n3-active-intercept-last-writer-migration.mjs
          node tools/action-studio/r18n3-fixed-target-arm-closure-migration.mjs
      - name: Lock authority and tuning
        run: |
          node --check tools/action-studio/r18n3-right-contact-margin-probe.mjs
          grep -q "maxTrackingSpeedMps: 1.6" src/combat/guard-threat-tracking.js
          grep -q "upperArmMaxDegrees: 14" src/combat/guard-threat-tracking.js
          grep -q "lowerArmMaxDegrees: 18" src/combat/guard-threat-tracking.js
          grep -q "jointBudgetScale: 0.35" tools/action-studio/shield-parry-r281/pre-contact-controller.js
          grep -q "iterations: 2" tools/action-studio/shield-parry-r281/pre-contact-controller.js
          grep -q "get latestContact()" tools/action-studio/shield-parry-r281/debug-api.js
          grep -q "bounded-guidance-only-real-swept-contact-still-required" src/combat/active-parry-intercept-intent.js
      - name: Focused contracts
        run: |
          node --test \
            tests/r18n3-active-intercept-last-writer.test.js \
            tests/guard-threat-tracking.test.js \
            tests/shield-parry-r281-contact-handoff-controller.test.js \
            tests/old-two-actor-b3-direct-diagnostic.test.js
      - name: Run RIGHT margin probe
        shell: bash
        run: |
          set -euo pipefail
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$BROWSER"
          python3 -m http.server 4175 > r18n3-v62-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" >/dev/null 2>&1 || true' EXIT
          sleep 2
          BROWSER="$BROWSER" R18N3_V62_TTC='0.110' R18N3_V62_TRIALS='8' \
            node tools/action-studio/r18n3-right-contact-margin-probe.mjs | tee r18n3-v62-probe.log
          grep -q '^R18N3_V62_PROBE_JSON=' r18n3-v62-probe.log
      - name: Summarize physical contact margin
        shell: bash
        run: |
          node <<'NODE' | tee r18n3-v62-summary.log
          const fs = require('fs');
          const line = fs.readFileSync('r18n3-v62-probe.log','utf8').split(/\r?\n/).find(v => v.startsWith('R18N3_V62_PROBE_JSON='));
          if (!line) throw new Error('missing v6.2 JSON');
          const data = JSON.parse(line.slice('R18N3_V62_PROBE_JSON='.length));
          if (data.trials?.length !== 8) throw new Error(`expected 8 trials, got ${data.trials?.length}`);
          for (const row of data.trials) {
            if (!(Number(row.actualTtc) > 0)) throw new Error('missing actual TTC');
            if (row.confirmed === row.whiff) throw new Error('trial must resolve to exactly contact or whiff');
          }
          const contacts = data.trials.filter(r => r.confirmed);
          const whiffs = data.trials.filter(r => r.whiff);
          const edge = contacts.map(r => Number(r.edgeMarginMeters)).filter(Number.isFinite);
          const radial = whiffs.map(r => Number(r.radialGapMeters)).filter(Number.isFinite);
          const plane = whiffs.map(r => Number(r.planeGapMeters)).filter(Number.isFinite);
          const combined = whiffs.map(r => Number(r.combinedGapMeters)).filter(Number.isFinite);
          console.log(`R18N3_V62_TOTAL contact=${contacts.length}/8 whiff=${whiffs.length}/8`);
          console.log(`R18N3_V62_CONTACT_EDGE_MARGIN_MM=${edge.map(v => (v*1000).toFixed(3)).join(',') || 'none'}`);
          console.log(`R18N3_V62_WHIFF_RADIAL_GAP_MM=${radial.map(v => (v*1000).toFixed(3)).join(',') || 'none'}`);
          console.log(`R18N3_V62_WHIFF_PLANE_GAP_MM=${plane.map(v => (v*1000).toFixed(3)).join(',') || 'none'}`);
          console.log(`R18N3_V62_WHIFF_COMBINED_GAP_MM=${combined.map(v => (v*1000).toFixed(3)).join(',') || 'none'}`);
          console.log(`R18N3_V62_WHIFF_CATEGORIES=${whiffs.map(v => v.whiffCategory).join(',') || 'none'}`);
          console.log('R18N3_V62_DIAGNOSTIC=PASS');
          NODE
      - run: git diff --check
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r18n3-right-contact-margin-v6-2
          path: |
            r18n3-v62-probe.log
            r18n3-v62-summary.log
            r18n3-v62-http.log
          retention-days: 3
