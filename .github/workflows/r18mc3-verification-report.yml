name: R18M.C3 Verification Report Extraction

on:
  pull_request:
    branches:
      - refactor/r18m-c3-verification-report
    paths:
      - .r18mc3-trigger

concurrency:
  group: r18mc3-verification-report
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  migrate-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout C3 branch
        uses: actions/checkout@v4
        with:
          ref: refactor/r18m-c3-verification-report
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Capture exact current verified parent failure baseline
        shell: bash
        run: |
          set +e
          npm test > c3-baseline.log 2>&1
          BASELINE_EXIT=$?
          set -e
          node <<'NODE'
          const fs = require('fs');
          const text = fs.readFileSync('c3-baseline.log', 'utf8');
          const titles = [...text.matchAll(/^\s*not ok \d+ - (.+)$/gm)].map((m) => m[1].trim()).sort();
          fs.writeFileSync('c3-baseline.failures', `${titles.join('\n')}${titles.length ? '\n' : ''}`);
          console.log(`C3 baseline failure titles: ${titles.length}`);
          for (const title of titles) console.log(`BASELINE FAIL: ${title}`);
          NODE
          echo "Baseline npm test exit: ${BASELINE_EXIT}"

      - name: Apply guarded C3 extraction
        run: node tools/action-studio/r18mc3-verification-report-migration.mjs

      - name: Normalize C3 candidate files
        shell: bash
        run: |
          sed -i 's/[[:space:]]\+$//' tools/action-studio/shield-parry-r281/verification-report.js
          sed -i 's/[[:space:]]\+$//' tools/action-studio/shield-driven-contact-coupling-lab-r281.js
          sed -i 's/[[:space:]]\+$//' tests/shield-parry-r281-verification-report.test.js
          sed -i 's/[[:space:]]\+$//' tests/shield-driven-contact-coupling-r281-regression.test.js

      - name: Syntax and C3 direct contracts
        run: |
          node --check tools/action-studio/shield-parry-r281/verification-report.js
          node --check tools/action-studio/shield-driven-contact-coupling-lab-r281.js
          node --check tests/shield-parry-r281-verification-report.test.js
          node --check tests/shield-driven-contact-coupling-r281-regression.test.js
          node --test tests/shield-parry-r281-verification-report.test.js

      - name: R18M focused regression contracts
        run: |
          node --test \
            tests/shield-driven-contact-coupling-r281-regression.test.js \
            tests/shield-parry-r281-diagnostics.test.js \
            tests/shield-parry-r281-ui.test.js \
            tests/shield-parry-r281-ui-runtime.test.js \
            tests/shield-parry-r281-exchange-state.test.js \
            tests/shield-parry-r281-pre-contact-controller.test.js \
            tests/shield-parry-r281-contact-handoff-controller.test.js \
            tests/shield-parry-r281-composition-scene.test.js \
            tests/shield-parry-r281-attacker-presentation.test.js \
            tests/shield-parry-r281-verification-report.test.js

      - name: Build Action Studio
        run: npm run build:action-studio

      - name: Verify standalone Action Studio files stay current
        shell: bash
        run: git diff --exit-code -- tools/action-studio/action-studio.bundle.js tools/action-studio/index.html

      - name: Verify Guard Runtime browser surface
        shell: bash
        run: bash tools/action-studio/verify-guard-runtime-surface.sh

      - name: Compare candidate failure titles with exact baseline
        shell: bash
        run: |
          set +e
          npm test > c3-candidate.log 2>&1
          CANDIDATE_EXIT=$?
          set -e
          node <<'NODE'
          const fs = require('fs');
          const text = fs.readFileSync('c3-candidate.log', 'utf8');
          const titles = [...text.matchAll(/^\s*not ok \d+ - (.+)$/gm)].map((m) => m[1].trim()).sort();
          fs.writeFileSync('c3-candidate.failures', `${titles.join('\n')}${titles.length ? '\n' : ''}`);
          console.log(`C3 candidate failure titles: ${titles.length}`);
          for (const title of titles) console.log(`CANDIDATE FAIL: ${title}`);
          NODE
          echo "Candidate npm test exit: ${CANDIDATE_EXIT}"
          diff -u c3-baseline.failures c3-candidate.failures

      - name: Diff hygiene and allowed-path guard
        shell: bash
        run: |
          git diff --check
          rm -f c3-baseline.log c3-candidate.log c3-baseline.failures c3-candidate.failures package-lock.json
          rm -f .github/workflows/r18mc3-verification-report.yml
          rm -f tools/action-studio/r18mc3-verification-report-migration.mjs
          ALLOWED='^( M|M |A | A|D | D|\?\?) (package\.json|tools/action-studio/shield-driven-contact-coupling-lab-r281\.js|tools/action-studio/shield-parry-r281/verification-report\.js|tests/shield-parry-r281-verification-report\.test\.js|tests/shield-driven-contact-coupling-r281-regression\.test\.js|\.github/workflows/r18mc3-verification-report\.yml|tools/action-studio/r18mc3-verification-report-migration\.mjs)$'
          git status --short
          UNEXPECTED=$(git status --short | grep -Ev "$ALLOWED" || true)
          if [ -n "$UNEXPECTED" ]; then
            echo 'Unexpected C3 working-tree changes:' >&2
            echo "$UNEXPECTED" >&2
            exit 1
          fi

      - name: Commit verified C3 migration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- \
            package.json \
            tools/action-studio/shield-driven-contact-coupling-lab-r281.js \
            tools/action-studio/shield-parry-r281/verification-report.js \
            tests/shield-parry-r281-verification-report.test.js \
            tests/shield-driven-contact-coupling-r281-regression.test.js \
            .github/workflows/r18mc3-verification-report.yml \
            tools/action-studio/r18mc3-verification-report-migration.mjs
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'R18M.C3 extract verification report builder'
          git push origin HEAD:refactor/r18m-c3-verification-report
