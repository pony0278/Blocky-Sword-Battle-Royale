name: R18N.3 RIGHT Active-Window Hitch Reproduction

on:
  pull_request:
    branches:
      - feature/r18n3-active-intercept-last-writer-pose-authority

permissions:
  contents: read

jobs:
  reproduce-right-active-window-hitch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/r18n3-active-intercept-last-writer-pose-authority
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Apply conservative candidate and diagnostic telemetry
        run: |
          node tools/action-studio/r18n1-stable-active-intercept-migration.mjs
          node tools/action-studio/r18n3-active-intercept-last-writer-migration.mjs
          node tools/action-studio/r18n3-fixed-target-arm-closure-migration.mjs
          node tools/action-studio/r18n3-active-window-boundary-migration.mjs
      - name: Lock authority and active window
        run: |
          node --check tools/action-studio/r18n3-right-active-window-hitch-probe.mjs
          grep -q "const ACTIVE_LEAD_SECONDS = Object.freeze({ top: 0.055, right: 0.04, left: 0.045 })" src/combat/longsword-directional-attack-runtime.js
          grep -q "const ACTIVE_TRAIL_SECONDS = Object.freeze({ top: 0.065, right: 0.05, left: 0.055 })" src/combat/longsword-directional-attack-runtime.js
          grep -q "active: snapshot.phase === LONGSWORD_ATTACK_PHASES.ACTIVE" tools/action-studio/shield-parry-r281/contact-handoff-controller.js
          grep -q "probeDeltaSeconds:" tools/action-studio/shield-parry-r281/pre-contact-controller.js
          grep -q "jointBudgetScale: 0.35" tools/action-studio/shield-parry-r281/pre-contact-controller.js
          grep -q "iterations: 2" tools/action-studio/shield-parry-r281/pre-contact-controller.js
          grep -q "bounded-guidance-only-real-swept-contact-still-required" src/combat/active-parry-intercept-intent.js
      - name: Focused regression contracts
        run: |
          node --test \
            tests/longsword-directional-attack-runtime.test.js \
            tests/r18n3-active-intercept-last-writer.test.js \
            tests/shield-parry-r281-contact-handoff-controller.test.js \
            tests/old-two-actor-b3-direct-diagnostic.test.js
      - name: Run controlled RIGHT frame-hitch reproduction
        shell: bash
        run: |
          set -euo pipefail
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$BROWSER"
          python3 -m http.server 4175 > r18n3-v63-hitch-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" >/dev/null 2>&1 || true' EXIT
          sleep 2
          BROWSER="$BROWSER" \
            R18N3_V63_HITCH_TTC='0.110' \
            R18N3_V63_HITCH_AT='0.235' \
            R18N3_V63_HITCH_MS='55' \
            R18N3_V63_HITCH_TRIALS='4' \
            node tools/action-studio/r18n3-right-active-window-hitch-probe.mjs | tee r18n3-v63-hitch-probe.log
          grep -q '^R18N3_V63_HITCH_JSON=' r18n3-v63-hitch-probe.log
      - name: Validate frame-end vs sub-frame contact evidence
        shell: bash
        run: |
          node <<'NODE' | tee r18n3-v63-hitch-summary.log
          const fs = require('fs');
          const line = fs.readFileSync('r18n3-v63-hitch-probe.log','utf8').split(/\r?\n/)
            .find(v => v.startsWith('R18N3_V63_HITCH_JSON='));
          if (!line) throw new Error('missing v6.3 hitch JSON');
          const data = JSON.parse(line.slice('R18N3_V63_HITCH_JSON='.length));
          if (data.trials?.length !== 4) throw new Error(`expected 4 hitch trials, got ${data.trials?.length}`);
          for (const row of data.trials) {
            if (!Number.isFinite(Number(row.hitch?.actualMs)) || Number(row.hitch.actualMs) < 45) {
              throw new Error(`trial ${row.trial} did not create a meaningful hitch`);
            }
            if (!Number.isFinite(Number(row.deltaSeconds)) || !Number.isFinite(Number(row.sweepAlpha))) {
              throw new Error(`trial ${row.trial} is missing sub-frame contact timing`);
            }
          }
          const outside = data.trials.filter(r => r.whiffCategory === 'CONTACT_OUTSIDE_ACTIVE_WINDOW');
          if (outside.length < 1) throw new Error('controlled hitch did not reproduce outside-active geometric contact');
          const mismatch = outside.filter(r => r.eligibilityMismatch === true);
          for (const row of outside) {
            console.log(
              `R18N3_V63_HITCH_OUTSIDE trial=${row.trial} phase=${row.framePhase} ` +
              `hitchMs=${Number(row.hitch.actualMs).toFixed(3)} ` +
              `frameEndVsActiveEndMs=${Number(row.frameEndFromActiveEndMs).toFixed(3)} ` +
              `geometricVsActiveEndMs=${Number(row.geometricFromActiveEndMs).toFixed(3)} ` +
              `sweepAlpha=${Number(row.sweepAlpha).toFixed(4)} ` +
              `deltaMs=${(Number(row.deltaSeconds)*1000).toFixed(3)} ` +
              `geometricWindow=${row.geometricWindowPosition} ` +
              `eligibilityMismatch=${row.eligibilityMismatch}`,
            );
          }
          console.log(`R18N3_V63_HITCH_TOTAL outsideActive=${outside.length}/4 mismatch=${mismatch.length}/4`);
          console.log('R18N3_V63_HITCH_DIAGNOSTIC=PASS');
          NODE
      - name: Diff hygiene
        run: git diff --check
      - name: Upload v6.3 hitch evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r18n3-right-active-window-hitch-v6-3
          path: |
            r18n3-v63-hitch-probe.log
            r18n3-v63-hitch-summary.log
            r18n3-v63-hitch-http.log
          retention-days: 3
