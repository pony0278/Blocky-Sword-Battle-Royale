name: R18N.0 Active Parry Intercept Diagnosis

on:
  pull_request:
    branches:
      - diagnostic/r18n0-active-parry-intercept

permissions:
  contents: write

jobs:
  diagnose-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout R18N.0 branch
        uses: actions/checkout@v4
        with:
          ref: diagnostic/r18n0-active-parry-intercept
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Capture fresh C6 failure-title baseline
        shell: bash
        run: |
          set +e
          npm test > r18n0-baseline.log 2>&1
          BASELINE_EXIT=$?
          set -e
          node <<'NODE'
          const fs = require('fs');
          const text = fs.readFileSync('r18n0-baseline.log', 'utf8');
          const titles = [...text.matchAll(/^\s*not ok \d+ - (.+)$/gm)].map((m) => m[1].trim()).sort();
          fs.writeFileSync('r18n0-baseline.failures', `${titles.join('\n')}${titles.length ? '\n' : ''}`);
          console.log(`R18N.0 baseline failure titles: ${titles.length}`);
          for (const title of titles) console.log(`BASELINE FAIL: ${title}`);
          NODE
          echo "Baseline npm test exit: ${BASELINE_EXIT}"
          test "$(wc -l < r18n0-baseline.failures)" -eq 14

      - name: Prove diagnosis integration contract is red before migration
        shell: bash
        run: |
          set +e
          node --test tests/shield-parry-r281-active-parry-intercept-diagnosis.test.js > r18n0-pre.log 2>&1
          PRE_EXIT=$?
          set -e
          cat r18n0-pre.log
          test "$PRE_EXIT" -ne 0
          grep -q 'activeParryInterceptDiagnosis' r18n0-pre.log

      - name: Apply guarded diagnosis integration
        run: node tools/action-studio/r18n0-active-parry-diagnosis-migration.mjs

      - name: Normalize candidate files
        shell: bash
        run: |
          for f in \
            tools/action-studio/shield-parry-r281/active-parry-intercept-diagnosis.js \
            tools/action-studio/shield-parry-r281/debug-api.js \
            tests/shield-parry-r281-active-parry-intercept-diagnosis.test.js; do
            sed -i 's/[[:space:]]\+$//' "$f"
          done

      - name: Syntax and R18N.0 direct contracts
        run: |
          node --check tools/action-studio/shield-parry-r281/active-parry-intercept-diagnosis.js
          node --check tools/action-studio/shield-parry-r281/debug-api.js
          node --check tests/shield-parry-r281-active-parry-intercept-diagnosis.test.js
          node --test tests/shield-parry-r281-active-parry-intercept-diagnosis.test.js

      - name: R18M plus R18N focused regression contracts
        run: |
          node --test \
            tests/shield-driven-contact-coupling-r281-regression.test.js \
            tests/shield-parry-r281-diagnostics.test.js \
            tests/shield-parry-r281-ui.test.js \
            tests/shield-parry-r281-ui-runtime.test.js \
            tests/shield-parry-r281-exchange-state.test.js \
            tests/shield-parry-r281-pre-contact-controller.test.js \
            tests/shield-parry-r281-contact-handoff-controller.test.js \
            tests/shield-parry-r281-composition-scene.test.js \
            tests/shield-parry-r281-attacker-presentation.test.js \
            tests/shield-parry-r281-verification-report.test.js \
            tests/shield-parry-r281-direct-old-b3-diagnostic.test.js \
            tests/shield-parry-r281-startup-debug-facade.test.js \
            tests/shield-parry-r281-thin-entry-audit.test.js \
            tests/shield-parry-r281-active-parry-intercept-diagnosis.test.js \
            tests/old-two-actor-b3-direct-diagnostic.test.js

      - name: Keep R281 entry unchanged
        run: git diff --exit-code c79fcf9bf8d0b4707277e8a1425927ffbe1a1354 -- tools/action-studio/shield-driven-contact-coupling-lab-r281.js

      - name: Build Action Studio
        run: npm run build:action-studio

      - name: Verify standalone Action Studio files stay current
        run: git diff --exit-code -- tools/action-studio/action-studio.bundle.js tools/action-studio/index.html

      - name: Verify Guard Runtime browser surface
        run: bash tools/action-studio/verify-guard-runtime-surface.sh

      - name: Run TOP and RIGHT standalone browser diagnosis
        shell: bash
        run: |
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$BROWSER"
          python3 -m http.server 4174 > /tmp/r18n0-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" >/dev/null 2>&1 || true' EXIT
          sleep 2
          BROWSER="$BROWSER" R18N0_PAGE_URL='http://127.0.0.1:4174/tools/action-studio/shield-driven-contact-coupling-lab.html' \
            node tools/action-studio/r18n0-active-parry-browser-probe.mjs | tee r18n0-probe.log
          grep -q '^R18N0_PROBE_JSON=' r18n0-probe.log
          node <<'NODE'
          const fs = require('fs');
          const line = fs.readFileSync('r18n0-probe.log', 'utf8').split(/\r?\n/).find((value) => value.startsWith('R18N0_PROBE_JSON='));
          const data = JSON.parse(line.slice('R18N0_PROBE_JSON='.length));
          for (const direction of ['top', 'right']) {
            const row = data[direction];
            if (row.inputResult?.accepted !== true) throw new Error(`${direction} probe input was not accepted`);
            if (row.final?.contact?.confirmed !== true) throw new Error(`${direction} probe did not reach confirmed real contact`);
            console.log(`R18N0 ${direction.toUpperCase()} input:`, JSON.stringify(row.afterInput));
            console.log(`R18N0 ${direction.toUpperCase()} final:`, JSON.stringify(row.final));
          }
          NODE

      - name: Compare candidate failure titles with exact fresh baseline
        shell: bash
        run: |
          set +e
          npm test > r18n0-candidate.log 2>&1
          CANDIDATE_EXIT=$?
          set -e
          node <<'NODE'
          const fs = require('fs');
          const text = fs.readFileSync('r18n0-candidate.log', 'utf8');
          const titles = [...text.matchAll(/^\s*not ok \d+ - (.+)$/gm)].map((m) => m[1].trim()).sort();
          fs.writeFileSync('r18n0-candidate.failures', `${titles.join('\n')}${titles.length ? '\n' : ''}`);
          console.log(`R18N.0 candidate failure titles: ${titles.length}`);
          NODE
          echo "Candidate npm test exit: ${CANDIDATE_EXIT}"
          diff -u r18n0-baseline.failures r18n0-candidate.failures

      - name: Diff hygiene and allowed paths
        shell: bash
        run: |
          git diff --check
          rm -f r18n0-baseline.log r18n0-candidate.log r18n0-baseline.failures r18n0-candidate.failures r18n0-pre.log r18n0-probe.log package-lock.json
          rm -f .github/workflows/r18n0-active-parry-intercept-diagnosis.yml
          rm -f tools/action-studio/r18n0-active-parry-diagnosis-migration.mjs
          rm -f tools/action-studio/r18n0-active-parry-browser-probe.mjs
          ALLOWED='^( M|M |A | A|D | D|\?\?) (package\.json|tools/action-studio/shield-parry-r281/active-parry-intercept-diagnosis\.js|tools/action-studio/shield-parry-r281/debug-api\.js|tests/shield-parry-r281-active-parry-intercept-diagnosis\.test\.js|\.github/workflows/r18n0-active-parry-intercept-diagnosis\.yml|tools/action-studio/r18n0-active-parry-diagnosis-migration\.mjs|tools/action-studio/r18n0-active-parry-browser-probe\.mjs)$'
          git status --short
          UNEXPECTED=$(git status --short | grep -Ev "$ALLOWED" || true)
          if [ -n "$UNEXPECTED" ]; then
            echo 'Unexpected R18N.0 working-tree changes:' >&2
            echo "$UNEXPECTED" >&2
            exit 1
          fi

      - name: Commit verified R18N.0 diagnosis integration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            package.json \
            tools/action-studio/shield-parry-r281/active-parry-intercept-diagnosis.js \
            tools/action-studio/shield-parry-r281/debug-api.js \
            tests/shield-parry-r281-active-parry-intercept-diagnosis.test.js \
            .github/workflows/r18n0-active-parry-intercept-diagnosis.yml \
            tools/action-studio/r18n0-active-parry-diagnosis-migration.mjs \
            tools/action-studio/r18n0-active-parry-browser-probe.mjs
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'R18N.0 diagnose active Parry intercept'
          git push origin HEAD:diagnostic/r18n0-active-parry-intercept
