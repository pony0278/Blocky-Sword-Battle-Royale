name: R18N.3 v6.4.1 Hitch Geometry Bracketing Diagnosis

on:
  pull_request:
    branches:
      - feature/r18n3-v6-4-swept-contact-temporal-eligibility

permissions:
  contents: read

jobs:
  diagnose-hitch-geometry-bracketing:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/r18n3-v6-4-swept-contact-temporal-eligibility
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Apply production R18N candidate chain
        run: |
          node tools/action-studio/r18n1-stable-active-intercept-migration.mjs
          node tools/action-studio/r18n3-active-intercept-last-writer-migration.mjs
          node tools/action-studio/r18n3-fixed-target-arm-closure-migration.mjs
          node tools/action-studio/r18n3-active-window-boundary-migration.mjs
          node tools/action-studio/r18n3-swept-contact-temporal-eligibility-migration.mjs
      - name: Lock unchanged authority and tuning
        run: |
          node --check tools/action-studio/r18n3-v64-hitch-geometry-bracketing-probe.mjs
          grep -q "contactSeconds: 0.23" src/combat/longsword-directional-metadata.js
          grep -q "const ACTIVE_LEAD_SECONDS = Object.freeze({ top: 0.055, right: 0.04, left: 0.045 })" src/combat/longsword-directional-attack-runtime.js
          grep -q "const ACTIVE_TRAIL_SECONDS = Object.freeze({ top: 0.065, right: 0.05, left: 0.055 })" src/combat/longsword-directional-attack-runtime.js
          grep -q "jointBudgetScale: 0.35" tools/action-studio/shield-parry-r281/pre-contact-controller.js
          grep -q "iterations: 2" tools/action-studio/shield-parry-r281/pre-contact-controller.js
          grep -q "bounded-guidance-only-real-swept-contact-still-required" src/combat/active-parry-intercept-intent.js
          grep -q "const geometricContact = probeSweptSwordBucklerContact" tools/action-studio/shield-parry-r281/contact-handoff-controller.js
          grep -q "evaluateSweptContactTemporalEligibility" tools/action-studio/shield-parry-r281/contact-handoff-controller.js
      - name: Run control versus 55ms hitch geometry traces
        shell: bash
        run: |
          set -euo pipefail
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$BROWSER"
          python3 -m http.server 4175 > r18n3-v641-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" >/dev/null 2>&1 || true' EXIT
          sleep 2
          BROWSER="$BROWSER" \
            R18N3_V641_TTC='0.110' \
            R18N3_V641_HITCH_AT='0.235' \
            R18N3_V641_HITCH_MS='55' \
            R18N3_V641_TRIALS='4' \
            node tools/action-studio/r18n3-v64-hitch-geometry-bracketing-probe.mjs | tee r18n3-v641-probe.log
          grep -q '^R18N3_V641_PROBE_JSON=' r18n3-v641-probe.log
      - name: Summarize geometry bracketing evidence
        shell: bash
        run: |
          node <<'NODE' | tee r18n3-v641-summary.log
          const fs = require('fs');
          const line = fs.readFileSync('r18n3-v641-probe.log','utf8').split(/\r?\n/)
            .find(v => v.startsWith('R18N3_V641_PROBE_JSON='));
          if (!line) throw new Error('missing v6.4.1 probe JSON');
          const data = JSON.parse(line.slice('R18N3_V641_PROBE_JSON='.length));
          if (data.controls?.length !== 4 || data.hitches?.length !== 4) {
            throw new Error(`expected 4 control + 4 hitch trials, got ${data.controls?.length}/${data.hitches?.length}`);
          }
          for (const row of [...data.controls, ...data.hitches]) {
            if (!(Number(row.actualTtc) > 0)) throw new Error(`${row.variant} trial ${row.trial}: missing actual TTC`);
            if (!Array.isArray(row.frames) || row.frames.length < 2) throw new Error(`${row.variant} trial ${row.trial}: insufficient frame trace`);
            if (!Number.isFinite(Number(row.closestFrame?.combinedGapMeters))) {
              throw new Error(`${row.variant} trial ${row.trial}: missing closest-approach evidence`);
            }
          }
          for (const row of data.hitches) {
            if (!(Number(row.hitch?.actualMs) >= 45)) throw new Error(`hitch trial ${row.trial}: hitch was not meaningful`);
          }
          const print = (row) => {
            const c = row.closestFrame || {};
            console.log(
              `R18N3_V641_${row.variant.toUpperCase()}_${row.trial} ` +
              `confirmed=${row.confirmed ? 'YES' : 'NO'} geometric=${row.finalGeometricContact ? 'YES' : 'NO'} ` +
              `reason=${row.finalContactReason || 'none'} closestAtMs=${(Number(c.elapsedSeconds)*1000).toFixed(3)} ` +
              `gapMm=${(Number(c.combinedGapMeters)*1000).toFixed(3)} planeMm=${(Number(c.planeGapMeters)*1000).toFixed(3)} ` +
              `radialMm=${(Number(c.radialGapMeters)*1000).toFixed(3)} swordTravelMm=${(Number(row.maxSwordEndpointTravelMeters)*1000).toFixed(3)} ` +
              `shieldFrameMoveMm=${(Number(row.maxShieldTranslationMeters)*1000).toFixed(3)}`,
            );
          };
          data.controls.forEach(print);
          data.hitches.forEach(print);
          const minGap = (rows) => Math.min(...rows.map(r => Number(r.closestFrame?.combinedGapMeters)).filter(Number.isFinite));
          console.log(`R18N3_V641_TOTAL controlConfirmed=${data.controlConfirmed}/4 hitchConfirmed=${data.hitchConfirmed}/4 hitchGeometric=${data.hitchGeometric}/4`);
          console.log(`R18N3_V641_MIN_GAP_MM control=${(minGap(data.controls)*1000).toFixed(3)} hitch=${(minGap(data.hitches)*1000).toFixed(3)}`);
          console.log('R18N3_V641_GEOMETRY_DIAGNOSTIC=PASS');
          NODE
      - name: Diff hygiene
        run: git diff --check
      - name: Upload v6.4.1 diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r18n3-v641-hitch-geometry-bracketing
          path: |
            r18n3-v641-probe.log
            r18n3-v641-summary.log
            r18n3-v641-http.log
          retention-days: 3
