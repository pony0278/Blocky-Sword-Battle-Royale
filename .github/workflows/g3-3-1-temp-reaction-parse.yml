name: G3.3.1 Temporary Reaction Parse Probe

on:
  pull_request:
    branches:
      - agent/g3-3-1-skyrim-guard-reaction-adoption-review

permissions:
  contents: read

jobs:
  parse-and-visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract verified temporary reaction inputs
        shell: bash
        run: |
          mkdir -p .probe/reactions .probe/pynifly tools/action-studio/.g331 artifacts/g3-3-1
          cat .probe/chunks/reactions.b64.* | base64 -d > /tmp/g3-3-1-reactions.tar.gz
          ARCHIVE_SHA="$(sha256sum /tmp/g3-3-1-reactions.tar.gz | cut -d' ' -f1)"
          echo "archive sha256=$ARCHIVE_SHA"
          test "$ARCHIVE_SHA" = "08fa1638d3b3a1c9feeae90e3849d2b42c27df606d3eeadb73c856db5e7c61de"
          tar -xzf /tmp/g3-3-1-reactions.tar.gz -C .probe/reactions
          sha256sum .probe/reactions/*.hkx | tee artifacts/g3-3-1/input-sha256.txt
          grep -q '139f0e90d25bd9be5657fecdb5912adbe6bce453949518769ee02f7ed01cfa04' artifacts/g3-3-1/input-sha256.txt
          grep -q '78d4569e12a855264b4667667763381ad729796ae3d26ad8c42e8d7724e3583b' artifacts/g3-3-1/input-sha256.txt
          grep -q '37bc83926597a65e7660cae7367a3dd0b0f23d812137907a7548b3754bf90bfd' artifacts/g3-3-1/input-sha256.txt
          grep -q 'b5813d5877b2cf698913d3fbb228078d8e7384780db79957f133326f74c36168' artifacts/g3-3-1/input-sha256.txt

      - name: Fetch pinned PyNifly native Skyrim HKX reader
        run: |
          curl -fsSL https://raw.githubusercontent.com/BadDogSkyrim/PyNifly/2064a5cc6ec240f07a9df51ac5655541e756633c/io_scene_nifly/hkx/anim_fo4.py -o .probe/pynifly/anim_fo4.py
          curl -fsSL https://raw.githubusercontent.com/BadDogSkyrim/PyNifly/2064a5cc6ec240f07a9df51ac5655541e756633c/io_scene_nifly/hkx/anim_skyrim.py -o .probe/pynifly/anim_skyrim.py

      - name: Decode reactions against canonical 99-joint Skyrim hierarchy
        shell: bash
        run: |
          python3 - <<'PY'
          import json, pathlib, struct, sys
          sys.path.insert(0, '.probe/pynifly')
          from anim_skyrim import _parse_animation_hkx

          def glb_json(path):
              data = pathlib.Path(path).read_bytes()
              magic, version, total = struct.unpack_from('<III', data, 0)
              if magic != 0x46546c67: raise SystemExit('canonical source is not GLB')
              length, kind = struct.unpack_from('<II', data, 12)
              if kind != 0x4E4F534A: raise SystemExit('canonical GLB first chunk is not JSON')
              return json.loads(data[20:20+length].decode('utf-8').rstrip('\x00 '))

          doc = glb_json('assets/skyrim/guard/converted/shd_blockidle.source.glb')
          skin = max(doc.get('skins', []), key=lambda s: len(s.get('joints', [])))
          joint_names = [doc['nodes'][i].get('name','') for i in skin['joints']]
          if len(joint_names) != 99: raise SystemExit(f'expected 99 canonical joints, got {len(joint_names)}')
          if joint_names[0] != 'NPC Root [Root]': raise SystemExit(f'unexpected first joint: {joint_names[0]}')
          print('canonical joints', len(joint_names), joint_names[:8])

          ids = ['shd_blockhit','shd_blockbashintro','shd_blockbash','shd_blockbashpower']
          summary = {}
          def vecs(values, width): return [[float(x) for x in list(v)[:width]] for v in values]
          for ident in ids:
              anim = _parse_animation_hkx(pathlib.Path(f'.probe/reactions/{ident}.hkx').read_bytes())
              if anim is None or anim.num_tracks != 99 or len(anim.tracks) != 99:
                  raise SystemExit(f'{ident}: invalid 99-track decode')
              # These files omit explicit trackToBoneIndices; with 99 tracks matching the 99-joint canonical skeleton,
              # use the Havok animation track order as the skeleton joint order.
              if anim.track_to_bone_indices and anim.track_to_bone_indices != list(range(99)):
                  raise SystemExit(f'{ident}: non-identity binding needs explicit skeleton mapping')
              payload = {
                  'id':ident, 'duration':float(anim.duration), 'numFrames':int(anim.num_frames),
                  'numTracks':int(anim.num_tracks), 'frameDuration':float(anim.frame_duration),
                  'jointNames':joint_names,
                  'annotations':[{'time':float(a.time),'text':str(a.text)} for a in anim.annotations if str(a.text)],
                  'tracks':[{
                      'translations':vecs(t.translations,3),
                      'rotations':vecs(t.rotations,4),
                      'scales':vecs(t.scales,3),
                  } for t in anim.tracks],
              }
              pathlib.Path(f'tools/action-studio/.g331/{ident}.json').write_text(json.dumps(payload,separators=(',',':')),encoding='utf-8')
              summary[ident] = {k:payload[k] for k in ['duration','numFrames','numTracks','annotations']}
          pathlib.Path('artifacts/g3-3-1/decode-summary.json').write_text(json.dumps(summary,indent=2),encoding='utf-8')
          PY

      - name: Locate headless browser
        id: browser
        shell: bash
        run: |
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$BROWSER"
          echo "browser=$BROWSER" >> "$GITHUB_OUTPUT"
          "$BROWSER" --version

      - name: Verify production Blockman retarget and capture reaction frames
        shell: bash
        env:
          BROWSER: ${{ steps.browser.outputs.browser }}
        run: |
          python3 -m http.server 4173 > /tmp/g331-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          BASE='http://127.0.0.1:4173/tools/action-studio/g331-reaction-visual-lab.html'
          "$BROWSER" --headless --no-sandbox --disable-gpu --enable-unsafe-swiftshader --hide-scrollbars \
            --window-size=1500,1000 --virtual-time-budget=30000 --dump-dom \
            "${BASE}?clip=shd_blockhit&progress=0.5&view=three" > artifacts/g3-3-1/g331-dom.html
          if ! grep -q 'data-g331="pass"' artifacts/g3-3-1/g331-dom.html; then
            echo 'G3.3.1 production retarget engineering gate failed.' >&2
            sed -n '/<pre id="report"/,/<\/pre>/p' artifacts/g3-3-1/g331-dom.html || true
            exit 1
          fi
          grep -q 'data-g331-count="4"' artifacts/g3-3-1/g331-dom.html

          for id in shd_blockhit shd_blockbashintro shd_blockbash shd_blockbashpower; do
            for pct in 0.25 0.50 0.75; do
              label="$(echo "$pct" | tr -d '.')"
              "$BROWSER" --headless --no-sandbox --disable-gpu --enable-unsafe-swiftshader --hide-scrollbars \
                --window-size=1500,1000 --virtual-time-budget=22000 \
                --screenshot="artifacts/g3-3-1/${id}-p${label}-three.png" \
                "${BASE}?clip=${id}&progress=${pct}&view=three"
            done
            "$BROWSER" --headless --no-sandbox --disable-gpu --enable-unsafe-swiftshader --hide-scrollbars \
              --window-size=1500,1000 --virtual-time-budget=22000 \
              --screenshot="artifacts/g3-3-1/${id}-p50-side.png" \
              "${BASE}?clip=${id}&progress=0.5&view=side"
          done

      - name: Upload G3.3.1 visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g3-3-1-reaction-visual-probe
          path: artifacts/g3-3-1
