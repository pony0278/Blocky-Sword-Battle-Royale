name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build Action Studio
        run: npm run build:action-studio

      - name: Verify standalone Action Studio files are current
        shell: bash
        run: |
          if ! git diff --exit-code -- tools/action-studio/action-studio.bundle.js tools/action-studio/index.html; then
            echo 'Generated standalone Action Studio files are stale.' >&2
            echo 'Run npm run build:action-studio and commit tools/action-studio/action-studio.bundle.js + index.html.' >&2
            exit 1
          fi

      - name: Verify Action Studio Guard Runtime browser surface
        shell: bash
        run: bash tools/action-studio/verify-guard-runtime-surface.sh

      - name: Probe Counter recovery right-hand trajectory
        shell: bash
        run: |
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$BROWSER"
          python3 -m http.server 4173 > /tmp/counter-hand-probe-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          "$BROWSER" --headless --no-sandbox --disable-gpu --enable-unsafe-swiftshader --hide-scrollbars \
            --window-size=1200,900 --virtual-time-budget=30000 --dump-dom \
            'http://127.0.0.1:4173/tools/action-studio/counter-recovery-hand-glitch-probe.html' \
            > /tmp/counter-hand-probe-dom.html
          grep -q 'data-counter-hand-probe="pass"' /tmp/counter-hand-probe-dom.html
          sed -n '/<pre id="report"/,/<\/pre>/p' /tmp/counter-hand-probe-dom.html

      - name: Run tests
        run: npm test
