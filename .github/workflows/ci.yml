name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build Action Studio
        run: npm run build:action-studio

      - name: Commit generated Action Studio files for G3.5
        if: github.event_name == 'pull_request' && github.head_ref == 'agent/g3-5-parry-counter-semantic-remap'
        shell: bash
        run: |
          if ! git diff --quiet -- tools/action-studio/action-studio.bundle.js tools/action-studio/index.html; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add tools/action-studio/action-studio.bundle.js tools/action-studio/index.html
            git commit -m 'G3.5 refresh Action Studio bundle'
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Verify standalone Action Studio files are current
        shell: bash
        run: |
          if ! git diff --exit-code -- tools/action-studio/action-studio.bundle.js tools/action-studio/index.html; then
            echo 'Generated standalone Action Studio files are stale.' >&2
            echo 'Run npm run build:action-studio and commit tools/action-studio/action-studio.bundle.js + index.html.' >&2
            exit 1
          fi

      - name: Verify Action Studio Guard Runtime browser surface
        shell: bash
        run: bash tools/action-studio/verify-guard-runtime-surface.sh

      - name: Run tests
        run: npm test
