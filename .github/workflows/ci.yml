name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  finalize-action-studio:
    if: github.event_name == 'pull_request' && github.actor != 'github-actions[bot]'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Finalize G3.6.3 review surfaces
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'missing expected text in {path}: {old[:100]!r}')
              p.write_text(text.replace(old, new))

          replace(
              'tools/action-studio/guard-counter-runtime-lab.js',
              "import { loadSkyrimConvertedAnimationLibrary } from '../../src/animation/skyrim-converted-animation-library.js';",
              "import { loadSkyrimConvertedAnimationLibrary } from '../../src/animation/skyrim-converted-animation-library.js';\nimport { PRODUCTION_PARRY_DEFLECT_CLIP_IDS } from '../../src/animation/parry-contact-deflect-runtime-clip.js';",
          )
          replace(
              'tools/action-studio/guard-counter-runtime-lab.js',
              "const G36_SKYRIM_LIBRARY_CLIPS=[\n  'SKYRIM_GUARD/shd_blockidle',\n  'SKYRIM_GUARD/shd_blockhit',\n  'SKYRIM_GUARD/shd_blockbash',\n  'SKYRIM_GUARD/shd_blockbashpower',\n  'SKYRIM_GUARD/power_parry_g36',\n  'SKYRIM_GUARD/perfect_power_parry_g36',\n];",
              "const PRODUCTION_SKYRIM_LIBRARY_CLIPS=[\n  'SKYRIM_GUARD/shd_blockidle',\n  'SKYRIM_GUARD/shd_blockhit',\n  'SKYRIM_GUARD/shd_blockbash',\n  'SKYRIM_GUARD/shd_blockbashpower',\n  PRODUCTION_PARRY_DEFLECT_CLIP_IDS.PARRY,\n  PRODUCTION_PARRY_DEFLECT_CLIP_IDS.PERFECT_PARRY,\n];",
          )
          replace(
              'tools/action-studio/guard-counter-runtime-lab.js',
              'skyrimGuardFamilyLoaded:G36_SKYRIM_LIBRARY_CLIPS.every(id=>skyrim.clips.has(id))',
              'skyrimGuardFamilyLoaded:PRODUCTION_SKYRIM_LIBRARY_CLIPS.every(id=>skyrim.clips.has(id))',
          )

          replace(
              'tools/action-studio/power-bash-readability-lab.js',
              '  POWER_BASH_RECOVERY_PROBE_STAGE,\n',
              '  POWER_BASH_RECOVERY_PROBE_STAGE,\n  POWER_BASH_PRODUCTION_PROMOTION_STAGE,\n',
          )
          replace(
              'tools/action-studio/power-bash-readability-lab.js',
              '    productionUnchanged: contract.productionUnchanged === true,',
              '    productionPromoted: contract.productionPromoted === true && contract.productionCandidateId === POWER_BASH_READABILITY_CANDIDATE_IDS.EXTENDED_FULL_RECOVERY,\n    historicalBaselinePreserved: contract.historicalBaselinePreserved === true,',
          )
          replace(
              'tools/action-studio/power-bash-readability-lab.js',
              "    productionChanged: false,",
              "    productionChanged: true,\n    productionPromotionStage: POWER_BASH_PRODUCTION_PROMOTION_STAGE,",
          )
          replace(
              'tools/action-studio/power-bash-readability-lab.js',
              "    decision: 'PROBE_ONLY — compare C vs D. D must preserve C power exactly, then use the authored source tail through clip end for natural recovery.',",
              "    decision: 'PROMOTED — D is the G3.6.3 production Power Parry motion. A/B/C remain historical readability references.',",
          )
          replace(
              'tools/action-studio/power-bash-readability-lab.js',
              "  document.documentElement.dataset.g361ProductionUnchanged = gates.productionUnchanged ? 'pass' : 'fail';",
              "  document.documentElement.dataset.g361ProductionUnchanged = 'historical';\n  document.documentElement.dataset.g363ProductionPromoted = gates.productionPromoted && gates.historicalBaselinePreserved ? 'pass' : 'fail';",
          )
          replace(
              'tools/action-studio/power-bash-readability-lab.js',
              "  window.__G362_D_RECOVERY_RESULT__ = report;",
              "  window.__G362_D_RECOVERY_RESULT__ = report;\n  window.__G363_D_PRODUCTION_RESULT__ = report;",
          )
          replace(
              'tools/action-studio/power-bash-readability-lab.js',
              "  status.textContent = `${POWER_BASH_RECOVERY_PROBE_STAGE} ${report.pass ? 'READY' : 'FAIL'} · D ${recovered.metrics.visualDurationMilliseconds.toFixed(0)}ms / ~${recovered.metrics.approximateFrames30.toFixed(1)}f @30 · production remains G3.6`;",
              "  status.textContent = `${POWER_BASH_PRODUCTION_PROMOTION_STAGE} ${report.pass ? 'READY' : 'FAIL'} · D ${recovered.metrics.visualDurationMilliseconds.toFixed(0)}ms / ~${recovered.metrics.approximateFrames30.toFixed(1)}f @30 · D is production`;",
          )
          replace(
              'tools/action-studio/power-bash-readability-lab.js',
              "  document.documentElement.dataset.g362Recovery = 'fail';",
              "  document.documentElement.dataset.g362Recovery = 'fail';\n  document.documentElement.dataset.g363ProductionPromoted = 'fail';",
          )
          replace(
              'tools/action-studio/power-bash-readability-lab.js',
              "  window.__G362_D_RECOVERY_RESULT__ = failure;",
              "  window.__G362_D_RECOVERY_RESULT__ = failure;\n  window.__G363_D_PRODUCTION_RESULT__ = failure;",
          )

          replace('tools/action-studio/power-bash-readability-lab.html', '<title>G3.6.2 Extended Power Bash + Full Recovery Probe</title>', '<title>G3.6.3 D Production Power Parry Review</title>')
          replace('tools/action-studio/power-bash-readability-lab.html', 'G3.6.2 · EXTENDED POWER BASH + AUTHORED RECOVERY TAIL', 'G3.6.3 · D PROMOTED TO PRODUCTION POWER PARRY')
          replace('tools/action-studio/power-bash-readability-lab.html', "This remains a probe and does not change production Parry timing.", "D is now the production Parry / Perfect Parry body motion; A/B/C remain historical comparison references.")
          replace('tools/action-studio/power-bash-readability-lab.html', 'B · Current G3.6', 'B · Former G3.6')
          replace('tools/action-studio/power-bash-readability-lab.html', '<b>B — Current G3.6</b><small>production source trim · Power segment only</small>', '<b>B — Former G3.6</b><small>historical short production trim · Power segment only</small>')
          replace('tools/action-studio/power-bash-readability-lab.html', '<b>D — Extended + Full Recovery</b><small>C Power 0.95× → authored recovery tail 1.00×</small>', '<b>D — Production G3.6.3</b><small>approved C Power 0.95× → authored recovery tail 1.00×</small>')
          replace('tools/action-studio/power-bash-readability-lab.html', '<b>What D is testing</b>', '<b>Why D was promoted</b>')
          replace('tools/action-studio/power-bash-readability-lab.html', "The acceptance question is simple: does D preserve C's force while recovering as naturally as A?", "D passed that acceptance: it preserves C's force and restores A-like authored recovery, so G3.6.3 promotes it to production.")
          replace('tools/action-studio/power-bash-readability-lab.html', 'G3.6.2 remains probe-only.', 'G3.6.3 production review; A/B/C are retained as history.')

          replace('tools/action-studio/index.template.html', 'G3.6.1 · Open Power Bash A/B/C Readability →', 'G3.6.3 · D Production + A/B/C History →')
          PY

      - name: Build Action Studio
        run: npm run build:action-studio

      - name: Commit finalized files when stale
        shell: bash
        run: |
          if git diff --quiet -- tools/action-studio; then
            echo 'G3.6.3 review surfaces already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            tools/action-studio/guard-counter-runtime-lab.js \
            tools/action-studio/power-bash-readability-lab.js \
            tools/action-studio/power-bash-readability-lab.html \
            tools/action-studio/index.template.html \
            tools/action-studio/action-studio.bundle.js \
            tools/action-studio/index.html
          git commit -m 'Finalize G3.6.3 production review surfaces'
          git push origin HEAD:${{ github.head_ref }}

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build Action Studio
        run: npm run build:action-studio

      - name: Verify standalone Action Studio files are current
        shell: bash
        run: |
          if ! git diff --exit-code -- tools/action-studio/action-studio.bundle.js tools/action-studio/index.html; then
            echo 'Generated standalone Action Studio files are stale.' >&2
            echo 'Run npm run build:action-studio and commit tools/action-studio/action-studio.bundle.js + index.html.' >&2
            exit 1
          fi

      - name: Verify Action Studio Guard Runtime browser surface
        shell: bash
        run: bash tools/action-studio/verify-guard-runtime-surface.sh

      - name: Run tests
        run: npm test
