name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head for temporary standalone regeneration
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build Action Studio
        run: npm run build:action-studio

      - name: Commit regenerated standalone Action Studio
        shell: bash
        run: |
          if git diff --quiet -- tools/action-studio/action-studio.bundle.js tools/action-studio/index.html; then
            echo 'Standalone Action Studio already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/action-studio/action-studio.bundle.js tools/action-studio/index.html
          git commit -m 'G3.5.1P-T3 rebuild standalone after Guard surface update'
          git push origin HEAD:${{ github.head_ref }}

      - name: Verify standalone Action Studio files are current
        shell: bash
        run: git diff --exit-code -- tools/action-studio/action-studio.bundle.js tools/action-studio/index.html

      - name: Verify Action Studio Guard Runtime browser surface
        shell: bash
        run: bash tools/action-studio/verify-guard-runtime-surface.sh

      - name: Run tests
        run: npm test
