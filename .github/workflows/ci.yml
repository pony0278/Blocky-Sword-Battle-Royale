name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build Action Studio
        run: npm run build:action-studio

      - name: Run tests with captured log
        shell: bash
        run: |
          set +e
          npm test 2>&1 | tee g252-test.log
          test_exit=${PIPESTATUS[0]}
          echo "G252_TEST_EXIT=${test_exit}" >> "$GITHUB_ENV"
          exit 0

      - name: Upload G2.5.2 test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g252-ci-test-log
          path: g252-test.log

      - name: Fail on test errors
        shell: bash
        run: |
          if [ "${G252_TEST_EXIT}" != "0" ]; then
            echo "npm test failed with exit code ${G252_TEST_EXIT}; see g252-ci-test-log artifact."
            exit "${G252_TEST_EXIT}"
          fi

      - name: Sync generated standalone Action Studio files
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          if git diff --quiet -- tools/action-studio/action-studio.bundle.js tools/action-studio/index.html; then
            echo 'Standalone Action Studio files are already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/action-studio/action-studio.bundle.js tools/action-studio/index.html
          git commit -m 'build: sync G2.5.2 Action Studio standalone runtime'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
