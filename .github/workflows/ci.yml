name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Apply static Guard Runtime patch
        run: python3 build/tmp_static_guard_runtime_patch.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build Action Studio
        run: npm run build:action-studio

      - name: Run tests
        run: npm test

      - name: Verify Action Studio Guard Runtime browser surface
        shell: bash
        run: bash tools/action-studio/verify-guard-runtime-surface.sh

      - name: Commit static Guard Runtime source and generated files
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/action-studio/index.template.html \
                  tools/action-studio/index.html \
                  tools/action-studio/studio-guard-runtime-controller.js \
                  tools/action-studio/action-studio.bundle.js \
                  tests/action-studio-contract.test.js
          if git diff --cached --quiet; then
            echo 'Static Guard Runtime source and generated files are already current.'
            exit 0
          fi
          git commit -m 'Author Guard Runtime statically in Action Studio'
          git push origin HEAD:${{ github.head_ref }}
