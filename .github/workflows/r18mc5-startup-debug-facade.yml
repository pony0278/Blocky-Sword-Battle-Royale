name: R18M.C5 Startup Debug Facade Extraction

on:
  pull_request:
    branches:
      - refactor/r18m-c5-startup-debug-facade

permissions:
  contents: write

jobs:
  migrate-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout C5 branch
        uses: actions/checkout@v4
        with:
          ref: refactor/r18m-c5-startup-debug-facade
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Capture fresh C4 failure-title baseline
        shell: bash
        run: |
          set +e
          npm test > c5-baseline.log 2>&1
          BASELINE_EXIT=$?
          set -e
          node <<'NODE'
          const fs = require('fs');
          const text = fs.readFileSync('c5-baseline.log', 'utf8');
          const titles = [...text.matchAll(/^\s*not ok \d+ - (.+)$/gm)].map((m) => m[1].trim()).sort();
          fs.writeFileSync('c5-baseline.failures', `${titles.join('\n')}${titles.length ? '\n' : ''}`);
          console.log(`C5 baseline failure titles: ${titles.length}`);
          for (const title of titles) console.log(`BASELINE FAIL: ${title}`);
          NODE
          echo "Baseline npm test exit: ${BASELINE_EXIT}"

      - name: Apply guarded C5 extraction
        run: node tools/action-studio/r18mc5-startup-debug-facade-migration.mjs

      - name: Normalize C5 candidate files
        shell: bash
        run: |
          for f in \
            tools/action-studio/shield-driven-contact-coupling-lab-r281.js \
            tools/action-studio/shield-parry-r281/lab-bootstrap.js \
            tools/action-studio/shield-parry-r281/debug-api.js \
            tests/shield-parry-r281-startup-debug-facade.test.js; do
            sed -i 's/[[:space:]]\+$//' "$f"
          done

      - name: Syntax and C5 direct contracts
        run: |
          node --check tools/action-studio/shield-parry-r281/lab-bootstrap.js
          node --check tools/action-studio/shield-parry-r281/debug-api.js
          node --check tools/action-studio/shield-driven-contact-coupling-lab-r281.js
          node --check tests/shield-parry-r281-startup-debug-facade.test.js
          node --test tests/shield-parry-r281-startup-debug-facade.test.js

      - name: R18M focused regression contracts
        run: |
          node --test \
            tests/shield-driven-contact-coupling-r281-regression.test.js \
            tests/shield-parry-r281-diagnostics.test.js \
            tests/shield-parry-r281-ui.test.js \
            tests/shield-parry-r281-ui-runtime.test.js \
            tests/shield-parry-r281-exchange-state.test.js \
            tests/shield-parry-r281-pre-contact-controller.test.js \
            tests/shield-parry-r281-contact-handoff-controller.test.js \
            tests/shield-parry-r281-composition-scene.test.js \
            tests/shield-parry-r281-attacker-presentation.test.js \
            tests/shield-parry-r281-verification-report.test.js \
            tests/shield-parry-r281-direct-old-b3-diagnostic.test.js \
            tests/shield-parry-r281-startup-debug-facade.test.js \
            tests/old-two-actor-b3-direct-diagnostic.test.js

      - name: Build Action Studio
        run: npm run build:action-studio

      - name: Verify standalone Action Studio files stay current
        shell: bash
        run: git diff --exit-code -- tools/action-studio/action-studio.bundle.js tools/action-studio/index.html

      - name: Verify Guard Runtime browser surface
        shell: bash
        run: bash tools/action-studio/verify-guard-runtime-surface.sh

      - name: Compare candidate failure titles with exact fresh baseline
        shell: bash
        run: |
          set +e
          npm test > c5-candidate.log 2>&1
          CANDIDATE_EXIT=$?
          set -e
          node <<'NODE'
          const fs = require('fs');
          const text = fs.readFileSync('c5-candidate.log', 'utf8');
          const titles = [...text.matchAll(/^\s*not ok \d+ - (.+)$/gm)].map((m) => m[1].trim()).sort();
          fs.writeFileSync('c5-candidate.failures', `${titles.join('\n')}${titles.length ? '\n' : ''}`);
          console.log(`C5 candidate failure titles: ${titles.length}`);
          for (const title of titles) console.log(`CANDIDATE FAIL: ${title}`);
          NODE
          echo "Candidate npm test exit: ${CANDIDATE_EXIT}"
          diff -u c5-baseline.failures c5-candidate.failures

      - name: Diff hygiene and allowed-path guard
        shell: bash
        run: |
          git diff --check
          rm -f c5-baseline.log c5-candidate.log c5-baseline.failures c5-candidate.failures package-lock.json
          rm -f .github/workflows/r18mc5-startup-debug-facade.yml
          rm -f tools/action-studio/r18mc5-startup-debug-facade-migration.mjs
          ALLOWED='^( M|M |A | A|D | D|\?\?) (package\.json|tools/action-studio/shield-driven-contact-coupling-lab-r281\.js|tools/action-studio/shield-parry-r281/lab-bootstrap\.js|tools/action-studio/shield-parry-r281/debug-api\.js|tests/shield-parry-r281-startup-debug-facade\.test\.js|\.github/workflows/r18mc5-startup-debug-facade\.yml|tools/action-studio/r18mc5-startup-debug-facade-migration\.mjs)$'
          git status --short
          UNEXPECTED=$(git status --short | grep -Ev "$ALLOWED" || true)
          if [ -n "$UNEXPECTED" ]; then
            echo 'Unexpected C5 working-tree changes:' >&2
            echo "$UNEXPECTED" >&2
            exit 1
          fi

      - name: Commit verified C5 migration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            package.json \
            tools/action-studio/shield-driven-contact-coupling-lab-r281.js \
            tools/action-studio/shield-parry-r281/lab-bootstrap.js \
            tools/action-studio/shield-parry-r281/debug-api.js \
            tests/shield-parry-r281-startup-debug-facade.test.js \
            .github/workflows/r18mc5-startup-debug-facade.yml \
            tools/action-studio/r18mc5-startup-debug-facade-migration.mjs
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'R18M.C5 extract startup and debug facade'
          git push origin HEAD:refactor/r18m-c5-startup-debug-facade
