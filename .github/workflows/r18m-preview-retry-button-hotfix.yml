name: R18M Preview Retry Button Hotfix

on:
  pull_request:
    branches:
      - hotfix/r18m-preview-retry-button
    paths:
      - .r18m-preview-hotfix-trigger

concurrency:
  group: r18m-preview-retry-button-hotfix
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  verify-and-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@v4
        with:
          ref: hotfix/r18m-preview-retry-button
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Capture exact C2 full-suite failure baseline
        shell: bash
        run: |
          set +e
          npm test > hotfix-baseline.log 2>&1
          BASELINE_EXIT=$?
          set -e
          node <<'NODE'
          const fs = require('fs');
          const text = fs.readFileSync('hotfix-baseline.log', 'utf8');
          const titles = [...text.matchAll(/^\s*not ok \d+ - (.+)$/gm)].map((m) => m[1].trim()).sort();
          fs.writeFileSync('hotfix-baseline.failures', `${titles.join('\n')}${titles.length ? '\n' : ''}`);
          console.log(`Hotfix baseline failure titles: ${titles.length}`);
          for (const title of titles) console.log(`BASELINE FAIL: ${title}`);
          NODE
          echo "Baseline npm test exit: ${BASELINE_EXIT}"

      - name: Prove preview runtime test reproduces ReferenceError before fix
        shell: bash
        run: |
          set +e
          node --test tests/shield-parry-r281-ui-runtime.test.js > hotfix-repro.log 2>&1
          REPRO_EXIT=$?
          set -e
          cat hotfix-repro.log
          if [ "$REPRO_EXIT" -eq 0 ]; then
            echo 'Expected the new runtime test to reproduce the pre-fix bug.' >&2
            exit 1
          fi
          grep -q 'retryAttackButton' hotfix-repro.log

      - name: Apply minimal retry button wiring fix
        shell: bash
        run: |
          BEFORE=$(grep -o 'retryAttackButton' tools/action-studio/shield-parry-r281/lab-ui.js | wc -l)
          test "$BEFORE" -eq 1
          sed -i 's/retryAttackButton/retryAttack/' tools/action-studio/shield-parry-r281/lab-ui.js
          test "$(grep -o 'retryAttackButton' tools/action-studio/shield-parry-r281/lab-ui.js | wc -l)" -eq 0
          test "$(grep -o "retryAttack.classList.toggle('retry-attention'" tools/action-studio/shield-parry-r281/lab-ui.js | wc -l)" -eq 1
          node <<'NODE'
          const fs = require('fs');
          const path = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
          const anchor = 'tests/shield-parry-r281-ui.test.js';
          const token = 'tests/shield-parry-r281-ui-runtime.test.js';
          if (!pkg.scripts.test.includes(token)) {
            const count = pkg.scripts.test.split(anchor).length - 1;
            if (count !== 1) throw new Error(`expected exactly one UI test anchor, got ${count}`);
            pkg.scripts.test = pkg.scripts.test.replace(anchor, `${anchor} ${token}`);
          }
          fs.writeFileSync(path, `${JSON.stringify(pkg, null, 2)}\n`);
          NODE

      - name: Syntax and runtime UI contract
        run: |
          node --check tools/action-studio/shield-parry-r281/lab-ui.js
          node --check tests/shield-parry-r281-ui-runtime.test.js
          node --test tests/shield-parry-r281-ui-runtime.test.js

      - name: R18M focused regression contracts
        run: |
          node --test \
            tests/shield-driven-contact-coupling-r281-regression.test.js \
            tests/shield-parry-r281-diagnostics.test.js \
            tests/shield-parry-r281-ui.test.js \
            tests/shield-parry-r281-ui-runtime.test.js \
            tests/shield-parry-r281-exchange-state.test.js \
            tests/shield-parry-r281-pre-contact-controller.test.js \
            tests/shield-parry-r281-contact-handoff-controller.test.js \
            tests/shield-parry-r281-composition-scene.test.js \
            tests/shield-parry-r281-attacker-presentation.test.js

      - name: Build Action Studio
        run: npm run build:action-studio

      - name: Verify standalone Action Studio files stay current
        shell: bash
        run: git diff --exit-code -- tools/action-studio/action-studio.bundle.js tools/action-studio/index.html

      - name: Verify Guard Runtime browser surface
        shell: bash
        run: bash tools/action-studio/verify-guard-runtime-surface.sh

      - name: Compare candidate failure titles with exact baseline
        shell: bash
        run: |
          set +e
          npm test > hotfix-candidate.log 2>&1
          CANDIDATE_EXIT=$?
          set -e
          node <<'NODE'
          const fs = require('fs');
          const text = fs.readFileSync('hotfix-candidate.log', 'utf8');
          const titles = [...text.matchAll(/^\s*not ok \d+ - (.+)$/gm)].map((m) => m[1].trim()).sort();
          fs.writeFileSync('hotfix-candidate.failures', `${titles.join('\n')}${titles.length ? '\n' : ''}`);
          console.log(`Hotfix candidate failure titles: ${titles.length}`);
          for (const title of titles) console.log(`CANDIDATE FAIL: ${title}`);
          NODE
          echo "Candidate npm test exit: ${CANDIDATE_EXIT}"
          diff -u hotfix-baseline.failures hotfix-candidate.failures

      - name: Diff hygiene and allowed-path guard
        shell: bash
        run: |
          git diff --check
          rm -f hotfix-baseline.log hotfix-candidate.log hotfix-baseline.failures hotfix-candidate.failures hotfix-repro.log package-lock.json
          rm -f .github/workflows/r18m-preview-retry-button-hotfix.yml
          ALLOWED='^( M|M |A | A|D | D|\?\?) (package\.json|tools/action-studio/shield-parry-r281/lab-ui\.js|tests/shield-parry-r281-ui-runtime\.test\.js|\.github/workflows/r18m-preview-retry-button-hotfix\.yml)$'
          git status --short
          UNEXPECTED=$(git status --short | grep -Ev "$ALLOWED" || true)
          if [ -n "$UNEXPECTED" ]; then
            echo 'Unexpected hotfix working-tree changes:' >&2
            echo "$UNEXPECTED" >&2
            exit 1
          fi

      - name: Commit verified preview hotfix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            package.json \
            tools/action-studio/shield-parry-r281/lab-ui.js \
            tests/shield-parry-r281-ui-runtime.test.js \
            .github/workflows/r18m-preview-retry-button-hotfix.yml
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'fix: wire R18M preview retry button correctly'
          git push origin HEAD:hotfix/r18m-preview-retry-button
