name: R18N.4.3-A Shield Arm Delta Validation

on:
  push:
    branches:
      - feature/r18n4-3a-shield-arm-delta-extraction

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/r18n4-3a-shield-arm-delta-extraction
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Run R18N.4.3-A focused regression
        run: node --test tests/predictive-parry-arm-delta.test.js tests/predictive-intercept-parry.test.js tests/shield-parry-r281-active-intercept-runtime.test.js

      - name: Run full regression suite
        run: npm test

      - name: Build Action Studio
        run: npm run build:action-studio

      - name: Verify generated Action Studio files remain current
        run: git diff --exit-code -- tools/action-studio/action-studio.js tools/action-studio/action-studio.html

      - name: Verify Guard Runtime browser surface
        run: bash tools/action-studio/verify-guard-runtime-surface.sh

      - name: Verify R18N.4.3-A scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only 74221454d6403356594f8964133a3cd6e87b9a2c...HEAD | sort > /tmp/changed.txt
          cat /tmp/changed.txt
          while IFS= read -r path; do
            case "$path" in
              .github/workflows/r18n4-3a-shield-arm-delta-validation.yml|package.json|src/combat/predictive-intercept-parry.js|src/combat/predictive-parry-arm-delta.js|tests/predictive-parry-arm-delta.test.js) ;;
              *) echo "Unexpected R18N.4.3-A change: $path" >&2; exit 1 ;;
            esac
          done < /tmp/changed.txt

      - name: Remove one-shot validation workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/r18n4-3a-shield-arm-delta-validation.yml
          git commit -m "R18N.4.3-A remove one-shot validation gate"
          git push origin HEAD:feature/r18n4-3a-shield-arm-delta-extraction
