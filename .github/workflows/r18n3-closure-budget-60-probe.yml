name: R18N.3 Closure 60 Percent Probe

on:
  pull_request:
    branches:
      - feature/r18n3-active-intercept-last-writer-pose-authority

permissions:
  contents: read

jobs:
  probe-60:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout R18N.3 base
        uses: actions/checkout@v4
        with:
          ref: feature/r18n3-active-intercept-last-writer-pose-authority

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Apply candidate and 60 percent closure probe
        run: |
          node tools/action-studio/r18n1-stable-active-intercept-migration.mjs
          node tools/action-studio/r18n3-active-intercept-last-writer-migration.mjs
          node tools/action-studio/r18n3-fixed-target-arm-closure-migration.mjs
          node tools/action-studio/r18n3-closure-budget-60-migration.mjs
          node tools/action-studio/r18n3-closure-probe-telemetry-migration.mjs

      - name: Preserve production maxima and focused runtime safety
        run: |
          grep -q "maxTrackingSpeedMps: 1.6" src/combat/guard-threat-tracking.js
          grep -q "upperArmMaxDegrees: 14" src/combat/guard-threat-tracking.js
          grep -q "lowerArmMaxDegrees: 18" src/combat/guard-threat-tracking.js
          grep -q "jointBudgetScale: 0.60" tools/action-studio/shield-parry-r281/pre-contact-controller.js
          grep -q "iterations: 3" tools/action-studio/shield-parry-r281/pre-contact-controller.js
          node --test \
            tests/guard-threat-tracking.test.js \
            tests/active-parry-intercept-intent.test.js \
            tests/shield-parry-r281-pre-contact-controller.test.js

      - name: Run TOP and RIGHT 60 percent closure probe
        shell: bash
        run: |
          set -euo pipefail
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$BROWSER"
          python3 -m http.server 4175 > r18n3-60-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" >/dev/null 2>&1 || true' EXIT
          sleep 2
          BROWSER="$BROWSER" R18N3_PAGE_URL='http://127.0.0.1:4175/tools/action-studio/shield-driven-contact-coupling-lab.html' \
            node tools/action-studio/r18n3-active-intercept-browser-probe.mjs | tee r18n3-60-probe.log
          grep -q '^R18N3_PROBE_JSON=' r18n3-60-probe.log

      - name: Validate real contact and print 60 percent result
        shell: bash
        run: |
          node <<'NODE' | tee r18n3-60-summary.log
          const fs = require('fs');
          const line = fs.readFileSync('r18n3-60-probe.log', 'utf8').split(/\r?\n/)
            .find((value) => value.startsWith('R18N3_PROBE_JSON='));
          if (!line) throw new Error('missing R18N.3 60% probe JSON');
          const data = JSON.parse(line.slice('R18N3_PROBE_JSON='.length));
          for (const direction of ['top', 'right']) {
            const row = data[direction];
            if (row?.confirmation !== true || row?.whiff) throw new Error(`${direction} lost real swept contact`);
          }
          console.log(`R18N3_CLOSURE_60_RESULT=${JSON.stringify(data.summary)}`);
          console.log(JSON.stringify(data.summary, null, 2));
          NODE

      - name: Upload 60 percent probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r18n3-closure-budget-60-probe
          path: |
            r18n3-60-probe.log
            r18n3-60-summary.log
            r18n3-60-http.log
          retention-days: 3
