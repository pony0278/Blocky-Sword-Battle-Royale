name: TEMP Regenerate Action Studio T3.3 G3.5.2 Final

on:
  pull_request:
    paths:
      - '.github/workflows/temp-regenerate-action-studio-t3352-final.yml'
      - 'src/**'
      - 'tools/action-studio/**'

permissions:
  contents: write

jobs:
  regenerate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/t3-3-g3-5-2-guard-visual-stability
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build Action Studio standalone artifacts
        run: npm run build:action-studio
      - name: Commit regenerated artifacts when changed
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- tools/action-studio/action-studio.bundle.js tools/action-studio/index.html
          if git diff --cached --quiet; then
            echo 'Action Studio artifacts already current.'
            exit 0
          fi
          git commit -m 'Regenerate Action Studio for T3.3 and G3.5.2 final'
          git push origin HEAD:agent/t3-3-g3-5-2-guard-visual-stability
