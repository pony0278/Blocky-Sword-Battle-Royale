name: TEMP Regenerate Action Studio T3.2

on:
  push:
    branches:
      - agent/g3-5-1p-t3-2-parry-rotation-continuity-fix

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/g3-5-1p-t3-2-parry-rotation-continuity-fix
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build:action-studio
      - name: Commit generated standalone files
        shell: bash
        run: |
          if git diff --quiet -- tools/action-studio/action-studio.bundle.js tools/action-studio/index.html; then
            echo 'Generated Action Studio already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/action-studio/action-studio.bundle.js tools/action-studio/index.html
          git commit -m 'G3.5.1P-T3.2 rebuild Action Studio bundle'
          git push origin HEAD:agent/g3-5-1p-t3-2-parry-rotation-continuity-fix
