name: G3.6.1.1 Orbit Camera Finalize

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/action-studio/power-bash-readability-lab.*'
      - 'tests/power-bash-readability-probe.test.js'
      - '.github/workflows/g3611-orbit-camera-finalize.yml'

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/g3-6-1-1-orbit-camera-review-controls
          fetch-depth: 0

      - name: Add Orbit Camera Review Controls
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          html_path = Path('tools/action-studio/power-bash-readability-lab.html')
          html = html_path.read_text()
          loader = '<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>'
          orbit = '<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>'
          if orbit not in html:
              html = html.replace(loader, loader + '\n  ' + orbit)
          html = html.replace('.stage canvas{display:block;width:100%;height:100%}', '.stage canvas{display:block;width:100%;height:100%;cursor:grab}.stage canvas:active{cursor:grabbing}')
          html = html.replace(
              '<div class="legend">LEFT · A Full Source<br>CENTER · B Current G3.6<br>RIGHT · C Extended Candidate</div>',
              '<div class="legend">LEFT · A Full Source<br>CENTER · B Current G3.6<br>RIGHT · C Extended Candidate<br><br>CAMERA · Left drag orbit · Wheel zoom · Right drag pan</div>'
          )
          old = '''      <button id="reset">Reset</button>
      <button data-view="three">Three-quarter</button>
      <button data-view="front">Front</button>'''
          new = '''      <button id="reset">Reset Motion</button>
      <button id="resetCamera">Reset Camera</button>
      <button data-view="three">Three-quarter</button>
      <button data-view="front">Front</button>
      <button data-view="side">Side</button>
      <button data-view="back">Back</button>'''
          if old not in html:
              raise SystemExit('camera button anchor missing')
          html = html.replace(old, new)
          html = html.replace(
              '<div class="foot">Static CI screenshots can use ?progress=0.25, 0.50, 0.75. Add &view=front for the front camera.</div>',
              '<div class="foot">G3.6.1.1 camera: left-drag orbit · wheel zoom · right-drag pan. Presets: ?view=three|front|side|back. Static CI screenshots can use ?progress=0.25, 0.50, 0.75.</div>'
          )
          html_path.write_text(html)

          js_path = Path('tools/action-studio/power-bash-readability-lab.js')
          js = js_path.read_text()
          js = js.replace(
              "if (!THREE?.WebGLRenderer || !THREE?.GLTFLoader || !THREE?.Quaternion) {\n  throw new Error(`${POWER_BASH_READABILITY_STAGE} requires Three.js + GLTFLoader`);\n}",
              "if (!THREE?.WebGLRenderer || !THREE?.GLTFLoader || !THREE?.Quaternion || !THREE?.OrbitControls) {\n  throw new Error(`${POWER_BASH_READABILITY_STAGE} requires Three.js + GLTFLoader + OrbitControls`);\n}"
          )
          anchor = 'const camera = new THREE.PerspectiveCamera(38, 1, 0.05, 100);'
          block = '''const camera = new THREE.PerspectiveCamera(38, 1, 0.05, 100);
const CAMERA_TARGET = new THREE.Vector3(0, 1.0, 0);
const CAMERA_PRESETS = Object.freeze({
  three: Object.freeze([5.9, 2.25, 8.3]),
  front: Object.freeze([0, 1.55, 9.2]),
  side: Object.freeze([9.2, 1.55, 0]),
  back: Object.freeze([0, 1.55, -9.2]),
});
const orbitControls = new THREE.OrbitControls(camera, canvas);
orbitControls.target.copy(CAMERA_TARGET);
orbitControls.enableDamping = false;
orbitControls.enablePan = true;
orbitControls.enableZoom = true;
orbitControls.minDistance = 3.2;
orbitControls.maxDistance = 18;
orbitControls.minPolarAngle = 0.12;
orbitControls.maxPolarAngle = Math.PI - 0.12;
orbitControls.screenSpacePanning = true;
orbitControls.mouseButtons.LEFT = THREE.MOUSE.ROTATE;
orbitControls.mouseButtons.MIDDLE = THREE.MOUSE.DOLLY;
orbitControls.mouseButtons.RIGHT = THREE.MOUSE.PAN;
canvas.addEventListener('contextmenu', (event) => event.preventDefault());'''
          if anchor not in js:
              raise SystemExit('camera anchor missing')
          js = js.replace(anchor, block)
          js = js.replace("const resetButton = document.getElementById('reset');", "const resetButton = document.getElementById('reset');\nconst resetCameraButton = document.getElementById('resetCamera');")
          old_view = '''function setView(view) {
  if (view === 'front') camera.position.set(0, 1.55, 9.2);
  else camera.position.set(5.9, 2.25, 8.3);
  camera.lookAt(0, 1.0, 0);
  camera.updateMatrixWorld(true);
}'''
          new_view = '''function setView(view = 'three') {
  const resolvedView = Object.hasOwn(CAMERA_PRESETS, view) ? view : 'three';
  camera.position.fromArray(CAMERA_PRESETS[resolvedView]);
  orbitControls.target.copy(CAMERA_TARGET);
  orbitControls.update();
  camera.updateMatrixWorld(true);
  document.documentElement.dataset.g3611CameraView = resolvedView;
  return resolvedView;
}'''
          if old_view not in js:
              raise SystemExit('setView anchor missing')
          js = js.replace(old_view, new_view)
          reset = '''resetButton.addEventListener('click', () => {
  autoplay = false;
  playButton.textContent = '▶ Play real-time';
  applyStaticProgress(0);
});'''
          if reset not in js:
              raise SystemExit('reset anchor missing')
          js = js.replace(reset, reset + "\nresetCameraButton.addEventListener('click', () => setView('three'));")
          frame = '''  slots.forEach((slot) => slot.sword?.update());
  renderer.render(scene, camera);'''
          if frame not in js:
              raise SystemExit('frame anchor missing')
          js = js.replace(frame, '''  slots.forEach((slot) => slot.sword?.update());
  orbitControls.update();
  renderer.render(scene, camera);''')
          startup = '''setView(new URLSearchParams(location.search).get('view') || 'three');
resize();'''
          if startup not in js:
              raise SystemExit('startup anchor missing')
          js = js.replace(startup, '''setView(new URLSearchParams(location.search).get('view') || 'three');
document.documentElement.dataset.g3611Orbit = 'pass';
window.__G3611_ORBIT_CAMERA__ = Object.freeze({
  stage: 'G3.6.1.1',
  controls: orbitControls,
  setView,
  reset: () => setView('three'),
  getState: () => Object.freeze({
    position: camera.position.toArray(),
    target: orbitControls.target.toArray(),
    minDistance: orbitControls.minDistance,
    maxDistance: orbitControls.maxDistance,
  }),
});
resize();''')
          js_path.write_text(js)

          test_path = Path('tests/power-bash-readability-probe.test.js')
          test = test_path.read_text()
          if "node:fs/promises" not in test:
              test = test.replace("import assert from 'node:assert/strict';", "import assert from 'node:assert/strict';\nimport { readFile } from 'node:fs/promises';")
          marker = "test('G3.6.1.1 exposes Orbit Camera review controls"
          if marker not in test:
              test += '''

test('G3.6.1.1 exposes Orbit Camera review controls without changing the Power Bash probe contract', async () => {
  const html = await readFile(new URL('../tools/action-studio/power-bash-readability-lab.html', import.meta.url), 'utf8');
  const app = await readFile(new URL('../tools/action-studio/power-bash-readability-lab.js', import.meta.url), 'utf8');
  assert.match(html, /OrbitControls\\.js/);
  assert.match(html, /data-view="side"/);
  assert.match(html, /data-view="back"/);
  assert.match(html, /id="resetCamera"/);
  assert.match(app, /new THREE\\.OrbitControls\\(camera, canvas\\)/);
  assert.match(app, /CAMERA_TARGET/);
  assert.match(app, /G3\\.6\\.1\\.1/);
  assert.match(app, /__G3611_ORBIT_CAMERA__/);
  assert.match(app, /dataset\\.g3611Orbit/);
  assert.match(app, /THREE\\.MOUSE\\.ROTATE/);
  assert.match(app, /THREE\\.MOUSE\\.PAN/);
});
'''
          test_path.write_text(test)
          PY

      - name: Run focused contract test
        run: node --test tests/power-bash-readability-probe.test.js

      - name: Verify browser Orbit Camera surface
        shell: bash
        run: |
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$BROWSER"
          python3 -m http.server 4176 > /tmp/g3611-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          BASE='http://127.0.0.1:4176/tools/action-studio/power-bash-readability-lab.html'
          "$BROWSER" --headless --no-sandbox --disable-gpu --enable-unsafe-swiftshader --hide-scrollbars --window-size=1600,1100 --virtual-time-budget=30000 --dump-dom "${BASE}?progress=0.50&view=side" > /tmp/g3611-dom.html
          grep -q 'data-g361="pass"' /tmp/g3611-dom.html
          grep -q 'data-g3611-orbit="pass"' /tmp/g3611-dom.html
          grep -q 'data-g3611-camera-view="side"' /tmp/g3611-dom.html

      - name: Commit G3.6.1.1 implementation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- tools/action-studio/power-bash-readability-lab.html tools/action-studio/power-bash-readability-lab.js tests/power-bash-readability-probe.test.js
          git diff --cached --check
          git commit -m 'G3.6.1.1 — Orbit Camera Review Controls [g3611-orbit-finalized]'
          git push origin HEAD:agent/g3-6-1-1-orbit-camera-review-controls
