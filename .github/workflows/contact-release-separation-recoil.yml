name: G4.3B.5R.2.4 Contact Release Separation Recoil

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/combat/post-coupling-recoil-stagger-handoff.js'
      - 'src/combat/shield-driven-contact-coupling.js'
      - 'src/combat/attacker-recoil-presentation.js'
      - 'src/combat/directional-recoil-planner.js'
      - 'tests/post-coupling-recoil-stagger-handoff.test.js'
      - 'tests/attacker-recoil-presentation.test.js'
      - 'tests/directional-recoil-planner.test.js'
      - '.github/workflows/contact-release-separation-recoil.yml'
  push:
    branches:
      - 'g43b5r24-contact-release-separation-recoil'

permissions:
  contents: read

jobs:
  separation-recoil-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Run contact release separation recoil regressions
        run: >-
          node --test
          tests/post-coupling-recoil-stagger-handoff.test.js
          tests/attacker-recoil-presentation.test.js
          tests/directional-recoil-planner.test.js
