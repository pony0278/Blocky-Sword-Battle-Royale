name: G4.3B.5R.2.8 Legacy Two-Actor Recoil Passthrough

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/combat/post-coupling-recoil-stagger-handoff.js'
      - 'src/combat/two-actor-whole-body-recoil-burst.js'
      - 'src/combat/shield-driven-contact-coupling.js'
      - 'src/combat/immediate-block-rebound-parity.js'
      - 'src/combat/parallel-parry-body-stagger.js'
      - 'src/combat/parry-backward-balance-break.js'
      - 'src/combat/attacker-recoil-presentation.js'
      - 'src/combat/directional-recoil-planner.js'
      - 'tools/action-studio/shield-driven-contact-coupling-lab.html'
      - 'tools/action-studio/shield-driven-contact-coupling-lab.js'
      - 'tools/action-studio/shield-driven-contact-coupling-lab-r28.js'
      - 'tests/legacy-two-actor-recoil-passthrough.test.js'
      - 'tests/legacy-two-actor-recoil-visual-lab.test.js'
      - 'tests/post-coupling-recoil-stagger-handoff.test.js'
      - 'tests/attacker-recoil-presentation.test.js'
      - 'tests/contact-release-separation-motion.test.js'
      - 'tests/immediate-block-rebound-parity.test.js'
      - 'tests/parallel-parry-body-stagger.test.js'
      - 'tests/parry-backward-balance-break.test.js'
      - 'tests/two-actor-whole-body-recoil-burst.test.js'
      - 'tests/shield-driven-contact-coupling.test.js'
      - 'tests/recoil-presentation-authority.test.js'
      - 'tests/directional-recoil-planner.test.js'
      - '.github/workflows/contact-release-separation-recoil.yml'
  push:
    branches:
      - 'g43b5r28-legacy-two-actor-recoil-passthrough'

permissions:
  contents: read

jobs:
  legacy-two-actor-recoil-passthrough-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Verify runtime and active lab syntax
        run: >-
          node --check src/combat/immediate-block-rebound-parity.js
          && node --check src/combat/parry-backward-balance-break.js
          && node --check src/combat/two-actor-whole-body-recoil-burst.js
          && node --check src/combat/post-coupling-recoil-stagger-handoff.js
          && node --check src/combat/shield-driven-contact-coupling.js
          && node --check src/combat/attacker-recoil-presentation.js
          && node --check tools/action-studio/shield-driven-contact-coupling-lab-r28.js

      - name: Run historical runtime compatibility and active .2.8 visual regressions
        run: >-
          node --test
          tests/legacy-two-actor-recoil-passthrough.test.js
          tests/legacy-two-actor-recoil-visual-lab.test.js
          tests/post-coupling-recoil-stagger-handoff.test.js
          tests/attacker-recoil-presentation.test.js
          tests/contact-release-separation-motion.test.js
          tests/immediate-block-rebound-parity.test.js
          tests/parallel-parry-body-stagger.test.js
          tests/parry-backward-balance-break.test.js
          tests/two-actor-whole-body-recoil-burst.test.js
          tests/shield-driven-contact-coupling.test.js
          tests/recoil-presentation-authority.test.js
          tests/directional-recoil-planner.test.js