name: G3.6 Power Parry Runtime Visual

on:
  pull_request:
    paths:
      - 'assets/skyrim/guard/converted/**'
      - 'src/animation/skyrim-converted-animation-library.js'
      - 'src/animation/parry-contact-deflect-runtime-clip.js'
      - 'src/animation/parry-upper-body-continuity.js'
      - 'src/combat/guard-*.js'
      - 'src/combat/longsword-guard-*.js'
      - 'tools/action-studio/guard-reaction-runtime-lab.*'
      - '.github/workflows/guard-reaction-runtime-visual.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize-branch:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 38 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/g3-6-power-parry-motion-redesign
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Update stale Counter virtual clip expectations
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/action-studio/guard-counter-runtime-lab.js')
          text = path.read_text()
          replacements = {
            "'SKYRIM_GUARD/parry_contact_deflect_t3'": "'SKYRIM_GUARD/power_parry_g36'",
            "'SKYRIM_GUARD/perfect_parry_contact_deflect_t3'": "'SKYRIM_GUARD/perfect_power_parry_g36'",
            'const T3_SKYRIM_LIBRARY_CLIPS=[': 'const G36_SKYRIM_LIBRARY_CLIPS=[',
            'T3_SKYRIM_LIBRARY_CLIPS.every(id=>skyrim.clips.has(id))': 'G36_SKYRIM_LIBRARY_CLIPS.every(id=>skyrim.clips.has(id))',
          }
          for old, new in replacements.items():
              if old in text:
                  text = text.replace(old, new)
              elif new not in text:
                  raise SystemExit(f'missing Counter parity token: {old}')
          path.write_text(text)
          PY
      - name: Build Action Studio standalone artifacts
        run: npm run build:action-studio
      - name: Commit final generated artifacts when changed
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- tools/action-studio/guard-counter-runtime-lab.js tools/action-studio/action-studio.bundle.js tools/action-studio/index.html
          if git diff --cached --quiet; then
            echo 'G3.6 final artifacts already current.'
            exit 0
          fi
          git commit -m 'Finalize G3.6 Counter parity and Action Studio bundle'
          git push origin HEAD:agent/g3-6-power-parry-motion-redesign

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify frozen Skyrim source assets
        shell: bash
        run: |
          test "$(sha256sum assets/skyrim/guard/converted/shd_blockhit.source.glb | cut -d' ' -f1)" = "270d68b5c62a7de68c39112ab9a813f27a758ac737a078fe55b21896cfce1f28"
          test "$(sha256sum assets/skyrim/guard/converted/shd_blockbash.source.glb | cut -d' ' -f1)" = "bae74b1cdf8724eb17073a7347192946fef8cc9cedcdb8c9728e6ea9004ea637"
          test "$(sha256sum assets/skyrim/guard/converted/shd_blockbashpower.source.glb | cut -d' ' -f1)" = "603cf8326501ca2dd3628e8f47c37c6cbad6bec491b224123af418e70c36fd47"

      - name: Run G3.6 production motion contract tests
        run: node --test tests/parry-contact-deflect-runtime-clip.test.js tests/guard-reaction-presentation.test.js tests/guard-state-machine.test.js tests/guard-presentation-runtime.test.js

      - name: Locate headless browser
        id: browser
        shell: bash
        run: |
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$BROWSER"
          echo "browser=$BROWSER" >> "$GITHUB_OUTPUT"
          "$BROWSER" --version

      - name: Verify production Guard Block and Power Parry runtime
        shell: bash
        env:
          BROWSER: ${{ steps.browser.outputs.browser }}
        run: |
          mkdir -p artifacts/g3-6-power-parry
          python3 -m http.server 4173 > /tmp/g36-runtime-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          BASE='http://127.0.0.1:4173/tools/action-studio/guard-reaction-runtime-lab.html'
          "$BROWSER" --headless --no-sandbox --disable-gpu --enable-unsafe-swiftshader --hide-scrollbars \
            --window-size=1500,1000 --virtual-time-budget=30000 --dump-dom \
            "${BASE}?reaction=parry&elapsed=315&view=three" > artifacts/g3-6-power-parry/g36-dom.html
          if ! grep -q 'data-g36="pass"' artifacts/g3-6-power-parry/g36-dom.html; then
            echo 'G3.6 Power Parry runtime visual gate failed.' >&2
            sed -n '/<pre id="report"/,/<\/pre>/p' artifacts/g3-6-power-parry/g36-dom.html || true
            exit 1
          fi
          grep -q 'data-g332-count="6"' artifacts/g3-6-power-parry/g36-dom.html
          grep -q 'data-g332-block="pass"' artifacts/g3-6-power-parry/g36-dom.html
          grep -q 'data-g332-parry="pass"' artifacts/g3-6-power-parry/g36-dom.html
          grep -q 'data-g332-perfect="pass"' artifacts/g3-6-power-parry/g36-dom.html
          grep -q 'data-g36-virtual="pass"' artifacts/g3-6-power-parry/g36-dom.html
          grep -q 'data-g36-power="pass"' artifacts/g3-6-power-parry/g36-dom.html
          grep -q 'data-g36-shared-motion="pass"' artifacts/g3-6-power-parry/g36-dom.html
          grep -q 'data-g36-block-semantic="pass"' artifacts/g3-6-power-parry/g36-dom.html

          "$BROWSER" --headless --no-sandbox --disable-gpu --enable-unsafe-swiftshader --hide-scrollbars \
            --window-size=1500,1000 --virtual-time-budget=22000 \
            --screenshot="artifacts/g3-6-power-parry/guard-block-300ms.png" \
            "${BASE}?reaction=block&elapsed=300&view=three"
          "$BROWSER" --headless --no-sandbox --disable-gpu --enable-unsafe-swiftshader --hide-scrollbars \
            --window-size=1500,1000 --virtual-time-budget=22000 \
            --screenshot="artifacts/g3-6-power-parry/parry-contact-150ms.png" \
            "${BASE}?reaction=parry&elapsed=150&view=three"
          "$BROWSER" --headless --no-sandbox --disable-gpu --enable-unsafe-swiftshader --hide-scrollbars \
            --window-size=1500,1000 --virtual-time-budget=22000 \
            --screenshot="artifacts/g3-6-power-parry/parry-contact-read-185ms.png" \
            "${BASE}?reaction=parry&elapsed=185&view=three"
          "$BROWSER" --headless --no-sandbox --disable-gpu --enable-unsafe-swiftshader --hide-scrollbars \
            --window-size=1500,1000 --virtual-time-budget=22000 \
            --screenshot="artifacts/g3-6-power-parry/parry-blend-235ms.png" \
            "${BASE}?reaction=parry&elapsed=235&view=three"
          "$BROWSER" --headless --no-sandbox --disable-gpu --enable-unsafe-swiftshader --hide-scrollbars \
            --window-size=1500,1000 --virtual-time-budget=22000 \
            --screenshot="artifacts/g3-6-power-parry/parry-power-315ms.png" \
            "${BASE}?reaction=parry&elapsed=315&view=three"
          "$BROWSER" --headless --no-sandbox --disable-gpu --enable-unsafe-swiftshader --hide-scrollbars \
            --window-size=1500,1000 --virtual-time-budget=22000 \
            --screenshot="artifacts/g3-6-power-parry/parry-power-side-315ms.png" \
            "${BASE}?reaction=parry&elapsed=315&view=side"
          "$BROWSER" --headless --no-sandbox --disable-gpu --enable-unsafe-swiftshader --hide-scrollbars \
            --window-size=1500,1000 --virtual-time-budget=22000 \
            --screenshot="artifacts/g3-6-power-parry/perfect-contact-150ms.png" \
            "${BASE}?reaction=perfect&elapsed=150&view=three"
          "$BROWSER" --headless --no-sandbox --disable-gpu --enable-unsafe-swiftshader --hide-scrollbars \
            --window-size=1500,1000 --virtual-time-budget=22000 \
            --screenshot="artifacts/g3-6-power-parry/perfect-blend-235ms.png" \
            "${BASE}?reaction=perfect&elapsed=235&view=three"
          "$BROWSER" --headless --no-sandbox --disable-gpu --enable-unsafe-swiftshader --hide-scrollbars \
            --window-size=1500,1000 --virtual-time-budget=22000 \
            --screenshot="artifacts/g3-6-power-parry/perfect-power-315ms.png" \
            "${BASE}?reaction=perfect&elapsed=315&view=three"
          "$BROWSER" --headless --no-sandbox --disable-gpu --enable-unsafe-swiftshader --hide-scrollbars \
            --window-size=1500,1000 --virtual-time-budget=22000 \
            --screenshot="artifacts/g3-6-power-parry/perfect-power-side-315ms.png" \
            "${BASE}?reaction=perfect&elapsed=315&view=side"

      - name: Upload G3.6 Power Parry runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g3-6-power-parry-runtime-visual
          path: artifacts/g3-6-power-parry
