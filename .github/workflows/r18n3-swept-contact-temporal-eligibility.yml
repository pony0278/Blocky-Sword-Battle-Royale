name: R18N.3 Swept Contact Temporal Eligibility

on:
  pull_request:
    branches:
      - feature/r18n3-v6-4-swept-contact-temporal-eligibility

permissions:
  contents: read

jobs:
  validate-swept-contact-temporal-eligibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/r18n3-v6-4-swept-contact-temporal-eligibility
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Apply R18N candidate chain
        run: |
          node tools/action-studio/r18n1-stable-active-intercept-migration.mjs
          node tools/action-studio/r18n3-active-intercept-last-writer-migration.mjs
          node tools/action-studio/r18n3-fixed-target-arm-closure-migration.mjs
          node tools/action-studio/r18n3-active-window-boundary-migration.mjs
          node tools/action-studio/r18n3-swept-contact-temporal-eligibility-migration.mjs
          node tools/action-studio/r18n3-swept-contact-temporal-eligibility-test-migration.mjs
          node tools/action-studio/r18n3-r18m-legacy-ownership-test-migration.mjs
      - name: Lock unchanged authority and timing
        shell: bash
        run: |
          node --check src/combat/swept-contact-temporal-eligibility.js
          node --check tools/action-studio/r18n3-swept-contact-temporal-eligibility-migration.mjs
          node --check tools/action-studio/r18n3-swept-contact-temporal-eligibility-probe.mjs
          grep -q "contactSeconds: 0.23" src/combat/longsword-directional-metadata.js
          grep -q "const ACTIVE_LEAD_SECONDS = Object.freeze({ top: 0.055, right: 0.04, left: 0.045 })" src/combat/longsword-directional-attack-runtime.js
          grep -q "const ACTIVE_TRAIL_SECONDS = Object.freeze({ top: 0.065, right: 0.05, left: 0.055 })" src/combat/longsword-directional-attack-runtime.js
          grep -q "jointBudgetScale: 0.35" tools/action-studio/shield-parry-r281/pre-contact-controller.js
          grep -q "iterations: 2" tools/action-studio/shield-parry-r281/pre-contact-controller.js
          grep -q "const geometricContact = probeSweptSwordBucklerContact" tools/action-studio/shield-parry-r281/contact-handoff-controller.js
          grep -q "evaluateSweptContactTemporalEligibility" tools/action-studio/shield-parry-r281/contact-handoff-controller.js
          grep -q "swept-contact-subframe-authored-active-window" src/combat/swept-contact-temporal-eligibility.js
          grep -q "bounded-guidance-only-real-swept-contact-still-required" src/combat/active-parry-intercept-intent.js
      - name: Focused temporal authority contracts
        run: |
          node --test \
            tests/r18n3-swept-contact-temporal-eligibility.test.js \
            tests/committed-parry-contact-gate.test.js \
            tests/longsword-directional-attack-runtime.test.js \
            tests/guard-outcome-resolution.test.js \
            tests/shield-parry-r281-contact-handoff-controller.test.js \
            tests/two-actor-combat-integration.test.js \
            tests/old-two-actor-b3-direct-diagnostic.test.js
      - name: Full regression suite
        run: npm test
      - name: Build Action Studio
        run: npm run build:action-studio
      - name: Verify standalone Action Studio files stay current
        run: git diff --exit-code -- tools/action-studio/action-studio.bundle.js tools/action-studio/index.html
      - name: Verify Guard Runtime browser surface
        run: bash tools/action-studio/verify-guard-runtime-surface.sh
      - name: Run controlled RIGHT temporal eligibility probe
        shell: bash
        run: |
          set -euo pipefail
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$BROWSER"
          python3 -m http.server 4175 > r18n3-v64-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" >/dev/null 2>&1 || true' EXIT
          sleep 2
          BROWSER="$BROWSER" \
            R18N3_V64_TTC='0.110' \
            R18N3_V64_HITCH_AT='0.235' \
            R18N3_V64_HITCH_MS='55' \
            R18N3_V64_TRIALS='4' \
            node tools/action-studio/r18n3-swept-contact-temporal-eligibility-probe.mjs | tee r18n3-v64-probe.log
          grep -q '^R18N3_V64_PROBE_JSON=' r18n3-v64-probe.log
      - name: Validate temporal eligibility evidence
        shell: bash
        run: |
          node <<'NODE' | tee r18n3-v64-summary.log
          const fs = require('fs');
          const line = fs.readFileSync('r18n3-v64-probe.log','utf8').split(/\r?\n/)
            .find(v => v.startsWith('R18N3_V64_PROBE_JSON='));
          if (!line) throw new Error('missing v6.4 probe JSON');
          const data = JSON.parse(line.slice('R18N3_V64_PROBE_JSON='.length));
          if (data.trials?.length !== 4) throw new Error(`expected 4 trials, got ${data.trials?.length}`);
          const authority = 'swept-contact-subframe-authored-active-window';
          for (const row of data.trials) {
            if (!(Number(row.hitch?.actualMs) >= 45)) throw new Error(`trial ${row.trial}: hitch was not meaningful`);
            if (row.confirmed !== true || row.whiff !== false) throw new Error(`trial ${row.trial}: Parry was not confirmed`);
            if (row.contact !== true || row.geometricContact !== true) throw new Error(`trial ${row.trial}: missing real swept contact`);
            if (row.temporalAuthority !== authority || row.temporalEligible !== true) throw new Error(`trial ${row.trial}: missing temporal authority`);
            const contactTime = Number(row.contactElapsedSeconds);
            const activeStart = Number(row.activeStartSeconds);
            const activeEnd = Number(row.activeEndSeconds);
            const frameEnd = Number(row.frameEndElapsedSeconds);
            if (!(contactTime >= activeStart && contactTime <= activeEnd)) throw new Error(`trial ${row.trial}: contact timestamp outside authored ACTIVE`);
            if (!(frameEnd > activeEnd)) throw new Error(`trial ${row.trial}: controlled hitch did not cross ACTIVE end`);
            if (row.frameEndPhase !== 'attack_recovery' || row.frameEndPhaseActive !== false) throw new Error(`trial ${row.trial}: expected RECOVERY frame endpoint`);
            if (row.combatAccepted !== true) throw new Error(`trial ${row.trial}: combat handoff rejected temporal contact`);
            if (row.interruptionPhaseAtInterrupt !== 'attack_active') throw new Error(`trial ${row.trial}: interruption did not resolve at contact phase`);
            if (row.interruptionTemporalAuthority !== authority) throw new Error(`trial ${row.trial}: interruption lost temporal authority`);
            if (Math.abs(Number(row.interruptionSourceTimeSeconds) - contactTime) > 1e-6) throw new Error(`trial ${row.trial}: interruption source time != contact time`);
            if (!(Number(row.interruptionFrameEndElapsedMs) > activeEnd * 1000)) throw new Error(`trial ${row.trial}: interruption did not preserve frame-end diagnostic`);
            console.log(`R18N3_V64_TRIAL_${row.trial}=contactMs=${(contactTime*1000).toFixed(3)} frameEndMs=${(frameEnd*1000).toFixed(3)} sourceMs=${(Number(row.interruptionSourceTimeSeconds)*1000).toFixed(3)} confirmed=YES`);
          }
          console.log(`R18N3_V64_TOTAL confirmed=${data.confirmed}/4 whiff=${data.whiffs}/4`);
          console.log('R18N3_V64_TEMPORAL_ELIGIBILITY=PASS');
          NODE
      - name: Diff hygiene
        run: git diff --check
      - name: Upload v6.4 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r18n3-swept-contact-temporal-eligibility-v6-4
          path: |
            r18n3-v64-probe.log
            r18n3-v64-summary.log
            r18n3-v64-http.log
          retention-days: 3
