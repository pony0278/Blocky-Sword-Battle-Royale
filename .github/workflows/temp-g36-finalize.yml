name: TEMP G3.6 Finalize

on:
  push:
    branches:
      - agent/g3-6-power-parry-motion-redesign

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/g3-6-power-parry-motion-redesign
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Update stale Counter virtual clip expectations
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/action-studio/guard-counter-runtime-lab.js')
          text = path.read_text()
          replacements = {
            "'SKYRIM_GUARD/parry_contact_deflect_t3'": "'SKYRIM_GUARD/power_parry_g36'",
            "'SKYRIM_GUARD/perfect_parry_contact_deflect_t3'": "'SKYRIM_GUARD/perfect_power_parry_g36'",
            'const T3_SKYRIM_LIBRARY_CLIPS=[': 'const G36_SKYRIM_LIBRARY_CLIPS=[',
            'T3_SKYRIM_LIBRARY_CLIPS.every(id=>skyrim.clips.has(id))': 'G36_SKYRIM_LIBRARY_CLIPS.every(id=>skyrim.clips.has(id))',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing expected stale Counter token: {old}')
              text = text.replace(old, new)
          path.write_text(text)
          PY
      - name: Build Action Studio standalone artifacts
        run: npm run build:action-studio
      - name: Commit G3.6 final generated artifacts
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- tools/action-studio/guard-counter-runtime-lab.js tools/action-studio/action-studio.bundle.js tools/action-studio/index.html
          if git diff --cached --quiet; then
            echo 'G3.6 generated artifacts already current.'
            exit 0
          fi
          git commit -m 'Finalize G3.6 Counter parity and Action Studio bundle'
          git push origin HEAD:agent/g3-6-power-parry-motion-redesign

# Trigger commit after workflow registration.
