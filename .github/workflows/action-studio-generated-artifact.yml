name: Action Studio Generated Artifact

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/action-studio/**'
      - 'src/**'
      - 'build/build-action-studio.mjs'
      - 'package.json'
      - '.github/workflows/action-studio-generated-artifact.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build Action Studio
        run: npm run build:action-studio

      - name: Commit generated standalone files when changed
        shell: bash
        run: |
          if git diff --quiet -- tools/action-studio/action-studio.bundle.js tools/action-studio/index.html; then
            echo 'Generated files already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/action-studio/action-studio.bundle.js tools/action-studio/index.html
          git commit -m 'Refresh standalone Action Studio bundle'
          git push origin HEAD:${{ github.head_ref }}

      - name: Upload generated standalone files
        uses: actions/upload-artifact@v4
        with:
          name: action-studio-generated
          path: |
            tools/action-studio/action-studio.bundle.js
            tools/action-studio/index.html
