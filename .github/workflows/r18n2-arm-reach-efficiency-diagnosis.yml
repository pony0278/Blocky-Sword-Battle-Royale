name: R18N.2 Arm Reach Efficiency Diagnosis

on:
  pull_request:
    branches:
      - feature/r18n2-arm-reach-efficiency-diagnosis

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout R18N.2 diagnosis base
        uses: actions/checkout@v4
        with:
          ref: feature/r18n2-arm-reach-efficiency-diagnosis
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Capture v10 candidate full-suite baseline
        shell: bash
        run: |
          set -euo pipefail
          BASE=f6c0fb820d169cb371d507c6ef15cf2b764b53c7
          rm -rf /tmp/r18n2-v10-baseline
          git worktree add --detach /tmp/r18n2-v10-baseline "$BASE"
          set +e
          (
            cd /tmp/r18n2-v10-baseline
            npm install >/dev/null 2>&1
            node tools/action-studio/r18n1-stable-active-intercept-migration.mjs
            npm test > /tmp/r18n2-v10-baseline.log 2>&1
          )
          BASELINE_EXIT=$?
          set -e
          node <<'NODE'
          const fs = require('fs');
          const text = fs.readFileSync('/tmp/r18n2-v10-baseline.log', 'utf8');
          const titles = [...text.matchAll(/^\s*not ok \d+ - (.+)$/gm)].map((m) => m[1].trim()).sort();
          fs.writeFileSync('/tmp/r18n2-v10-baseline.failures', `${titles.join('\n')}${titles.length ? '\n' : ''}`);
          console.log(`R18N.2 v10 baseline failure titles: ${titles.length}`);
          for (const title of titles) console.log(`V10 BASELINE FAIL: ${title}`);
          NODE
          echo "V10 baseline npm test exit: ${BASELINE_EXIT}"
          test "$(wc -l < /tmp/r18n2-v10-baseline.failures)" -eq 14
          git worktree remove --force /tmp/r18n2-v10-baseline

      - name: Apply guarded R18N.1 v10 candidate
        run: node tools/action-studio/r18n1-stable-active-intercept-migration.mjs

      - name: Prove R18N.2 diagnosis contracts are red before overlay
        shell: bash
        run: |
          set +e
          node --test tests/r18n2-arm-reach-efficiency-diagnosis.test.js > r18n2-pre.log 2>&1
          PRE_EXIT=$?
          set -e
          cat r18n2-pre.log
          test "$PRE_EXIT" -ne 0

      - name: Apply read-only R18N.2 diagnosis overlay
        run: node tools/action-studio/r18n2-arm-reach-efficiency-diagnosis.mjs

      - name: Syntax and diagnosis contracts
        run: |
          node --check src/combat/guard-threat-tracking.js
          node --check tools/action-studio/shield-parry-r281/pre-contact-controller.js
          node --check tools/action-studio/r18n1-active-intercept-browser-probe.mjs
          node --check tools/action-studio/r18n2-arm-reach-efficiency-diagnosis.mjs
          node --check tests/r18n2-arm-reach-efficiency-diagnosis.test.js
          node --test \
            tests/r18n2-arm-reach-efficiency-diagnosis.test.js \
            tests/guard-threat-tracking.test.js \
            tests/active-parry-intercept-intent.test.js \
            tests/shield-parry-r281-active-intercept-runtime.test.js \
            tests/shield-parry-r281-pre-contact-controller.test.js

      - name: R18M R18N focused regression contracts
        run: |
          node --test \
            tests/shield-driven-contact-coupling-r281-regression.test.js \
            tests/shield-parry-r281-diagnostics.test.js \
            tests/shield-parry-r281-exchange-state.test.js \
            tests/shield-parry-r281-pre-contact-controller.test.js \
            tests/shield-parry-r281-contact-handoff-controller.test.js \
            tests/shield-parry-r281-verification-report.test.js \
            tests/shield-parry-r281-active-parry-intercept-diagnosis.test.js \
            tests/active-parry-intercept-intent.test.js \
            tests/shield-parry-r281-active-intercept-runtime.test.js \
            tests/shield-parry-r281-thin-entry-audit.test.js \
            tests/old-two-actor-b3-direct-diagnostic.test.js

      - name: Preserve tuning and authority locks
        shell: bash
        run: |
          set -euo pipefail
          grep -q "maxTrackingSpeedMps: 1.6" src/combat/guard-threat-tracking.js
          grep -q "upperArmMaxDegrees: 14" src/combat/guard-threat-tracking.js
          grep -q "lowerArmMaxDegrees: 18" src/combat/guard-threat-tracking.js
          LINES=$(wc -l < tools/action-studio/shield-driven-contact-coupling-lab-r281.js)
          echo "R281 lines: $LINES"
          test "$LINES" -le 725
          ! grep -Eq 'activeParryInterceptIntent|activeInterceptIntent' tools/action-studio/shield-parry-r281/exchange-state.js

      - name: Build Action Studio
        run: npm run build:action-studio

      - name: Verify standalone Action Studio files stay current
        run: git diff --exit-code -- tools/action-studio/action-studio.bundle.js tools/action-studio/index.html

      - name: Verify Guard Runtime browser surface
        run: bash tools/action-studio/verify-guard-runtime-surface.sh

      - name: Run TOP and RIGHT arm-efficiency browser diagnosis
        shell: bash
        run: |
          set -euo pipefail
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$BROWSER"
          python3 -m http.server 4175 > r18n2-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" >/dev/null 2>&1 || true' EXIT
          sleep 2
          BROWSER="$BROWSER" R18N1_PAGE_URL='http://127.0.0.1:4175/tools/action-studio/shield-driven-contact-coupling-lab.html' \
            node tools/action-studio/r18n1-active-intercept-browser-probe.mjs | tee r18n2-probe.log
          grep -q '^R18N1_PROBE_JSON=' r18n2-probe.log

      - name: Summarize R18N.2 reach efficiency evidence
        shell: bash
        run: |
          node <<'NODE' | tee r18n2-summary.log
          const fs = require('fs');
          const line = fs.readFileSync('r18n2-probe.log', 'utf8').split(/\r?\n/)
            .find((value) => value.startsWith('R18N1_PROBE_JSON='));
          if (!line) throw new Error('R18N.2 missing probe JSON');
          const data = JSON.parse(line.slice('R18N1_PROBE_JSON='.length));
          const finite = (values) => values.map(Number).filter(Number.isFinite);
          const avg = (values) => values.length ? values.reduce((a, b) => a + b, 0) / values.length : null;
          const summarize = (row) => {
            if (row.inputResult?.accepted !== true) throw new Error(`${row.direction} F input rejected`);
            if (row.final?.confirmation?.accepted !== true || row.final?.whiff) {
              throw new Error(`${row.direction} lost authoritative real-contact confirmation`);
            }
            const reports = row.samples.map((sample) => sample.primaryArmReachEfficiency).filter(Boolean);
            if (!reports.length) throw new Error(`${row.direction} missing primary arm reach telemetry`);
            const passes = reports.flatMap((report) => report.passes || []);
            if (!passes.length) throw new Error(`${row.direction} missing per-joint solve passes`);
            const requested = finite(reports.map((report) => report.requestedDistanceMeters));
            const achieved = finite(reports.map((report) => report.achievedDistanceMeters));
            const reduction = finite(reports.map((report) => report.targetDistanceReductionMeters));
            const displacementEfficiency = finite(reports.map((report) => report.displacementEfficiency));
            const convergenceEfficiency = finite(reports.map((report) => report.convergenceEfficiency));
            const radial = finite(passes.map((pass) => pass.radialDemandRatio));
            const tangential = finite(passes.map((pass) => pass.tangentialTargetMeters));
            const upperUse = finite(reports.map((report) => report.budgetUtilization?.['upperarm.l']));
            const lowerUse = finite(reports.map((report) => report.budgetUtilization?.['lowerarm.l']));
            const saturated = passes.filter((pass) => pass.budgetSaturated === true).length;
            const saturatedRatio = passes.length ? saturated / passes.length : 0;
            const meanDisplacementEfficiency = avg(displacementEfficiency);
            const maxRadialDemandRatio = radial.length ? Math.max(...radial) : null;
            let diagnosisHint = 'mixed-or-insufficient-evidence';
            if (saturatedRatio >= 0.5) diagnosisHint = 'joint-angle-budget-pressure';
            else if ((maxRadialDemandRatio ?? 0) >= 0.7 && (meanDisplacementEfficiency ?? 1) < 0.5) diagnosisHint = 'rotation-geometry-radial-demand';
            else if ((meanDisplacementEfficiency ?? 1) < 0.5) diagnosisHint = 'low-effector-translation-efficiency';
            return {
              frames: reports.length,
              solverPasses: passes.length,
              maxRequestedStepCm: requested.length ? Math.max(...requested) * 100 : null,
              maxAchievedStepCm: achieved.length ? Math.max(...achieved) * 100 : null,
              maxTargetReductionCm: reduction.length ? Math.max(...reduction) * 100 : null,
              meanDisplacementEfficiency,
              meanConvergenceEfficiency: avg(convergenceEfficiency),
              minDisplacementEfficiency: displacementEfficiency.length ? Math.min(...displacementEfficiency) : null,
              maxUpperBudgetUtilization: upperUse.length ? Math.max(...upperUse) : null,
              maxLowerBudgetUtilization: lowerUse.length ? Math.max(...lowerUse) : null,
              saturatedPasses: saturated,
              saturatedRatio,
              maxRadialDemandRatio,
              maxTangentialDemandCm: tangential.length ? Math.max(...tangential) * 100 : null,
              diagnosisHint,
            };
          };
          const summary = { top: summarize(data.top), right: summarize(data.right) };
          console.log(`R18N2_DIAGNOSIS_JSON=${JSON.stringify(summary)}`);
          console.log(JSON.stringify(summary, null, 2));
          NODE

      - name: Compare full-suite failure titles with v10 candidate
        shell: bash
        run: |
          set +e
          npm test > r18n2-candidate.log 2>&1
          CANDIDATE_EXIT=$?
          set -e
          node <<'NODE'
          const fs = require('fs');
          const text = fs.readFileSync('r18n2-candidate.log', 'utf8');
          const titles = [...text.matchAll(/^\s*not ok \d+ - (.+)$/gm)].map((m) => m[1].trim()).sort();
          fs.writeFileSync('r18n2-candidate.failures', `${titles.join('\n')}${titles.length ? '\n' : ''}`);
          console.log(`R18N.2 candidate failure titles: ${titles.length}`);
          NODE
          echo "R18N.2 npm test exit: ${CANDIDATE_EXIT}"
          diff -u /tmp/r18n2-v10-baseline.failures r18n2-candidate.failures

      - name: Diff hygiene
        run: git diff --check

      - name: Upload R18N.2 diagnosis evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r18n2-arm-reach-efficiency-diagnosis
          path: |
            r18n2-pre.log
            r18n2-probe.log
            r18n2-http.log
            r18n2-summary.log
            r18n2-candidate.log
            r18n2-candidate.failures
          if-no-files-found: warn
          retention-days: 3
