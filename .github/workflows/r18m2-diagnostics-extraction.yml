name: R18M.2 Diagnostics Extraction

on:
  push:
    branches: [refactor/shield-parry-r18m-maintainability]
    paths:
      - 'tools/refactor/r18m2-extract-diagnostics.mjs'
      - '.github/workflows/r18m2-diagnostics-extraction.yml'

permissions:
  contents: write

jobs:
  extract-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout refactor branch
        uses: actions/checkout@v4
        with:
          ref: refactor/shield-parry-r18m-maintainability
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Extract R18M.2 diagnostics modules
        run: node tools/refactor/r18m2-extract-diagnostics.mjs

      - name: Syntax check extracted browser modules
        run: |
          node --check tools/action-studio/shield-parry-r281/diagnostic-telemetry.js
          node --check tools/action-studio/shield-parry-r281/diagnostic-formatters.js
          node --check tools/action-studio/shield-parry-r281/report-serialization.js
          node --check tools/action-studio/shield-driven-contact-coupling-lab-r281.js

      - name: Run R18M regression contracts
        run: node --test tests/shield-driven-contact-coupling-r281-regression.test.js tests/shield-parry-r281-diagnostics.test.js

      - name: Commit extracted modules
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            package.json \
            tests/shield-parry-r281-diagnostics.test.js \
            tools/action-studio/shield-driven-contact-coupling-lab-r281.js \
            tools/action-studio/shield-parry-r281/diagnostic-telemetry.js \
            tools/action-studio/shield-parry-r281/diagnostic-formatters.js \
            tools/action-studio/shield-parry-r281/report-serialization.js
          git diff --cached --check
          git commit -m 'R18M.2 extract R281 diagnostics telemetry'
          git push origin HEAD:refactor/shield-parry-r18m-maintainability
