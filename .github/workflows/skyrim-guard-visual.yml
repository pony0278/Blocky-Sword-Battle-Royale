name: Skyrim Guard Visual Verification

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/animation/skyrim-animation-retarget.js'
      - 'src/animation/skyrim-converted-animation-library.js'
      - 'src/animation/skyrim-weapon-bind-calibration.js'
      - 'src/animation/kaykit-animation-library.js'
      - 'src/combat/skyrim-guard-adoption-review.js'
      - 'src/combat/longsword-guard-metadata.js'
      - 'src/combat/longsword-guard-correction.js'
      - 'src/character/**'
      - 'tools/action-studio/skyrim-guard-visual-review.html'
      - 'tools/action-studio/skyrim-guard-visual-review.js'
      - 'tools/action-studio/skyrim-basis-verification.html'
      - 'tools/action-studio/skyrim-basis-verification.js'
      - 'tools/action-studio/skyrim-arm-chain-verification.html'
      - 'tools/action-studio/skyrim-arm-chain-verification.js'
      - 'tools/action-studio/skyrim-pose-equivalence-review.html'
      - 'tools/action-studio/skyrim-pose-equivalence-review.js'
      - 'tools/action-studio/skyrim-weapon-bind-verification.html'
      - 'tools/action-studio/skyrim-weapon-bind-verification.js'
      - 'tools/action-studio/skyrim-triangle-guard-authoring-lab.html'
      - 'tools/action-studio/skyrim-triangle-guard-authoring-lab.js'
      - 'assets/skyrim/guard/converted/shd_blockidle.source.glb'
      - '.github/workflows/skyrim-guard-visual.yml'

permissions:
  contents: read

jobs:
  canonical-playback:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build Action Studio
        run: npm run build:action-studio

      - name: Locate headless browser
        id: browser
        shell: bash
        run: |
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$BROWSER" ]; then
            echo 'No Chrome/Chromium executable is available on this runner.' >&2
            exit 1
          fi
          echo "browser=$BROWSER" >> "$GITHUB_OUTPUT"
          "$BROWSER" --version

      - name: Verify G2.4.2 coordinate basis
        shell: bash
        env:
          BROWSER: ${{ steps.browser.outputs.browser }}
        run: |
          mkdir -p artifacts/g2-4-1
          cp assets/skyrim/guard/converted/shd_blockidle.source.glb artifacts/g2-4-1/canonical-source.glb
          python3 -m http.server 4173 > /tmp/g2-4-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2

          BASIS='http://127.0.0.1:4173/tools/action-studio/skyrim-basis-verification.html'
          "$BROWSER" --headless --no-sandbox --disable-gpu --hide-scrollbars \
            --window-size=1280,900 --virtual-time-budget=12000 \
            --dump-dom "$BASIS" \
            > artifacts/g2-4-1/basis-probe-dom.html

          if ! grep -q 'data-g242="pass"' artifacts/g2-4-1/basis-probe-dom.html; then
            echo 'G2.4.2 coordinate basis verification failed.' >&2
            sed -n '/<pre id="report"/,/<\/pre>/p' artifacts/g2-4-1/basis-probe-dom.html || true
            exit 1
          fi

      - name: Verify G2.4.3 arm chain and wrist fidelity
        shell: bash
        env:
          BROWSER: ${{ steps.browser.outputs.browser }}
        run: |
          python3 -m http.server 4173 > /tmp/g2-4-arm-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2

          ARM='http://127.0.0.1:4173/tools/action-studio/skyrim-arm-chain-verification.html'
          "$BROWSER" --headless --no-sandbox --disable-gpu --hide-scrollbars \
            --window-size=1280,900 --virtual-time-budget=12000 \
            --dump-dom "$ARM" \
            > artifacts/g2-4-1/arm-chain-probe-dom.html

          if ! grep -q 'data-g243="pass"' artifacts/g2-4-1/arm-chain-probe-dom.html; then
            echo 'G2.4.3 arm-chain / wrist fidelity verification failed.' >&2
            sed -n '/<pre id="report"/,/<\/pre>/p' artifacts/g2-4-1/arm-chain-probe-dom.html || true
            exit 1
          fi

      - name: Review G2.4.4 source target pose equivalence
        shell: bash
        env:
          BROWSER: ${{ steps.browser.outputs.browser }}
        run: |
          python3 -m http.server 4173 > /tmp/g2-4-equivalence-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2

          REVIEW='http://127.0.0.1:4173/tools/action-studio/skyrim-pose-equivalence-review.html?sample=0.5&view=front'
          "$BROWSER" --headless --no-sandbox --disable-gpu --hide-scrollbars \
            --window-size=1600,1000 --virtual-time-budget=15000 \
            --dump-dom "$REVIEW" \
            > artifacts/g2-4-1/equivalence-probe-dom.html

          if ! grep -q 'data-g244="ready"' artifacts/g2-4-1/equivalence-probe-dom.html; then
            echo 'G2.4.4 source-target equivalence review did not complete.' >&2
            sed -n '/<pre id="report"/,/<\/pre>/p' artifacts/g2-4-1/equivalence-probe-dom.html || true
            exit 1
          fi

          grep -o 'data-g244-equivalence="[^"]*"' artifacts/g2-4-1/equivalence-probe-dom.html || true
          grep -o 'data-g244-decision="[^"]*"' artifacts/g2-4-1/equivalence-probe-dom.html || true

          BASE='http://127.0.0.1:4173/tools/action-studio/skyrim-pose-equivalence-review.html'
          for sample in 0 0.25 0.5 0.75 0.998; do
            label="$(printf '%s' "$sample" | tr '.' '_')"
            "$BROWSER" --headless --no-sandbox --disable-gpu --hide-scrollbars \
              --window-size=1600,1000 --virtual-time-budget=15000 \
              --screenshot="artifacts/g2-4-1/g244-front-${label}.png" \
              "${BASE}?view=front&sample=${sample}"
          done

          "$BROWSER" --headless --no-sandbox --disable-gpu --hide-scrollbars \
            --window-size=1600,1000 --virtual-time-budget=15000 \
            --screenshot="artifacts/g2-4-1/g244-three-0_5.png" \
            "${BASE}?view=three&sample=0.5"

      - name: Verify G2.4.5 weapon helper sword bind calibration
        shell: bash
        env:
          BROWSER: ${{ steps.browser.outputs.browser }}
        run: |
          python3 -m http.server 4173 > /tmp/g2-4-weapon-bind-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2

          BASE='http://127.0.0.1:4173/tools/action-studio/skyrim-weapon-bind-verification.html'
          "$BROWSER" --headless --no-sandbox --disable-gpu --hide-scrollbars \
            --window-size=1500,1000 --virtual-time-budget=15000 \
            --dump-dom "${BASE}?view=front&sample=0.5" \
            > artifacts/g2-4-1/weapon-bind-probe-dom.html

          if ! grep -q 'data-g245="pass"' artifacts/g2-4-1/weapon-bind-probe-dom.html; then
            echo 'G2.4.5 weapon bind frame equivalence failed.' >&2
            sed -n '/<pre id="report"/,/<\/pre>/p' artifacts/g2-4-1/weapon-bind-probe-dom.html || true
            exit 1
          fi

          grep -o 'data-g245-socket="[^"]*"' artifacts/g2-4-1/weapon-bind-probe-dom.html || true
          grep -o 'data-g245-decision="[^"]*"' artifacts/g2-4-1/weapon-bind-probe-dom.html || true

          for view in front three; do
            "$BROWSER" --headless --no-sandbox --disable-gpu --hide-scrollbars \
              --window-size=1500,1000 --virtual-time-budget=15000 \
              --screenshot="artifacts/g2-4-1/g245-${view}-0_5.png" \
              "${BASE}?view=${view}&sample=0.5"
          done

      - name: Verify G2.5.1 Triangle Forward Base Guard authoring
        shell: bash
        env:
          BROWSER: ${{ steps.browser.outputs.browser }}
        run: |
          python3 -m http.server 4173 > /tmp/g2-5-1-authoring-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2

          BASE='http://127.0.0.1:4173/tools/action-studio/skyrim-triangle-guard-authoring-lab.html'
          "$BROWSER" --headless --no-sandbox --disable-gpu --hide-scrollbars \
            --window-size=1600,1100 --virtual-time-budget=40000 \
            --dump-dom "${BASE}?auto=1&view=three" \
            > artifacts/g2-4-1/g251-authoring-probe-dom.html

          if ! grep -q 'data-g251="pass"' artifacts/g2-4-1/g251-authoring-probe-dom.html; then
            echo 'G2.5.1 Triangle Forward authoring seed did not pass all five canonical samples.' >&2
            grep -o 'data-g251[^ >]*' artifacts/g2-4-1/g251-authoring-probe-dom.html || true
            sed -n '/<pre id="validation"/,/<\/pre>/p' artifacts/g2-4-1/g251-authoring-probe-dom.html || true
            exit 1
          fi

          grep -o 'data-g251-samples="[^"]*"' artifacts/g2-4-1/g251-authoring-probe-dom.html || true
          grep -o 'data-g251-authoring="[^"]*"' artifacts/g2-4-1/g251-authoring-probe-dom.html || true

          for view in front three; do
            "$BROWSER" --headless --no-sandbox --disable-gpu --hide-scrollbars \
              --window-size=1600,1100 --virtual-time-budget=40000 \
              --screenshot="artifacts/g2-4-1/g251-${view}-0_5.png" \
              "${BASE}?auto=1&view=${view}"
          done

      - name: Capture canonical playback frames
        shell: bash
        env:
          BROWSER: ${{ steps.browser.outputs.browser }}
        run: |
          python3 -m http.server 4173 > /tmp/g2-4-visual-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2

          BASE='http://127.0.0.1:4173/tools/action-studio/skyrim-guard-visual-review.html?canonical=1'

          "$BROWSER" --headless --no-sandbox --disable-gpu --hide-scrollbars \
            --window-size=1600,1100 --virtual-time-budget=10000 \
            --dump-dom "${BASE}&view=three&sample=0.5" \
            > artifacts/g2-4-1/probe-dom.html

          if ! grep -q 'data-g241="pass"' artifacts/g2-4-1/probe-dom.html; then
            echo 'G2.4.1 runtime stability/loop verification did not pass.' >&2
            grep -o 'data-g241[^ >]*' artifacts/g2-4-1/probe-dom.html || true
            exit 1
          fi

          for sample in 0 0.25 0.5 0.75 0.998; do
            label="$(printf '%s' "$sample" | tr '.' '_')"
            "$BROWSER" --headless --no-sandbox --disable-gpu --hide-scrollbars \
              --window-size=1600,1100 --virtual-time-budget=10000 \
              --screenshot="artifacts/g2-4-1/three-${label}.png" \
              "${BASE}&view=three&sample=${sample}"
          done

          for view in front side back; do
            "$BROWSER" --headless --no-sandbox --disable-gpu --hide-scrollbars \
              --window-size=1600,1100 --virtual-time-budget=10000 \
              --screenshot="artifacts/g2-4-1/${view}-0_5.png" \
              "${BASE}&view=${view}&sample=0.5"
          done

      - name: Upload G2.4 visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g2-4-skyrim-guard-visual
          path: artifacts/g2-4-1
          if-no-files-found: warn
