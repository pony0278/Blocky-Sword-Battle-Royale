name: G3.3.2 Temporary Reaction GLB Bake

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  bake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct verified G3.3.1 reaction inputs
        shell: bash
        run: |
          mkdir -p .probe/reactions .probe/pynifly artifacts/g3-3-2
          cat .probe/chunks/reactions.b64.* | base64 -d > /tmp/g3-3-1-reactions.tar.gz
          test "$(sha256sum /tmp/g3-3-1-reactions.tar.gz | cut -d' ' -f1)" = "08fa1638d3b3a1c9feeae90e3849d2b42c27df606d3eeadb73c856db5e7c61de"
          tar -xzf /tmp/g3-3-1-reactions.tar.gz -C .probe/reactions
          test "$(sha256sum .probe/reactions/shd_blockhit.hkx | cut -d' ' -f1)" = "139f0e90d25bd9be5657fecdb5912adbe6bce453949518769ee02f7ed01cfa04"
          test "$(sha256sum .probe/reactions/shd_blockbash.hkx | cut -d' ' -f1)" = "37bc83926597a65e7660cae7367a3dd0b0f23d812137907a7548b3754bf90bfd"
          test "$(sha256sum .probe/reactions/shd_blockbashpower.hkx | cut -d' ' -f1)" = "b5813d5877b2cf698913d3fbb228078d8e7384780db79957f133326f74c36168"

      - name: Fetch pinned PyNifly Skyrim HKX reader
        run: |
          curl -fsSL https://raw.githubusercontent.com/BadDogSkyrim/PyNifly/2064a5cc6ec240f07a9df51ac5655541e756633c/io_scene_nifly/hkx/anim_fo4.py -o .probe/pynifly/anim_fo4.py
          curl -fsSL https://raw.githubusercontent.com/BadDogSkyrim/PyNifly/2064a5cc6ec240f07a9df51ac5655541e756633c/io_scene_nifly/hkx/anim_skyrim.py -o .probe/pynifly/anim_skyrim.py

      - name: Bake accepted reactions into canonical source GLBs
        shell: bash
        run: |
          python3 - <<'PY'
          import copy, json, math, pathlib, struct, sys
          sys.path.insert(0, '.probe/pynifly')
          from anim_skyrim import _parse_animation_hkx

          JSON_CHUNK = 0x4E4F534A
          BIN_CHUNK = 0x004E4942
          FLOAT = 5126

          def read_glb(path):
              raw = pathlib.Path(path).read_bytes()
              magic, version, total = struct.unpack_from('<III', raw, 0)
              if magic != 0x46546C67 or version != 2 or total != len(raw):
                  raise SystemExit('canonical source is not a valid GLB v2')
              cursor = 12
              doc = None
              binary = b''
              while cursor < len(raw):
                  length, kind = struct.unpack_from('<II', raw, cursor)
                  cursor += 8
                  payload = raw[cursor:cursor + length]
                  cursor += length
                  if kind == JSON_CHUNK:
                      doc = json.loads(payload.decode('utf-8').rstrip('\x00 '))
                  elif kind == BIN_CHUNK:
                      binary = payload
              if doc is None:
                  raise SystemExit('canonical GLB is missing JSON')
              return doc, binary

          def pad4(blob, fill=b'\x00'):
              rem = len(blob) % 4
              return blob if rem == 0 else blob + fill * (4 - rem)

          def write_glb(path, doc, binary):
              doc['buffers'][0]['byteLength'] = len(binary)
              json_blob = json.dumps(doc, separators=(',', ':'), ensure_ascii=False).encode('utf-8')
              json_blob = pad4(json_blob, b' ')
              bin_blob = pad4(binary, b'\x00')
              total = 12 + 8 + len(json_blob) + 8 + len(bin_blob)
              out = bytearray(struct.pack('<III', 0x46546C67, 2, total))
              out += struct.pack('<II', len(json_blob), JSON_CHUNK) + json_blob
              out += struct.pack('<II', len(bin_blob), BIN_CHUNK) + bin_blob
              pathlib.Path(path).write_bytes(out)

          def vec(values, width, default, frames, normalize_quaternion=False):
              values = list(values or [])
              result = []
              for i in range(frames):
                  source = values[i] if i < len(values) else (values[-1] if values else default)
                  row = [float(x) for x in list(source)[:width]]
                  while len(row) < width:
                      row.append(default[len(row)])
                  if normalize_quaternion:
                      length = math.sqrt(sum(v*v for v in row))
                      row = [v / length for v in row] if length > 1e-12 else list(default)
                  result.extend(row)
              return result

          def append_accessor(doc, binary, values, type_name, count, width, min_value=None, max_value=None):
              binary = pad4(binary, b'\x00')
              offset = len(binary)
              payload = struct.pack('<' + ('f' * len(values)), *values)
              binary += payload
              view_index = len(doc.setdefault('bufferViews', []))
              doc['bufferViews'].append({
                  'buffer': 0,
                  'byteOffset': offset,
                  'byteLength': len(payload),
              })
              accessor = {
                  'bufferView': view_index,
                  'componentType': FLOAT,
                  'count': count,
                  'type': type_name,
              }
              if min_value is not None: accessor['min'] = min_value
              if max_value is not None: accessor['max'] = max_value
              accessor_index = len(doc.setdefault('accessors', []))
              doc['accessors'].append(accessor)
              return accessor_index, binary

          canonical_doc, canonical_bin = read_glb('assets/skyrim/guard/converted/shd_blockidle.source.glb')
          skin = max(canonical_doc.get('skins', []), key=lambda value: len(value.get('joints', [])))
          joints = list(skin.get('joints', []))
          if len(joints) != 99:
              raise SystemExit(f'expected canonical 99-joint skin, got {len(joints)}')
          if canonical_doc['nodes'][joints[0]].get('name') != 'NPC Root [Root]':
              raise SystemExit('unexpected canonical root joint')

          expected = {
              'shd_blockhit': (25, 0.7999999523162842),
              'shd_blockbash': (11, 0.3333333432674408),
              'shd_blockbashpower': (22, 0.699999988079071),
          }
          summary = {}
          for ident, (expected_frames, expected_duration) in expected.items():
              anim = _parse_animation_hkx(pathlib.Path(f'.probe/reactions/{ident}.hkx').read_bytes())
              if anim is None or anim.num_tracks != 99 or len(anim.tracks) != 99:
                  raise SystemExit(f'{ident}: invalid 99-track decode')
              if anim.num_frames != expected_frames or abs(float(anim.duration) - expected_duration) > 1e-5:
                  raise SystemExit(f'{ident}: unexpected duration/frame count')
              if anim.track_to_bone_indices and anim.track_to_bone_indices != list(range(99)):
                  raise SystemExit(f'{ident}: non-identity binding requires explicit remap')

              doc = copy.deepcopy(canonical_doc)
              binary = bytes(canonical_bin)
              frame_count = int(anim.num_frames)
              times = [min(float(anim.duration), i * float(anim.frame_duration)) for i in range(frame_count)]
              time_accessor, binary = append_accessor(
                  doc, binary, times, 'SCALAR', frame_count, 1,
                  [min(times)], [max(times)],
              )
              animation = {'name': ident, 'samplers': [], 'channels': []}

              for track_index, track in enumerate(anim.tracks):
                  node_index = joints[track_index]
                  channels = []
                  if track.translations:
                      channels.append(('translation', vec(track.translations, 3, (0,0,0), frame_count), 'VEC3', 3))
                  if track.rotations:
                      channels.append(('rotation', vec(track.rotations, 4, (0,0,0,1), frame_count, True), 'VEC4', 4))
                  if track.scales:
                      channels.append(('scale', vec(track.scales, 3, (1,1,1), frame_count), 'VEC3', 3))
                  for target_path, values, type_name, width in channels:
                      output_accessor, binary = append_accessor(doc, binary, values, type_name, frame_count, width)
                      sampler_index = len(animation['samplers'])
                      animation['samplers'].append({
                          'input': time_accessor,
                          'output': output_accessor,
                          'interpolation': 'LINEAR',
                      })
                      animation['channels'].append({
                          'sampler': sampler_index,
                          'target': {'node': node_index, 'path': target_path},
                      })

              doc['animations'] = [animation]
              out = pathlib.Path(f'artifacts/g3-3-2/{ident}.source.glb')
              write_glb(out, doc, binary)
              summary[ident] = {
                  'duration': float(anim.duration),
                  'frames': frame_count,
                  'tracks': int(anim.num_tracks),
                  'channels': len(animation['channels']),
                  'bytes': out.stat().st_size,
              }
              print(ident, summary[ident])

          pathlib.Path('artifacts/g3-3-2/bake-summary.json').write_text(json.dumps(summary, indent=2), encoding='utf-8')
          PY

      - name: Verify baked GLB envelopes
        shell: bash
        run: |
          python3 - <<'PY'
          import json, pathlib, struct
          expected = {
            'shd_blockhit.source.glb': 0.8,
            'shd_blockbash.source.glb': 1/3,
            'shd_blockbashpower.source.glb': 0.7,
          }
          for name, duration in expected.items():
              raw = pathlib.Path('artifacts/g3-3-2', name).read_bytes()
              magic, version, total = struct.unpack_from('<III', raw, 0)
              assert magic == 0x46546C67 and version == 2 and total == len(raw)
              length, kind = struct.unpack_from('<II', raw, 12)
              assert kind == 0x4E4F534A
              doc = json.loads(raw[20:20+length].decode('utf-8').rstrip('\x00 '))
              assert len(doc.get('animations', [])) == 1
              animation = doc['animations'][0]
              assert len(animation['channels']) >= 99
              assert len(max(doc['skins'], key=lambda s: len(s.get('joints', [])))['joints']) == 99
              print(name, animation['name'], len(animation['channels']), len(raw))
          PY
          sha256sum artifacts/g3-3-2/*.glb | tee artifacts/g3-3-2/glb-sha256.txt

      - name: Upload baked G3.3.2 reaction sources
        uses: actions/upload-artifact@v4
        with:
          name: g3-3-2-baked-reaction-glbs
          path: artifacts/g3-3-2
