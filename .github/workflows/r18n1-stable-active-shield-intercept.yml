name: R18N.1 Stable Active Shield Intercept

on:
  pull_request:
    branches:
      - feature/r18n1-stable-active-shield-intercept

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout R18N.1 branch
        uses: actions/checkout@v4
        with:
          ref: feature/r18n1-stable-active-shield-intercept
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install candidate dependencies
        run: npm install

      - name: Capture fresh R18N.0 parent failure-title baseline
        shell: bash
        run: |
          set -euo pipefail
          BASE=c2ce10008286093b446c87847bb2a33c40ec1c40
          rm -rf /tmp/r18n1-baseline
          git worktree add --detach /tmp/r18n1-baseline "$BASE"
          set +e
          (cd /tmp/r18n1-baseline && npm install >/dev/null 2>&1 && npm test > /tmp/r18n1-baseline.log 2>&1)
          BASELINE_EXIT=$?
          set -e
          node <<'NODE'
          const fs = require('fs');
          const text = fs.readFileSync('/tmp/r18n1-baseline.log', 'utf8');
          const titles = [...text.matchAll(/^\s*not ok \d+ - (.+)$/gm)].map((m) => m[1].trim()).sort();
          fs.writeFileSync('/tmp/r18n1-baseline.failures', `${titles.join('\n')}${titles.length ? '\n' : ''}`);
          console.log(`R18N.1 parent failure titles: ${titles.length}`);
          for (const title of titles) console.log(`BASELINE FAIL: ${title}`);
          NODE
          echo "Baseline npm test exit: ${BASELINE_EXIT}"
          test "$(wc -l < /tmp/r18n1-baseline.failures)" -eq 14
          git worktree remove --force /tmp/r18n1-baseline

      - name: Prove integration contract is red before migration
        shell: bash
        run: |
          set +e
          node --test tests/active-parry-intercept-intent.test.js tests/shield-parry-r281-active-intercept-runtime.test.js > r18n1-pre.log 2>&1
          PRE_EXIT=$?
          set -e
          cat r18n1-pre.log
          test "$PRE_EXIT" -ne 0

      - name: Apply guarded R18N.1 integration
        run: node tools/action-studio/r18n1-stable-active-intercept-migration.mjs

      - name: Normalize candidate files
        shell: bash
        run: |
          for f in \
            package.json \
            src/combat/active-parry-intercept-intent.js \
            src/combat/predictive-intercept-parry.js \
            tools/action-studio/shield-driven-contact-coupling-lab-r281.js \
            tools/action-studio/shield-parry-r281/pre-contact-controller.js \
            tests/active-parry-intercept-intent.test.js \
            tests/shield-parry-r281-active-intercept-runtime.test.js; do
            sed -i 's/[[:space:]]\+$//' "$f"
          done

      - name: Syntax and R18N.1 direct contracts
        run: |
          node --check src/combat/active-parry-intercept-intent.js
          node --check src/combat/predictive-intercept-parry.js
          node --check tools/action-studio/shield-parry-r281/pre-contact-controller.js
          node --check tools/action-studio/shield-driven-contact-coupling-lab-r281.js
          node --check tests/active-parry-intercept-intent.test.js
          node --check tests/shield-parry-r281-active-intercept-runtime.test.js
          node --test \
            tests/active-parry-intercept-intent.test.js \
            tests/shield-parry-r281-active-intercept-runtime.test.js \
            tests/predictive-intercept-parry.test.js \
            tests/shield-parry-r281-pre-contact-controller.test.js

      - name: R18M plus R18N focused regression contracts
        run: |
          node --test \
            tests/shield-driven-contact-coupling-r281-regression.test.js \
            tests/shield-parry-r281-diagnostics.test.js \
            tests/shield-parry-r281-ui.test.js \
            tests/shield-parry-r281-ui-runtime.test.js \
            tests/shield-parry-r281-exchange-state.test.js \
            tests/shield-parry-r281-pre-contact-controller.test.js \
            tests/shield-parry-r281-contact-handoff-controller.test.js \
            tests/shield-parry-r281-composition-scene.test.js \
            tests/shield-parry-r281-attacker-presentation.test.js \
            tests/shield-parry-r281-verification-report.test.js \
            tests/shield-parry-r281-direct-old-b3-diagnostic.test.js \
            tests/shield-parry-r281-startup-debug-facade.test.js \
            tests/shield-parry-r281-active-parry-intercept-diagnosis.test.js \
            tests/active-parry-intercept-intent.test.js \
            tests/shield-parry-r281-active-intercept-runtime.test.js \
            tests/shield-parry-r281-thin-entry-audit.test.js \
            tests/old-two-actor-b3-direct-diagnostic.test.js

      - name: Preserve thin entry and zero new exchange-state fields
        shell: bash
        run: |
          LINES=$(wc -l < tools/action-studio/shield-driven-contact-coupling-lab-r281.js)
          echo "R281 lines: $LINES"
          test "$LINES" -le 725
          ! grep -Eq 'activeParryInterceptIntent|activeInterceptIntent' tools/action-studio/shield-parry-r281/exchange-state.js

      - name: Build Action Studio
        run: npm run build:action-studio

      - name: Verify standalone Action Studio files stay current
        run: git diff --exit-code -- tools/action-studio/action-studio.bundle.js tools/action-studio/index.html

      - name: Verify Guard Runtime browser surface
        run: bash tools/action-studio/verify-guard-runtime-surface.sh

      - name: Run TOP and RIGHT active-intercept browser probe
        shell: bash
        run: |
          set -euo pipefail
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$BROWSER"
          python3 -m http.server 4175 > /tmp/r18n1-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" >/dev/null 2>&1 || true' EXIT
          sleep 2
          BROWSER="$BROWSER" R18N1_PAGE_URL='http://127.0.0.1:4175/tools/action-studio/shield-driven-contact-coupling-lab.html' \
            node tools/action-studio/r18n1-active-intercept-browser-probe.mjs | tee r18n1-probe.log
          grep -q '^R18N1_PROBE_JSON=' r18n1-probe.log
          node <<'NODE'
          const fs = require('fs');
          const line = fs.readFileSync('r18n1-probe.log', 'utf8').split(/\r?\n/).find((value) => value.startsWith('R18N1_PROBE_JSON='));
          const data = JSON.parse(line.slice('R18N1_PROBE_JSON='.length));
          for (const direction of ['top', 'right']) {
            const row = data[direction];
            if (row.inputResult?.accepted !== true) throw new Error(`${direction} F input rejected`);
            const firstDrive = row.first?.drive;
            const intent = firstDrive?.activeInterceptIntent;
            if (firstDrive?.drivePlanSource !== 'latched-f-active-intercept-intent') throw new Error(`${direction} did not use latched intent`);
            if (!(intent?.leadMeters >= 0.069 && intent.leadMeters <= 0.121)) throw new Error(`${direction} intent lead out of bound: ${intent?.leadMeters}`);
            if (!(row.first?.presentation?.entryBlendProgress > 0 && row.first.presentation.entryBlendProgress < 1)) {
              throw new Error(`${direction} first presentation frame was not continuity blended: ${row.first?.presentation?.entryBlendProgress}`);
            }
            const firstTranslation = Number(row.first?.motion?.translationMeters);
            if (!Number.isFinite(firstTranslation) || firstTranslation > 0.10) {
              throw new Error(`${direction} first post-F shield jump too large: ${firstTranslation}`);
            }
            const required = row.samples.map((sample) => Number(sample.required)).filter(Number.isFinite);
            if (!required.length) throw new Error(`${direction} produced no active intent samples`);
            if (required.some((value) => value < 0.069 || value > 0.121)) throw new Error(`${direction} unstable plan distances: ${required.join(',')}`);
            if (Math.max(...required) - Math.min(...required) > 0.005) throw new Error(`${direction} active target oscillated: ${required.join(',')}`);
            const achieved = row.samples.map((sample) => Number(sample.achieved)).filter(Number.isFinite);
            if (!achieved.length || Math.max(...achieved) < 0.003) throw new Error(`${direction} shield arm did not measurably advance`);
            if (row.final?.whiff) throw new Error(`${direction} ended in whiff`);
            if (row.final?.confirmation?.accepted !== true) throw new Error(`${direction} did not reach confirmed real contact`);
            console.log(`R18N1 ${direction.toUpperCase()} lead=${(intent.leadMeters * 100).toFixed(1)}cm firstJump=${(firstTranslation * 100).toFixed(2)}cm maxAchieved=${(Math.max(...achieved) * 100).toFixed(2)}cm samples=${required.length}`);
          }
          NODE

      - name: Compare candidate full-suite failure titles with fresh parent
        shell: bash
        run: |
          set +e
          npm test > r18n1-candidate.log 2>&1
          CANDIDATE_EXIT=$?
          set -e
          node <<'NODE'
          const fs = require('fs');
          const text = fs.readFileSync('r18n1-candidate.log', 'utf8');
          const titles = [...text.matchAll(/^\s*not ok \d+ - (.+)$/gm)].map((m) => m[1].trim()).sort();
          fs.writeFileSync('r18n1-candidate.failures', `${titles.join('\n')}${titles.length ? '\n' : ''}`);
          console.log(`R18N.1 candidate failure titles: ${titles.length}`);
          NODE
          echo "Candidate npm test exit: ${CANDIDATE_EXIT}"
          diff -u /tmp/r18n1-baseline.failures r18n1-candidate.failures

      - name: Diff hygiene and allowed paths
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          rm -f r18n1-pre.log r18n1-probe.log r18n1-candidate.log r18n1-candidate.failures package-lock.json
          rm -f .github/workflows/r18n1-stable-active-shield-intercept.yml
          rm -f tools/action-studio/r18n1-stable-active-intercept-migration.mjs
          rm -f tools/action-studio/r18n1-active-intercept-browser-probe.mjs
          ALLOWED='^( M|M |A | A|D | D|\?\?) (package\.json|src/combat/active-parry-intercept-intent\.js|src/combat/predictive-intercept-parry\.js|tools/action-studio/shield-driven-contact-coupling-lab-r281\.js|tools/action-studio/shield-parry-r281/pre-contact-controller\.js|tests/active-parry-intercept-intent\.test\.js|tests/shield-parry-r281-active-intercept-runtime\.test\.js|\.github/workflows/r18n1-stable-active-shield-intercept\.yml|tools/action-studio/r18n1-stable-active-intercept-migration\.mjs|tools/action-studio/r18n1-active-intercept-browser-probe\.mjs)$'
          git status --short
          UNEXPECTED=$(git status --short | grep -Ev "$ALLOWED" || true)
          if [ -n "$UNEXPECTED" ]; then
            echo 'Unexpected R18N.1 working-tree changes:' >&2
            echo "$UNEXPECTED" >&2
            exit 1
          fi

      - name: Commit verified R18N.1 integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            package.json \
            src/combat/active-parry-intercept-intent.js \
            src/combat/predictive-intercept-parry.js \
            tools/action-studio/shield-driven-contact-coupling-lab-r281.js \
            tools/action-studio/shield-parry-r281/pre-contact-controller.js \
            tests/active-parry-intercept-intent.test.js \
            tests/shield-parry-r281-active-intercept-runtime.test.js \
            .github/workflows/r18n1-stable-active-shield-intercept.yml \
            tools/action-studio/r18n1-stable-active-intercept-migration.mjs \
            tools/action-studio/r18n1-active-intercept-browser-probe.mjs
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'R18N.1 stabilize active shield intercept intent'
          git push origin HEAD:feature/r18n1-stable-active-shield-intercept
