name: R18M.C1 Scene Inspection Migration

on:
  pull_request:
    branches:
      - refactor/r18m-c1-scene-inspection
    paths:
      - .r18mc1-trigger

concurrency:
  group: r18mc1-scene-inspection-migration
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  migrate-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout C1 branch
        uses: actions/checkout@v4
        with:
          ref: refactor/r18m-c1-scene-inspection
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Capture exact R18M.6 full-suite failure baseline
        shell: bash
        run: |
          set +e
          npm test > r18mc1-baseline.log 2>&1
          BASELINE_EXIT=$?
          set -e
          node <<'NODE'
          const fs = require('fs');
          const text = fs.readFileSync('r18mc1-baseline.log', 'utf8');
          const titles = [...text.matchAll(/^\s*not ok \d+ - (.+)$/gm)].map((m) => m[1].trim()).sort();
          fs.writeFileSync('r18mc1-baseline.failures', `${titles.join('\n')}${titles.length ? '\n' : ''}`);
          console.log(`C1 baseline failure titles: ${titles.length}`);
          for (const title of titles) console.log(`BASELINE FAIL: ${title}`);
          NODE
          echo "Baseline npm test exit: ${BASELINE_EXIT}"

      - name: Apply guarded C1 extraction
        run: node tools/action-studio/r18mc1-scene-inspection-migration.mjs

      - name: Normalize C1 files
        shell: bash
        run: |
          sed -i 's/[[:blank:]]\+$//' \
            tools/action-studio/shield-driven-contact-coupling-lab-r281.js \
            tools/action-studio/shield-parry-r281/lab-scene.js \
            tools/action-studio/shield-parry-r281/inspection-overlay.js \
            tests/shield-parry-r281-composition-scene.test.js \
            tests/shield-sword-hand-contact-coupling-lab.test.js

      - name: Syntax checks
        run: |
          node --check tools/action-studio/shield-driven-contact-coupling-lab-r281.js
          node --check tools/action-studio/shield-parry-r281/lab-scene.js
          node --check tools/action-studio/shield-parry-r281/inspection-overlay.js
          node --check tests/shield-parry-r281-composition-scene.test.js
          node --check tests/shield-sword-hand-contact-coupling-lab.test.js

      - name: R18M focused regression contracts
        run: |
          node --test \
            tests/shield-driven-contact-coupling-r281-regression.test.js \
            tests/shield-parry-r281-diagnostics.test.js \
            tests/shield-parry-r281-ui.test.js \
            tests/shield-parry-r281-exchange-state.test.js \
            tests/shield-parry-r281-pre-contact-controller.test.js \
            tests/shield-parry-r281-contact-handoff-controller.test.js \
            tests/shield-parry-r281-composition-scene.test.js

      - name: Build Action Studio
        run: npm run build:action-studio

      - name: Verify standalone Action Studio files stay current
        shell: bash
        run: git diff --exit-code -- tools/action-studio/action-studio.bundle.js tools/action-studio/index.html

      - name: Verify Guard Runtime browser surface
        shell: bash
        run: bash tools/action-studio/verify-guard-runtime-surface.sh

      - name: Compare candidate failure titles with exact baseline
        shell: bash
        run: |
          set +e
          npm test > r18mc1-candidate.log 2>&1
          CANDIDATE_EXIT=$?
          set -e
          node <<'NODE'
          const fs = require('fs');
          const text = fs.readFileSync('r18mc1-candidate.log', 'utf8');
          const titles = [...text.matchAll(/^\s*not ok \d+ - (.+)$/gm)].map((m) => m[1].trim()).sort();
          fs.writeFileSync('r18mc1-candidate.failures', `${titles.join('\n')}${titles.length ? '\n' : ''}`);
          console.log(`C1 candidate failure titles: ${titles.length}`);
          for (const title of titles) console.log(`CANDIDATE FAIL: ${title}`);
          NODE
          echo "Candidate npm test exit: ${CANDIDATE_EXIT}"
          diff -u r18mc1-baseline.failures r18mc1-candidate.failures

      - name: Diff hygiene and allowed-path guard
        shell: bash
        run: |
          git diff --check
          rm -f r18mc1-baseline.log r18mc1-candidate.log r18mc1-baseline.failures r18mc1-candidate.failures package-lock.json
          rm -f tools/action-studio/r18mc1-scene-inspection-migration.mjs
          rm -f .github/workflows/r18mc1-scene-inspection-migration.yml
          ALLOWED='^( M|M |A | A|D | D|\?\?) (package\.json|tools/action-studio/shield-driven-contact-coupling-lab-r281\.js|tests/shield-sword-hand-contact-coupling-lab\.test\.js|tools/action-studio/r18mc1-scene-inspection-migration\.mjs|\.github/workflows/r18mc1-scene-inspection-migration\.yml)$'
          git status --short
          UNEXPECTED=$(git status --short | grep -Ev "$ALLOWED" || true)
          if [ -n "$UNEXPECTED" ]; then
            echo 'Unexpected C1 working-tree changes:' >&2
            echo "$UNEXPECTED" >&2
            exit 1
          fi

      - name: Commit verified C1 migration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            package.json \
            tools/action-studio/shield-driven-contact-coupling-lab-r281.js \
            tests/shield-sword-hand-contact-coupling-lab.test.js \
            tools/action-studio/r18mc1-scene-inspection-migration.mjs \
            .github/workflows/r18mc1-scene-inspection-migration.yml
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'R18M.C1 extract scene and inspection presentation'
          git push origin HEAD:refactor/r18m-c1-scene-inspection
