name: R18N.4.2 Upper-Body Anticipation Split

on:
  push:
    branches:
      - feature/r18n4-2-upper-body-anticipation-split
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: r18n4-2-upper-body-anticipation-split
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/r18n4-2-upper-body-anticipation-split
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Apply R18N.4.2 runtime split
        run: node tools/action-studio/r18n4-2-upper-body-runtime-migration.mjs

      - name: Apply R18N.4.2 regression contract
        run: node tools/action-studio/r18n4-2-upper-body-test-migration.mjs

      - name: Run focused ownership regression
        run: >-
          node --test
          tests/predictive-intercept-parry.test.js
          tests/shield-parry-r281-active-intercept-runtime.test.js
          tests/shield-parry-r281-visual-ownership-baseline.test.js
          tests/shield-parry-r281-pre-contact-controller.test.js

      - name: Run full regression suite
        run: npm test

      - name: Build Action Studio
        run: npm run build:action-studio

      - name: Verify generated Action Studio files remain current
        shell: bash
        run: |
          git diff --exit-code -- \
            tools/action-studio/action-studio.bundle.js \
            tools/action-studio/index.html

      - name: Verify Guard Runtime browser surface
        run: bash tools/action-studio/verify-guard-runtime-surface.sh

      - name: Verify change scope
        shell: bash
        run: |
          git status --short
          unexpected="$(git diff --name-only | grep -Ev '^(src/combat/predictive-intercept-parry\.js|tools/action-studio/shield-parry-r281/visual-ownership-runtime-taps\.js|tests/shield-parry-r281-active-intercept-runtime\.test\.js)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected R18N.4.2 runtime diff:" >&2
            echo "$unexpected" >&2
            exit 1
          fi

      - name: Publish validated R18N.4.2 split and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            src/combat/predictive-intercept-parry.js \
            tools/action-studio/shield-parry-r281/visual-ownership-runtime-taps.js \
            tests/shield-parry-r281-active-intercept-runtime.test.js
          git rm .github/workflows/r18n4-2-upper-body-anticipation-split.yml
          git commit -m "R18N.4.2 split torso anticipation from shield-arm authority"
          git push origin HEAD:feature/r18n4-2-upper-body-anticipation-split
