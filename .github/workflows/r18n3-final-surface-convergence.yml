name: R18N.3 Final-Surface Convergence Gate

on:
  pull_request:
    branches:
      - feature/r18n3-active-intercept-last-writer-pose-authority

permissions:
  contents: read

jobs:
  validate-final-surface:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout R18N.3 base
        uses: actions/checkout@v4
        with:
          ref: feature/r18n3-active-intercept-last-writer-pose-authority
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Capture exact R18N.1 v10 full-suite baseline
        shell: bash
        run: |
          set -euo pipefail
          BASE=f6c0fb820d169cb371d507c6ef15cf2b764b53c7
          rm -rf /tmp/r18n3-v6-v10-baseline
          git worktree add --detach /tmp/r18n3-v6-v10-baseline "$BASE"
          set +e
          (
            cd /tmp/r18n3-v6-v10-baseline
            npm install >/dev/null 2>&1
            node tools/action-studio/r18n1-stable-active-intercept-migration.mjs
            npm test > /tmp/r18n3-v6-v10-baseline.log 2>&1
          )
          BASELINE_EXIT=$?
          set -e
          node <<'NODE'
          const fs = require('fs');
          const text = fs.readFileSync('/tmp/r18n3-v6-v10-baseline.log', 'utf8');
          const titles = [...text.matchAll(/^\s*not ok \d+ - (.+)$/gm)].map((m) => m[1].trim()).sort();
          fs.writeFileSync('/tmp/r18n3-v6-v10-baseline.failures', `${titles.join('\n')}${titles.length ? '\n' : ''}`);
          console.log(`R18N.1 v10 baseline failure titles: ${titles.length}`);
          NODE
          echo "R18N.1 v10 baseline npm test exit: ${BASELINE_EXIT}"
          test "$(wc -l < /tmp/r18n3-v6-v10-baseline.failures)" -eq 14
          git worktree remove --force /tmp/r18n3-v6-v10-baseline

      - name: Apply guarded 35 percent R18N.3 candidate
        run: |
          node tools/action-studio/r18n1-stable-active-intercept-migration.mjs
          node tools/action-studio/r18n3-active-intercept-last-writer-migration.mjs
          node tools/action-studio/r18n3-fixed-target-arm-closure-migration.mjs

      - name: Preserve v3 tuning and authority locks
        shell: bash
        run: |
          set -euo pipefail
          node --check src/combat/guard-threat-tracking.js
          node --check src/combat/guard-residual-body-reach.js
          node --check tools/action-studio/shield-parry-r281/pre-contact-controller.js
          node --check tools/action-studio/r18n3-final-surface-convergence-probe.mjs
          grep -q "maxTrackingSpeedMps: 1.6" src/combat/guard-threat-tracking.js
          grep -q "upperArmMaxDegrees: 14" src/combat/guard-threat-tracking.js
          grep -q "lowerArmMaxDegrees: 18" src/combat/guard-threat-tracking.js
          grep -q "jointBudgetScale: 0.35" tools/action-studio/shield-parry-r281/pre-contact-controller.js
          grep -q "iterations: 2" tools/action-studio/shield-parry-r281/pre-contact-controller.js
          grep -q "maxBodyReachMeters: 0.035" src/combat/guard-residual-body-reach.js
          grep -q "chestMaxDegrees: 2.4" src/combat/guard-residual-body-reach.js
          grep -q "spineMaxDegrees: 1.6" src/combat/guard-residual-body-reach.js
          grep -q "bounded-guidance-only-real-swept-contact-still-required" src/combat/active-parry-intercept-intent.js
          grep -q "fineTrackingRuntime.reset();" tools/action-studio/shield-parry-r281/contact-handoff-controller.js

      - name: Focused runtime regression contracts
        run: |
          node --test \
            tests/r18n3-active-intercept-last-writer.test.js \
            tests/guard-threat-tracking.test.js \
            tests/active-parry-intercept-intent.test.js \
            tests/shield-parry-r281-active-intercept-runtime.test.js \
            tests/shield-parry-r281-pre-contact-controller.test.js \
            tests/shield-parry-r281-contact-handoff-controller.test.js \
            tests/old-two-actor-b3-direct-diagnostic.test.js

      - name: Build Action Studio
        run: npm run build:action-studio

      - name: Verify standalone Action Studio files stay current
        run: git diff --exit-code -- tools/action-studio/action-studio.bundle.js tools/action-studio/index.html

      - name: Verify Guard Runtime browser surface
        run: bash tools/action-studio/verify-guard-runtime-surface.sh

      - name: Run TOP and RIGHT final-surface proof
        shell: bash
        run: |
          set -euo pipefail
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$BROWSER"
          python3 -m http.server 4175 > r18n3-v6-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" >/dev/null 2>&1 || true' EXIT
          sleep 2
          BROWSER="$BROWSER" R18N3_V6_PAGE_URL='http://127.0.0.1:4175/tools/action-studio/shield-driven-contact-coupling-lab.html' \
            node tools/action-studio/r18n3-final-surface-convergence-probe.mjs | tee r18n3-v6-probe.log
          grep -q '^R18N3_V6_PROBE_JSON=' r18n3-v6-probe.log

      - name: Enforce unchanged 2mm gate on final shield surface
        shell: bash
        run: |
          node <<'NODE' | tee r18n3-v6-summary.log
          const fs = require('fs');
          const line = fs.readFileSync('r18n3-v6-probe.log', 'utf8').split(/\r?\n/)
            .find((value) => value.startsWith('R18N3_V6_PROBE_JSON='));
          if (!line) throw new Error('missing R18N.3 v6 probe JSON');
          const data = JSON.parse(line.slice('R18N3_V6_PROBE_JSON='.length));
          const finite = (value) => Number.isFinite(Number(value));
          for (const direction of ['top', 'right']) {
            const row = data[direction];
            if (row?.inputAccepted !== true) throw new Error(`${direction} F input rejected`);
            if (row?.first?.drivePlanSource !== 'latched-f-active-intercept-intent') throw new Error(`${direction} did not use latched intent`);
            const lead = Number(row?.first?.leadMeters);
            if (!finite(lead) || lead < 0.069 || lead > 0.121) throw new Error(`${direction} intent lead out of bound: ${lead}`);
            const entryBlend = Number(row?.first?.entryBlendProgress);
            if (!finite(entryBlend) || entryBlend <= 0 || entryBlend > 1) throw new Error(`${direction} missing Guard-to-Parry continuity evidence`);
            const firstJump = Number(row?.first?.firstJumpMeters);
            if (!finite(firstJump) || firstJump > 0.10) throw new Error(`${direction} first post-F shield jump too large: ${firstJump}`);
            if (!row?.samples?.length) throw new Error(`${direction} missing active samples`);
            const targetDrift = Number(row.metrics?.targetDriftMeters);
            if (!finite(targetDrift) || targetDrift > 0.002) throw new Error(`${direction} fixed target drifted by ${targetDrift}m`);
            const intentDistances = row.samples.map((sample) => Number(sample.intentRemaining)).filter(Number.isFinite);
            if (!intentDistances.length || Math.max(...intentDistances) > 0.20) throw new Error(`${direction} active target escaped reachable neighborhood`);
            const initialDistance = Number(row.metrics?.firstIntentRemainingMeters);
            const finalDistance = Number(row.metrics?.minFinalSurfaceRemainingMeters);
            const convergence = Number(row.metrics?.finalSurfaceConvergenceMeters);
            if (!finite(initialDistance) || !finite(finalDistance) || !finite(convergence)) throw new Error(`${direction} missing final-surface convergence evidence`);
            if (!(convergence > 0.002)) {
              throw new Error(`${direction} final shield surface did not satisfy unchanged 2mm gate: initial=${initialDistance} final=${finalDistance} convergence=${convergence}`);
            }
            const achieved = Number(row.metrics?.maxAchievedMeters);
            if (!finite(achieved) || achieved < 0.003) throw new Error(`${direction} shield arm did not measurably advance`);
            if (Number(row.metrics?.closureBudgetScale) !== 0.35 || Number(row.metrics?.closureIterations) !== 2) {
              throw new Error(`${direction} did not use conservative v3 closure tuning`);
            }
            if (row?.whiff) throw new Error(`${direction} ended in whiff`);
            if (row?.confirmation !== true) throw new Error(`${direction} did not reach confirmed real swept contact`);
            console.log(
              `R18N3_V6_${direction.toUpperCase()} initial=${(initialDistance * 100).toFixed(3)}cm ` +
              `final=${(finalDistance * 100).toFixed(3)}cm convergence=${(convergence * 100).toFixed(3)}cm ` +
              `targetDrift=${(targetDrift * 100).toFixed(3)}cm firstJump=${(firstJump * 100).toFixed(3)}cm ` +
              `directionDot=${row.metrics?.minCorrectionDirectionDot}`,
            );
          }
          console.log('R18N3_V6_GATE=PASS');
          NODE

      - name: Compare full-suite failure titles with exact v10 candidate
        shell: bash
        run: |
          set +e
          npm test > r18n3-v6-candidate.log 2>&1
          CANDIDATE_EXIT=$?
          set -e
          node <<'NODE'
          const fs = require('fs');
          const text = fs.readFileSync('r18n3-v6-candidate.log', 'utf8');
          const titles = [...text.matchAll(/^\s*not ok \d+ - (.+)$/gm)].map((m) => m[1].trim()).sort();
          fs.writeFileSync('r18n3-v6-candidate.failures', `${titles.join('\n')}${titles.length ? '\n' : ''}`);
          console.log(`R18N.3 v6 candidate failure titles: ${titles.length}`);
          NODE
          echo "R18N.3 v6 npm test exit: ${CANDIDATE_EXIT}"
          diff -u /tmp/r18n3-v6-v10-baseline.failures r18n3-v6-candidate.failures

      - name: Diff hygiene
        run: git diff --check

      - name: Upload R18N.3 v6 proof evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r18n3-final-surface-convergence-v6
          path: |
            r18n3-v6-probe.log
            r18n3-v6-http.log
            r18n3-v6-summary.log
            r18n3-v6-candidate.log
            r18n3-v6-candidate.failures
          if-no-files-found: warn
          retention-days: 3
