name: Guard Hold Source Time Probe

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/action-studio/guard-hold-source-time-probe.*'
      - 'src/animation/**'
      - 'src/character/**'
      - 'src/combat/**'
      - '.github/workflows/guard-hold-source-time-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run source-time probe
        shell: bash
        run: |
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$BROWSER"
          python3 -m http.server 4173 > /tmp/guard-source-time-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          "$BROWSER" --headless --no-sandbox --disable-gpu --enable-unsafe-swiftshader --hide-scrollbars \
            --window-size=1000,700 --virtual-time-budget=30000 --dump-dom \
            'http://127.0.0.1:4173/tools/action-studio/guard-hold-source-time-probe.html' \
            > /tmp/guard-source-time-dom.html
          grep -q 'data-guard-source-time-probe="pass"' /tmp/guard-source-time-dom.html
          sed -n '/<pre id="report"/,/<\/pre>/p' /tmp/guard-source-time-dom.html
