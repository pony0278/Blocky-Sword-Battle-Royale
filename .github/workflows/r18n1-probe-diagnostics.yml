name: R18N.1 Probe Diagnostics

on:
  pull_request:
    branches:
      - feature/r18n1-stable-active-shield-intercept

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout R18N.1 branch
        uses: actions/checkout@v4
        with:
          ref: feature/r18n1-stable-active-shield-intercept
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Apply guarded R18N.1 integration
        run: node tools/action-studio/r18n1-stable-active-intercept-migration.mjs

      - name: Run compact TOP and RIGHT probe
        id: probe
        shell: bash
        run: |
          set -uo pipefail
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$BROWSER"
          python3 -m http.server 4175 > /tmp/r18n1-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" >/dev/null 2>&1 || true' EXIT
          sleep 2
          set +e
          BROWSER="$BROWSER" R18N1_PAGE_URL='http://127.0.0.1:4175/tools/action-studio/shield-driven-contact-coupling-lab.html' \
            node tools/action-studio/r18n1-active-intercept-browser-probe.mjs 2>&1 | tee r18n1-probe.log
          PROBE_EXIT=${PIPESTATUS[0]}
          set -e
          echo "R18N1_PROBE_EXIT=$PROBE_EXIT" | tee -a r18n1-probe.log
          cp /tmp/r18n1-http.log r18n1-http.log || true
          exit "$PROBE_EXIT"

      - name: Upload compact probe diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r18n1-probe-diagnostics
          path: |
            r18n1-probe.log
            r18n1-http.log
          if-no-files-found: warn
          retention-days: 1
