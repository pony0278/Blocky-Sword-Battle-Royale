name: R18M.3 UI Extraction

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/refactor/r18m3-extract-ui.mjs'
      - '.github/workflows/r18m3-ui-extraction.yml'

permissions:
  contents: write

jobs:
  extract-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout refactor branch
        uses: actions/checkout@v4
        with:
          ref: refactor/shield-parry-r18m-maintainability
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Normalize extraction script
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/refactor/r18m3-extract-ui.mjs')
          text = path.read_text()
          start = text.index('const uiTest = `')
          end = text.index('`;\n\nawait mkdir', start) + 2
          replacement = r'''const uiTest = `import test from 'node:test';\nimport assert from 'node:assert/strict';\nimport { readFile } from 'node:fs/promises';\nimport { SHIELD_PARRY_LAB_REQUIRED_DOM_IDS } from '../tools/action-studio/shield-parry-r281/lab-dom.js';\n\nconst entry = await readFile(new URL('../tools/action-studio/shield-driven-contact-coupling-lab-r281.js', import.meta.url), 'utf8');\nconst ui = await readFile(new URL('../tools/action-studio/shield-parry-r281/lab-ui.js', import.meta.url), 'utf8');\nconst stance = await readFile(new URL('../tools/action-studio/shield-parry-r281/stance-debug-controls.js', import.meta.url), 'utf8');\n\ntest('R18M.3 entry delegates DOM, stance debug, Parry cue, HUD, and input bindings', () => {\n  assert.match(entry, /shield-parry-r281\\/lab-dom\\.js/);\n  assert.match(entry, /shield-parry-r281\\/stance-debug-controls\\.js/);\n  assert.match(entry, /shield-parry-r281\\/lab-ui\\.js/);\n  assert.doesNotMatch(entry, /const hudAttack = document\\.getElementById/);\n  assert.doesNotMatch(entry, /let parryCueState = null/);\n  assert.doesNotMatch(entry, /hudAttack\\.textContent/);\n  assert.doesNotMatch(entry, /function isParryKey\\(/);\n  assert.doesNotMatch(entry, /document\\.addEventListener\\('keydown'/);\n  assert.match(entry, /labUi\\.updateParryCue\\(\\{/);\n  assert.match(entry, /labUi\\.updateHud\\(\\{/);\n  assert.match(entry, /bindShieldParryLabUiEvents\\(\\{/);\n  assert.ok(entry.split('\\n').length < 1850, 'R281 entry should become materially smaller after UI extraction');\n});\n\ntest('R18M.3 UI module owns presentation/input wiring but no combat success authority', () => {\n  assert.match(ui, /PARRY NOW! · PRESS F/);\n  assert.match(ui, /keyboard-f-keyup-fallback/);\n  assert.match(ui, /input-flash/);\n  assert.match(ui, /retry-attention/);\n  assert.match(ui, /review hold 最多 1\\.5s/);\n  assert.doesNotMatch(ui, /parryGate\\.arm\\(/);\n  assert.doesNotMatch(ui, /parryGate\\.confirm\\(/);\n  assert.doesNotMatch(ui, /combat\\.resolveContact\\(/);\n  assert.doesNotMatch(ui, /swordGripConstraint\\.(?:start|update)\\(/);\n});\n\ntest('R18M.3 stance debug module preserves existing query keys and remains guidance-only', () => {\n  for (const query of ['leadMs', 'crouchCm', 'crouchSpeed', 'edgeCm', 'planeCm', 'lowGapCm', 'downRatio', 'kneeBandCm', 'armAttemptCm']) {\n    assert.match(stance, new RegExp(\"query: '\" + query + \"'\"));\n  }\n  assert.match(stance, /profile\\[spec\\.profileKey\\] = value \\* spec\\.scale/);\n  assert.doesNotMatch(stance, /combat\\.|parryGate\\.|swordGripConstraint\\./);\n});\n\ntest('R18M.3 DOM contract keeps all current HUD, controls, and debug elements explicit', () => {\n  for (const id of ['hudAttack', 'hudInput', 'parryCue', 'hudDiagnostic', 'status', 'report', 'autoRepeat', 'slowReview', 'showSurface', 'forceOldB3', 'parryNow', 'retryAttack', 'stanceDebugPanel', 'debugApplyRetry', 'debugResetDefaults']) {\n    assert.ok(SHIELD_PARRY_LAB_REQUIRED_DOM_IDS.includes(id), 'missing DOM contract id: ' + id);\n  }\n});\n`;'''
          text = text[:start] + replacement + text[end:]
          text = text.replace(
              "    \"document.querySelectorAll('[data-attack]').forEach\",\n    'function frame(timestamp) {',",
              "    \"document.querySelectorAll('[data-attack]').forEach((button) => button.addEventListener('click'\",\n    'function frame(timestamp) {',",
          )
          path.write_text(text)
          PY

      - name: Extract R18M.3 UI modules
        run: node tools/refactor/r18m3-extract-ui.mjs

      - name: Normalize extracted whitespace
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for filename in [
              'tools/action-studio/shield-parry-r281/lab-dom.js',
              'tools/action-studio/shield-parry-r281/stance-debug-controls.js',
              'tools/action-studio/shield-parry-r281/lab-ui.js',
              'tools/action-studio/shield-driven-contact-coupling-lab-r281.js',
              'tests/shield-parry-r281-ui.test.js',
          ]:
              path = Path(filename)
              path.write_text('\n'.join(line.rstrip() for line in path.read_text().splitlines()) + '\n')
          PY

      - name: Syntax check R18M.3 browser modules
        run: |
          node --check tools/action-studio/shield-parry-r281/lab-dom.js
          node --check tools/action-studio/shield-parry-r281/stance-debug-controls.js
          node --check tools/action-studio/shield-parry-r281/lab-ui.js
          node --check tools/action-studio/shield-driven-contact-coupling-lab-r281.js

      - name: Run focused R18M regression contracts
        run: node --test tests/shield-driven-contact-coupling-r281-regression.test.js tests/shield-parry-r281-diagnostics.test.js tests/shield-parry-r281-ui.test.js

      - name: Commit extracted UI modules
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            package.json \
            tests/shield-parry-r281-ui.test.js \
            tools/action-studio/shield-driven-contact-coupling-lab-r281.js \
            tools/action-studio/shield-parry-r281/lab-dom.js \
            tools/action-studio/shield-parry-r281/stance-debug-controls.js \
            tools/action-studio/shield-parry-r281/lab-ui.js
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No extraction changes to commit.'
          else
            git commit -m 'R18M.3 extract R281 UI and debug surface'
            git push origin HEAD:refactor/shield-parry-r18m-maintainability
          fi
