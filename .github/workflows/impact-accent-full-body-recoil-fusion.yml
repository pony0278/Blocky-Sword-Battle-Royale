name: G4.3B.5R.2.4.2 Impact Accent Full-Body Recoil Fusion

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/combat/impact-accent-full-body-recoil-fusion.js'
      - 'src/combat/shield-driven-contact-coupling.js'
      - 'src/combat/attacker-recoil-presentation.js'
      - 'src/combat/post-coupling-recoil-stagger-handoff.js'
      - 'tools/action-studio/shield-driven-contact-coupling-lab.html'
      - 'tools/action-studio/shield-driven-contact-coupling-lab.js'
      - 'tests/impact-accent-full-body-recoil-fusion.test.js'
      - 'tests/contact-release-separation-motion.test.js'
      - 'tests/contact-release-separation-motion-lab-contract.test.js'
      - 'tests/post-coupling-recoil-stagger-handoff.test.js'
      - 'tests/attacker-recoil-presentation.test.js'
      - '.github/workflows/impact-accent-full-body-recoil-fusion.yml'
  push:
    branches:
      - 'g43b5r242-impact-accent-full-body-recoil-fusion'

permissions:
  contents: read

jobs:
  fusion-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Verify fusion runtime and lab syntax
        run: >-
          node --check src/combat/impact-accent-full-body-recoil-fusion.js &&
          node --check src/combat/shield-driven-contact-coupling.js &&
          node --check src/combat/attacker-recoil-presentation.js &&
          node --check tools/action-studio/shield-driven-contact-coupling-lab.js

      - name: Run impact accent and full-body recoil regressions
        run: >-
          node --test
          tests/impact-accent-full-body-recoil-fusion.test.js
          tests/contact-release-separation-motion.test.js
          tests/contact-release-separation-motion-lab-contract.test.js
          tests/post-coupling-recoil-stagger-handoff.test.js
          tests/attacker-recoil-presentation.test.js
