<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>G3.5.1P Parry Contact → Deflect Probe</title>
  <style>
    html,body{margin:0;height:100%;background:#090e16;color:#e9f0fb;font:14px/1.45 system-ui,sans-serif}body{display:grid;grid-template-columns:minmax(0,1fr) 430px;overflow:hidden}main{position:relative;min-width:0}canvas{width:100%;height:100%;display:block}.hud{position:absolute;left:16px;top:16px;background:#07101acc;border:1px solid #26354d;border-radius:10px;padding:10px 12px;font:12px/1.45 ui-monospace,monospace}.good{color:#7ef0ad}.bad{color:#ff8c8c}.warn{color:#ffd27a}aside{overflow:auto;border-left:1px solid #26354d;padding:18px;background:#0e1521}h1{font-size:18px;margin:0 0 6px}h2{font-size:13px;margin:20px 0 8px;color:#94b8e8;text-transform:uppercase;letter-spacing:.08em}button{background:#182338;color:#dce9fb;border:1px solid #334969;border-radius:7px;padding:8px 10px;margin:3px;cursor:pointer}button:hover,button.on{background:#2b4268}.row{display:flex;flex-wrap:wrap}.note{color:#9eb0c8;font-size:12px}label{display:block;margin:10px 0}input[type=range]{width:100%}output{float:right;color:#9fd0ff}pre{white-space:pre-wrap;background:#080d14;border:1px solid #243147;border-radius:8px;padding:10px;font-size:11px}
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>
  <main>
    <canvas id="canvas"></canvas>
    <div class="hud"><b>G3.5.1P · Contact → Deflect</b><div id="hudState">Loading…</div><div id="hudDetail"></div></div>
  </main>
  <aside>
    <h1>Parry Presentation Probe</h1>
    <div class="note">先讓敵人武器「撞到盾牌」，再把 shield-bash motion 當作撥開段。此頁只驗證視覺，不改 production Parry / combat authority。</div>
    <h2>Variant</h2>
    <div class="row"><button data-variant="parry" class="on">Normal · blockbash</button><button data-variant="perfect">Power · blockbashpower</button></div>
    <div class="row"><button id="playToggle">▶ Play chain</button><button id="restart">↺ Restart</button></div>
    <label>Chain elapsed <output id="timeLabel">0 ms</output><input id="timeline" type="range" min="0" max="600" step="1" value="0"></label>
    <h2>Contact</h2>
    <label>Block Hit end <output id="contactEndValue">0.180s</output><input id="contactEnd" type="range" min="0.06" max="0.40" step="0.005" value="0.18"></label>
    <label>Impact hold / hitstop <output id="holdValue">65ms</output><input id="holdMs" type="range" min="0" max="160" step="5" value="65"></label>
    <label>Crossfade <output id="blendValue">55ms</output><input id="blendMs" type="range" min="0" max="160" step="5" value="55"></label>
    <h2>Deflect source trim</h2>
    <label>Start <output id="deflectStartValue">0.040s</output><input id="deflectStart" type="range" min="0" max="0.50" step="0.005" value="0.04"></label>
    <label>End <output id="deflectEndValue">0.300s</output><input id="deflectEnd" type="range" min="0.08" max="0.70" step="0.005" value="0.30"></label>
    <label>Blend lead <output id="blendLeadValue">0.045s</output><input id="blendLead" type="range" min="0" max="0.14" step="0.005" value="0.045"></label>
    <label>Deflect speed <output id="deflectRateValue">1.00×</output><input id="deflectRate" type="range" min="0.5" max="1.8" step="0.05" value="1"></label>
    <h2>View</h2>
    <div class="row"><button data-view="front">Front</button><button data-view="three">3/4</button><button data-view="side">Side</button><button data-view="back">Back</button></div>
    <h2>Verification</h2>
    <div id="status" class="warn">Loading Skyrim Guard family…</div>
    <pre id="report">Not run.</pre>
  </aside>
  <script type="module" src="./parry-contact-deflect-probe.js"></script>
</body>
</html>
